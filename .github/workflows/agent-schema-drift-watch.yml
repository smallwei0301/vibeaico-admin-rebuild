name: agent-schema-drift-watch
'on':
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA to observe
        required: true
        type: string
      artifact_suffix:
        description: Distinguish pre/post release evidence artifacts
        required: false
        default: evidence
        type: string
  workflow_call:
    inputs:
      expected_main_sha:
        description: Exact current main SHA to observe
        required: true
        type: string
      artifact_suffix:
        description: Distinguish pre/post release evidence artifacts
        required: false
        default: evidence
        type: string
      release_ledger_binding:
        description: Exact completed G3 plan/run binding from trusted orchestrator admission
        required: false
        default: ''
        type: string
    secrets:
      SCHEMA_OBSERVER_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: schema-drift-watch-${{ inputs.expected_main_sha }}-${{ inputs.artifact_suffix }}
  cancel-in-progress: false
jobs:
  read-only-three-way:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_HEAD: ${{ inputs.expected_main_sha }}
      TEST_PROFILE: SOURCE_ONLY
      LOCAL_PROJECT_ID: schema-proof-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.artifact_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked schema observer dependencies
        run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Verify exact main and dedicated read-only credential
        env:
          SCHEMA_OBSERVER_TOKEN: ${{ secrets.SCHEMA_OBSERVER_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          test "$TEST_PROFILE" = SOURCE_ONLY
          test -n "$SCHEMA_OBSERVER_TOKEN"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
      - name: Build and replay a disposable canonical local database
        run: |
          node scripts/agents/fresh-install-baseline.mjs "$RUNNER_TEMP/schema-bootstrap"
          cd "$RUNNER_TEMP/schema-bootstrap"
          supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Capture local expected metadata without saving raw SQL
        run: |
          (cd "$RUNNER_TEMP/schema-bootstrap" && supabase status --output json) >"$RUNNER_TEMP/local-supabase-status.json"
          node --input-type=module >"$RUNNER_TEMP/local-raw.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { captureLocalExpectedSnapshot } from './scripts/agents/schema-drift-watch.mjs';
          const status = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/local-supabase-status.json`, 'utf8'));
          if (typeof status.DB_URL !== 'string') throw new Error('SUPABASE_LOCAL_DB_URL_MISSING');
          const snapshot = await captureLocalExpectedSnapshot({ connectionString: status.DB_URL });
          process.stdout.write(`${JSON.stringify(snapshot)}\n`);
          NODE
          node scripts/agents/schema-drift-watch.mjs --command normalize --environment LOCAL_EXPECTED --project-ref local-fresh --current-main-sha "$EXPECTED_MAIN_SHA" --raw-json "$RUNNER_TEMP/local-raw.json" --json-out "$RUNNER_TEMP/expected.json"
      - name: Capture TEST and Production through read-only API only
        env:
          SCHEMA_OBSERVER_TOKEN: ${{ secrets.SCHEMA_OBSERVER_TOKEN }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/config/supabase-production-root-bundle.crt
        run: |
          set -euo pipefail
          test -s "$NODE_EXTRA_CA_CERTS"
          node scripts/agents/schema-drift-watch.mjs --command capture --environment TEST --current-main-sha "$EXPECTED_MAIN_SHA" --json-out "$RUNNER_TEMP/test.json"
          node scripts/agents/schema-drift-watch.mjs --command capture --environment PRODUCTION --current-main-sha "$EXPECTED_MAIN_SHA" --json-out "$RUNNER_TEMP/production.json"
      - name: Compare exact object fingerprints and fail closed
        env:
          RELEASE_LEDGER_BINDING: ${{ inputs.release_ledger_binding }}
        run: |
          binding_args=()
          if test -n "$RELEASE_LEDGER_BINDING"; then
            node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-ledger-binding.json`, JSON.stringify(JSON.parse(process.env.RELEASE_LEDGER_BINDING)));'
            binding_args=(--release-ledger-binding "$RUNNER_TEMP/release-ledger-binding.json")
          fi
          node scripts/agents/schema-drift-watch.mjs --command compare --expected-snapshot "$RUNNER_TEMP/expected.json" --test-snapshot "$RUNNER_TEMP/test.json" --production-snapshot "$RUNNER_TEMP/production.json" --current-main-sha "$EXPECTED_MAIN_SHA" --exceptions docs/schema-truth/schema-drift-exceptions.json --json-out "$RUNNER_TEMP/report.json" "${binding_args[@]}"
      - name: Preserve sanitized normalized schema snapshots
        if: ${{ always() }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { buildUnavailableSnapshot, normalizeObserverSnapshot } from './scripts/agents/schema-drift-watch.mjs';
          const snapshots = [['expected.json', 'LOCAL_EXPECTED'], ['test.json', 'TEST'], ['production.json', 'PRODUCTION']].map(([name, environment]) => {
            const input = `${process.env.RUNNER_TEMP}/${name}`;
            try {
              const normalized = normalizeObserverSnapshot(JSON.parse(readFileSync(input, 'utf8')), process.env.EXPECTED_MAIN_SHA);
              if (normalized.environment !== environment) throw new Error('SNAPSHOT_ENVIRONMENT_MISMATCH');
              return [name, normalized];
            } catch (error) {
              return [name, buildUnavailableSnapshot({ environment, observedMainSha: process.env.EXPECTED_MAIN_SHA,
                reason: error.code === 'ENOENT' ? 'SNAPSHOT_MISSING' : 'SNAPSHOT_INVALID' })];
            }
          });
          const output = `${process.env.RUNNER_TEMP}/schema-snapshots`;
          mkdirSync(output, { recursive: true });
          for (const [name, snapshot] of snapshots) writeFileSync(`${output}/${name}`, `${JSON.stringify(snapshot, null, 2)}\n`, { mode: 0o600 });
          console.log(JSON.stringify({ snapshotStatuses: Object.fromEntries(snapshots.map(([name, snapshot]) => [name, snapshot.status])) }));
          NODE
      - name: Emit sanitized drift report summary
        if: ${{ always() }}
        run: |
          if test -s "$RUNNER_TEMP/report.json"; then
            node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/report.json')); console.log(JSON.stringify({status:r.status,differenceCount:r.differenceCount,environmentStatuses:r.environmentStatuses ?? null,fullEnvironmentParityProven:r.safety.fullEnvironmentParityProven,authorizesDatabaseWrite:r.safety.authorizesDatabaseWrite}));"
          else
            echo '{"status":"EVIDENCE_UNAVAILABLE","reason":"REPORT_NOT_WRITTEN"}'
          fi
      - name: Upload sanitized drift report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-report-${{ github.run_id }}-${{ inputs.artifact_suffix }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload sanitized schema snapshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-snapshots-${{ github.run_id }}-${{ inputs.artifact_suffix }}
          path: |
            ${{ runner.temp }}/schema-snapshots/expected.json
            ${{ runner.temp }}/schema-snapshots/test.json
            ${{ runner.temp }}/schema-snapshots/production.json
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy disposable local database
        if: ${{ always() }}
        run: test ! -d "$RUNNER_TEMP/schema-bootstrap" || (cd "$RUNNER_TEMP/schema-bootstrap" && supabase stop --no-backup)
# Manual dispatch remains available for diagnosis. workflow_call lets a trusted-main
# release gate obtain the same read-only schema evidence without human approval.
