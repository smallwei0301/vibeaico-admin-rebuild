name: agent-workstream-watch

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-workstream-watch.yml'
      - 'scripts/agents/workstream-classification-watch.mjs'
      - 'scripts/agents/issue-provenance-policy.mjs'
      - 'scripts/agents/astra-review-policy.mjs'
      - 'scripts/agents/governance-workstream-boundary.mjs'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-workstream-watch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default-branch classification policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/agents
      - name: Read classification drift without changing any Issue or PR
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const policySha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const { observeClassifications } = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/agents/workstream-classification-watch.mjs',
            )).href);
            const report = await observeClassifications({ github, ...context.repo, policySha });
            fs.writeFileSync('workstream-observation.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary.addHeading('Workstream classification observation')
              .addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
            if (report.status !== 'PASS') core.setFailed(`${report.status}: ${report.findings.length} findings, ${report.unavailable.length} unavailable`);
      - name: Preserve the observation even when drift was detected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstream-observation
          path: workstream-observation.json
          if-no-files-found: error
          retention-days: 14
