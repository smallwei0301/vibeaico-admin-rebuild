name: Governance 528 reviewed metadata cleanup
on:
  push:
    branches: [governance/issue-528-reconciliation-audit]
    paths: [.github/workflows/governance-528-apply.yml]
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  reconcile:
    if: github.repository == 'smallwei0301/vibeaico-admin-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4db7496a9b0b2e08f432a720e0342f29b6f47f98
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs');
            const crypto=require('node:crypto');
            const {execFileSync}=require('node:child_process');
            const {pathToFileURL}=require('node:url');
            const {owner,repo}=context.repo;
            const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
            const policySha='4db7496a9b0b2e08f432a720e0342f29b6f47f98';
            const root=process.cwd()+'/reconciliation';
            fs.mkdirSync(root+'/capture',{recursive:true});
            const artifact=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:10481436108,archive_format:'zip'});
            const bytes=Buffer.from(artifact.data);
            if(sha(bytes)!=='4bbc0299cb1cb34036b8b75a7e703508003e1006a2eb174d6048de8e5b710ce0')throw new Error('Reviewed source artifact digest mismatch');
            fs.writeFileSync(root+'/source.zip',bytes);
            execFileSync('python3',['-c',"import zipfile,pathlib,sys; p=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(p/'source.zip'); [(p/'capture'/n).write_bytes(z.read(n)) for n in ('items.json','observation.json')];",root]);
            for(const name of ['.governance-528-build-plan.mjs','.governance-528-metadata-worker.mjs']){
              const f=(await github.rest.repos.getContent({owner,repo,path:name,ref:context.sha})).data;
              if(Array.isArray(f)||f.encoding!=='base64')throw new Error('Missing reviewed helper');
              fs.writeFileSync(name,Buffer.from(f.content,'base64'));
            }
            execFileSync('node',['.governance-528-build-plan.mjs'],{encoding:'utf8',env:{...process.env,RECONCILIATION_ROOT:root},stdio:'inherit'});
            const planBytes=fs.readFileSync(root+'/metadata-plan.json');
            if(sha(planBytes)!=='20ea1302e618e715c3caa6ba229f5da777492b756305e9aba18c9e486750d785')throw new Error('Plan is not the exact locally reviewed plan');
            const plan=JSON.parse(planBytes);
            if(plan.plans.length!==101||plan.policySha!==policySha)throw new Error('Unexpected reviewed scope');
            const originals=new Map(JSON.parse(fs.readFileSync(root+'/capture/items.json')).map(i=>[i.number,i]));
            const {propose,verifyAfter}=await import(pathToFileURL(process.cwd()+'/.governance-528-metadata-worker.mjs').href);
            const {observeClassifications}=await import(pathToFileURL(process.cwd()+'/scripts/agents/workstream-classification-watch.mjs').href);
            const sleep=()=>new Promise(r=>setTimeout(r,1100));
            const read=async p=>(await (p.k==='PR'?github.rest.pulls.get({owner,repo,pull_number:p.n}):github.rest.issues.get({owner,repo,issue_number:p.n}))).data;
            const labels=i=>(i.labels||[]).map(l=>typeof l==='string'?l:l.name);
            const snap=i=>JSON.stringify([i.body,i.state,i.state_reason,i.draft,i.head?.sha,i.base?.sha,labels(i).sort()]);
            const results=[];const proof=[];
            const mainBefore=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if(mainBefore!==policySha)throw new Error('Main changed before reviewed cleanup; re-review required');
            for(const p of plan.plans){
              let wrote=false;
              try{
                const before=await read(p);
                const files=p.k==='PR'?await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:p.n,per_page:100}):null;
                const proposal=propose(before,files,p,originals.get(p.n));
                const fresh=await read(p);
                if(snap(fresh)!==snap(before))throw new Error('ITEM_CHANGED_BEFORE_WRITE');
                const itemProof={number:p.n,kind:p.k,url:before.html_url,before:{body:before.body,labels:labels(before),state:before.state,state_reason:before.state_reason,merged:before.merged,merged_at:before.merged_at,closed_at:before.closed_at,head:before.head?.sha,base:before.base?.sha},expectedBodyHash:proposal.bodyHash,reason:'Owner continued #528; exact reviewed classification/lifecycle metadata cleanup, not a delivery claim'};
                proof.push(itemProof);
                fs.writeFileSync(root+'/apply-proof.json',JSON.stringify(proof,null,2)+'\n');
                if(p.edits.length){
                  if(p.k==='PR')await github.rest.pulls.update({owner,repo,pull_number:p.n,body:proposal.body});
                  else await github.rest.issues.update({owner,repo,issue_number:p.n,body:proposal.body});
                  wrote=true;await sleep();
                }
                for(const name of p.remove){
                  if(!labels(before).includes(name))continue;
                  try{await github.rest.issues.removeLabel({owner,repo,issue_number:p.n,name});wrote=true;await sleep();}
                  catch(e){if(e.status!==404)throw e;}
                }
                const add=p.add.filter(n=>!labels(before).includes(n));
                if(add.length){await github.rest.issues.addLabels({owner,repo,issue_number:p.n,labels:add});wrote=true;await sleep();}
                const after=await read(p);
                const verdict=verifyAfter(before,after,files,p,proposal);
                itemProof.after={body:after.body,labels:labels(after),state:after.state,state_reason:after.state_reason,merged:after.merged,merged_at:after.merged_at,closed_at:after.closed_at,head:after.head?.sha,base:after.base?.sha};
                itemProof.verdict=verdict;
                results.push({number:p.n,kind:p.k,status:'VERIFIED_RECONCILED',bodyChanged:p.edits.length>0,labelsAdded:add,labelsRemoved:p.remove,workstream:verdict.workstream,checkedAt:new Date().toISOString()});
              }catch(e){
                results.push({number:p.n,kind:p.k,status:wrote?'APPLIED_NEEDS_READBACK':'SKIPPED_CHANGED_OR_INVALID',reason:e.status?`HTTP_${e.status}`:String(e.message)});
                if(e.status===403||e.status===429||wrote){core.warning('Stopping after a write/permission uncertainty; no blind retry');break;}
              }
              fs.writeFileSync(root+'/apply-results.json',JSON.stringify(results,null,2)+'\n');
              fs.writeFileSync(root+'/apply-proof.json',JSON.stringify(proof,null,2)+'\n');
              if(results.length%10===0)core.info(`Read back ${results.length}/${plan.plans.length} reviewed items`);
            }
            fs.writeFileSync(root+'/apply-results.json',JSON.stringify(results,null,2)+'\n');
            fs.writeFileSync(root+'/apply-proof.json',JSON.stringify(proof,null,2)+'\n');
            const after=await observeClassifications({github,owner,repo,policySha});
            fs.writeFileSync(root+'/after-observation.json',JSON.stringify(after,null,2)+'\n');
            const mainAfter=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            const summary={runId:context.runId,policySha,mainBefore,mainAfter,planCount:101,verified:results.filter(r=>r.status==='VERIFIED_RECONCILED').length,notVerified:results.filter(r=>r.status!=='VERIFIED_RECONCILED'),after:{observedAt:after.observedAt,counts:after.counts,status:after.status,findings:after.findings.length,unavailable:after.unavailable.length},sourceChanges:0,issueStateChanges:0,prMerges:0,databaseWrites:0};
            fs.writeFileSync(root+'/summary.json',JSON.stringify(summary,null,2)+'\n');
            core.info(JSON.stringify(summary));
            await core.summary.addHeading('Issue 528 reviewed metadata cleanup').addCodeBlock(JSON.stringify(summary,null,2),'json').write();
            if(summary.notVerified.length||summary.verified!==101)core.setFailed('Cleanup partial; inspect exact per-item evidence, do not blindly rerun');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-528-metadata-closeout
          path: reconciliation/
          if-no-files-found: error
          retention-days: 14
