name: Retrospective audit 2026-09-22 081856
on:
  push:
    branches: [audit/retro-20260922-081856]
    paths: [.github/workflows/retro-20260922-081856.yml]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c6c8bd3715bf17532a7742492f2998a25cf5f95
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Execute Product score surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retro"
          ledger=docs/metrics/agent-runs/2026-09-21-product-delivery-r03.json
          node scripts/agents/run-ledger-v2.mjs validate "$ledger" | tee "$RUNNER_TEMP/retro/product-ledger-validate.txt"
          node scripts/agents/scorecard-readiness.mjs "$ledger" --json | tee "$RUNNER_TEMP/retro/product-readiness.json"
          set +e
          node scripts/agents/scorecard-readiness.mjs "$ledger" --strict-live > "$RUNNER_TEMP/retro/product-readiness-strict.txt" 2>&1
          strict_exit=$?
          set -e
          printf '%s\n' "$strict_exit" > "$RUNNER_TEMP/retro/product-readiness-strict-exit.txt"
          node scripts/agents/score-run-current.mjs "$ledger" | tee "$RUNNER_TEMP/retro/product-score.md"
          node scripts/agents/review-runs-v2.mjs docs/metrics/agent-runs | tee "$RUNNER_TEMP/retro/product-trend.md"
      - name: Execute Governance score surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/metrics/governance-scoreboard.mjs \
            docs/metrics/agent-runs/2026-09-09-governance-loop-r01.json \
            docs/metrics/review-evidence/2026-09-09-governance-loop-r01.json \
            docs/metrics/governance-scoreboard-policy.json \
            | tee "$RUNNER_TEMP/retro/governance-formal-scoreboard.md"
          node scripts/metrics/governance-observation.mjs \
            --repo smallwei0301/vibeaico-admin-rebuild \
            --since 2026-09-21T12:18:56Z \
            --until 2026-09-22T00:18:56Z \
            --json | tee "$RUNNER_TEMP/retro/governance-current-observation.json"
      - name: Write execution receipt
        shell: bash
        run: |
          set -euo pipefail
          strict_exit="$(cat "$RUNNER_TEMP/retro/product-readiness-strict-exit.txt")"
          cat > "$RUNNER_TEMP/retro/RETROSPECTIVE-EXECUTION-RECEIPT.md" <<EOF
          # Retrospective Execution Receipt
          RETROSPECTIVE_EXECUTION_RECEIPT_REQUIRED
          OBSERVED_MAIN: 2c6c8bd3715bf17532a7742492f2998a25cf5f95
          WINDOW_UTC: 2026-09-21T12:18:56Z..2026-09-22T00:18:56Z
          WINDOW_TW: 2026-09-21T20:18:56+08:00..2026-09-22T08:18:56+08:00
          Product:
          - run-ledger-v2 validate: EXECUTED
          - scorecard-readiness --json: EXECUTED
          - scorecard-readiness --strict-live: EXECUTED exit=$strict_exit
          - score-run-current: EXECUTED
          - review-runs-v2: EXECUTED
          Governance:
          - governance-scoreboard formal replay: EXECUTED
          - governance-observation exact-window: EXECUTED
          EOF
          cat "$RUNNER_TEMP/retro/RETROSPECTIVE-EXECUTION-RECEIPT.md"
      - uses: actions/upload-artifact@v4
        with:
          name: retrospective-20260922-081856-execution
          path: ${{ runner.temp }}/retro/
          if-no-files-found: error
          retention-days: 14
