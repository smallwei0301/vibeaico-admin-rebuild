name: patch-ledger-tests-once
on:
  push:
    branches: [product/issue-447-release-workflow-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/issue-447-release-workflow-v1
          fetch-depth: 0
      - name: Update hard-coded ledger truth assertions and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/unit/ledger-alias-map.396.test.ts')
          s=p.read_text()
          s=s.replace('repo 端多出尚未套用的 0105、0109、0110 與本候選的 0111，正式庫快照維持 57 筆', 'repo 端尚未套用的是 0109、0110 與本候選的 0111；0105 已於 2026-09-15 出現在正式庫 provider ledger，正式庫快照為 58 筆')
          s=s.replace("it('repo 有 60 個 migration 檔案，正式庫快照有 57 筆 ledger row'", "it('repo 有 60 個 migration 檔案，正式庫快照有 58 筆 ledger row'")
          s=s.replace('expect(snapshot.ledgerRowNames).toHaveLength(57);', 'expect(snapshot.ledgerRowNames).toHaveLength(58);')
          s=s.replace("it('supabase/ledger-alias-map.json 完全涵蓋這 60 個 repo 檔案與 57 筆 ledger row'", "it('supabase/ledger-alias-map.json 完全涵蓋這 60 個 repo 檔案與 58 筆 ledger row'")
          s=s.replace("it('分類統計符合已查證的事實：50 EXACT、6 ALIAS、3 NOT_APPLIED、1 LEDGER_ONLY'", "it('分類統計符合已查證的事實：51 EXACT、6 ALIAS、3 NOT_APPLIED、1 LEDGER_ONLY'")
          s=s.replace('再次重新擷取本快照（49 → 50）。尚未套用的是 0105、0109、0110 與本候選的\n    // 0111，所以 NOT_APPLIED 是 4。四者依 AGENTS.md 的規則，在合併進 main 之前\n    // 都不是任何環境的套用授權。', '再次重新擷取本快照（49 → 50）。2026-09-15 唯讀重擷取確認 0105 已在 Production\n    // provider ledger，因此轉為 EXACT（50 → 51）。尚未套用的是 0109、0110 與本候選的\n    // 0111，所以 NOT_APPLIED 是 3。')
          s=s.replace('expect(counts.EXACT).toBe(50);', 'expect(counts.EXACT).toBe(51);')
          s=s.replace('expect(counts.NOT_APPLIED ?? 0).toBe(4);', 'expect(counts.NOT_APPLIED ?? 0).toBe(3);')
          s=s.replace('expect(notApplied.length).toBe(4);', 'expect(notApplied.length).toBe(3);')
          p.write_text(s)
          PY
          rm .github/workflows/patch-ledger-tests-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/ledger-alias-map.396.test.ts .github/workflows/patch-ledger-tests-once.yml
          git commit -m 'test(#447): sync ledger assertions after Production 0105'
          git push origin HEAD:product/issue-447-release-workflow-v1
