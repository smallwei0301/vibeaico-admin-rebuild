name: issue-447-production-credential-probe
on:
  push:
    branches: [product/issue-447-credential-proof-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dedicated credential shape without printing secrets
        shell: bash
        env:
          WRITER: ${{ secrets.PRODUCTION_DB_RELEASE_TOKEN }}
          SCHEMA_OBSERVER: ${{ secrets.SCHEMA_OBSERVER_TOKEN }}
          BACKUP_OBSERVER: ${{ secrets.SUPABASE_BACKUP_OBSERVER_TOKEN }}
          CLASSIC: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WRITER"
          case "$WRITER" in sbp_fc*) ;; *) echo 'WRITER_NOT_SCOPED_PAT' >&2; exit 1;; esac
          test -n "$SCHEMA_OBSERVER"
          test -n "$BACKUP_OBSERVER"
          test "$WRITER" != "$SCHEMA_OBSERVER"
          test "$WRITER" != "$BACKUP_OBSERVER"
          if [ -n "${CLASSIC:-}" ]; then
            echo 'CLASSIC_FALLBACK_PRESENT' >&2
            exit 1
          fi
          echo 'SCOPED_PRODUCTION_WRITER_CREDENTIAL_SHAPE_OK'
