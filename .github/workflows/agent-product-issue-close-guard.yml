name: product-issue-close-guard

on:
  issues:
    types: [closed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: product-issue-close-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted Product Issue close policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/agents/product-issue-close-policy.mjs
            scripts/agents/issue-provenance-policy.mjs
            scripts/agents/agent-wip-policy.mjs
            scripts/agents/astra-review-policy.mjs
            scripts/agents/final-risk-cost-policy.mjs
            scripts/agents/model-routing.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate Product Issue close admission
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/product-issue-close-policy.mjs',
            )).href);
            const astra = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/agents/astra-review-policy.mjs',
            )).href);

            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber,
            });
            if (issue.pull_request || issue.state !== 'closed') return;

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: branch } = await github.rest.repos.getBranch({
              owner, repo, branch: repository.default_branch,
            });
            const currentMainSha = branch.commit.sha;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const trustedComments = [];
            for (const comment of comments) {
              const login = comment.user?.login ?? '';
              if (!login) continue;
              if (astra.isTrustedFinalRiskAgentUser(comment.user ?? {})) {
                trustedComments.push({ ...comment, trusted: true });
                continue;
              }
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                if (['admin', 'maintain', 'write'].includes(permission.permission)) trustedComments.push({ ...comment, trusted: true });
              } catch (error) {
                core.warning(`Unable to verify Issue commenter ${login}: ${error.status ?? error.message}`);
              }
            }
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const closedPullRequests = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
            });

            const systemCaptures = comments
              .filter((comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.user?.type === 'Bot' &&
                comment.body?.includes(policy.PRODUCT_ISSUE_CLOSE_CAPTURE_MARKER))
              .map((comment) => ({ comment, handoff: policy.parseRunCaptureHandoff(comment.body ?? '') }))
              .filter((entry) => entry.handoff?.event === 'ISSUE_CLOSED_OBSERVED')
              .sort((a, b) => String(b.comment.created_at ?? '').localeCompare(String(a.comment.created_at ?? '')));
            const lastClosedCaptureAt = systemCaptures.find((entry) => entry.handoff?.observedAt !== issue.closed_at)?.comment?.created_at ?? null;

            const ready = policy.findCloseReadyHandoff(trustedComments, issue.closed_at ?? '');
            let verifiedRun = null;
            if (ready.handoff?.runId) {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: `docs/metrics/agent-runs/${ready.handoff.runId}.json`,
                  ref: repository.default_branch,
                });
                const data = response.data;
                if (!Array.isArray(data) && data.type === 'file' && data.encoding === 'base64' && typeof data.content === 'string') {
                  verifiedRun = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
                }
              } catch (error) {
                core.warning(`Unable to verify Product Run ${ready.handoff.runId}: ${error.status ?? error.message}`);
              }
            }

            let verifiedCloseApproval = null;
            const approvalCommentId = Number(
              ready.handoff?.closeApprovedRef?.match(/^github:issuecomment#(\d+)$/)?.[1] ?? 0,
            );
            if (approvalCommentId > 0) {
              try {
                const { data: approval } = await github.rest.issues.getComment({
                  owner, repo, comment_id: approvalCommentId,
                });
                const approvalBody = approval.body ?? '';
                const role = approvalBody.match(/^[ \t]*REVIEW_ROLE[ \t]*:[ \t]*(.+)$/mi)?.[1]?.trim()?.toUpperCase() ?? '';
                const verdict = approvalBody.match(/^[ \t]*VERDICT[ \t]*:[ \t]*(.+)$/mi)?.[1]?.trim()?.toUpperCase() ?? '';
                const approvalRunId = approvalBody.match(/^[ \\t]*RUN_ID[ \\t]*:[ \\t]*(.+)$/mi)?.[1]?.trim() ?? '';
                const exactHead = approvalBody.match(/^[ \t]*EXACT_HEAD[ \t]*:[ \t]*([0-9a-f]{40})$/mi)?.[1] ?? '';
                let reachableFromCurrentMain = false;
                if (/^[0-9a-f]{40}$/.test(exactHead)) {
                  const { data: compare } = await github.rest.repos.compareCommits({ owner, repo, base: exactHead, head: currentMainSha });
                  reachableFromCurrentMain = ['ahead', 'identical'].includes(compare.status);
                }
                const latestMerged = policy.latestMergedProductPull(issueNumber, closedPullRequests);
                let latestMergeReachableFromCurrentMain = false;
                if (/^[0-9a-f]{40}$/.test(latestMerged?.merge_commit_sha ?? '')) {
                  const { data: compare } = await github.rest.repos.compareCommits({ owner, repo, base: latestMerged.merge_commit_sha, head: currentMainSha });
                  latestMergeReachableFromCurrentMain = ['ahead', 'identical'].includes(compare.status);
                }
                const createdAt = Date.parse(approval.created_at ?? '');
                const updatedAt = Date.parse(approval.updated_at ?? approval.created_at ?? '');
                const closedAt = Date.parse(issue.closed_at ?? '');
                verifiedCloseApproval = {
                  commentId: approval.id,
                  role,
                  verdict,
                  runId: approvalRunId,
                  exactHead,
                  reachableFromCurrentMain,
                  latestMergeSha: latestMerged?.merge_commit_sha ?? '',
                  latestMergeReachableFromCurrentMain,
                  trusted: trustedComments.some((comment) => comment.id === approval.id),
                  sameIssue: String(approval.issue_url ?? '').endsWith(`/issues/${issueNumber}`),
                  beforeClose: Number.isFinite(createdAt) && Number.isFinite(updatedAt) && Number.isFinite(closedAt) &&
                    createdAt <= closedAt && updatedAt <= closedAt,
                  afterLastClose: !lastClosedCaptureAt || (
                    Number.isFinite(createdAt) && createdAt > Date.parse(lastClosedCaptureAt)
                  ),
                };
              } catch (error) {
                core.warning(`Unable to verify CLOSE_APPROVED comment #${approvalCommentId}: ${error.status ?? error.message}`);
              }
            }

            let verifiedCi = null;
            const workflowId = Number(
              ready.handoff?.evidenceRef?.match(/^github:workflow#(\d+)$/)?.[1] ?? 0,
            );
            if (workflowId > 0) {
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: workflowId,
                });
                verifiedCi = {
                  workflowId: run.id,
                  name: run.name,
                  workflowPath: run.path,
                  event: run.event,
                  conclusion: run.conclusion,
                  headSha: run.head_sha,
                };
              } catch (error) {
                core.warning(`Unable to verify close-ready workflow #${workflowId}: ${error.status ?? error.message}`);
              }
            }

            const result = policy.evaluateProductIssueClose({
              issue,
              currentMainSha,
              openPullRequests,
              mergedPullRequests: closedPullRequests,
              comments: trustedComments,
              verifiedCi,
              verifiedRun,
              verifiedCloseApproval,
              lastClosedCaptureAt,
            });

            await core.summary
              .addHeading('Product Issue close admission')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Result', header: true }],
                ['Issue', `#${issueNumber}`],
                ['Applicable', String(result.applicable)],
                ['Allowed', String(result.allowed)],
                ['Current main', currentMainSha],
                ['Run', result.runId ?? 'none'],
                ['Errors', result.errors.join('; ') || 'none'],
              ])
              .write();

            if (!result.applicable) return;

            const failureLabel = 'governance:premature-close';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: failureLabel });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: failureLabel, color: 'D93F0B',
                  description: 'Product Issue close was rejected by the executable close admission gate.',
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }

            if (!result.allowed) {
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: 'open',
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNumber, labels: [failureLabel],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  '<!-- product-issue-close-guard -->',
                  '## Product Issue close rejected and reopened',
                  '',
                  `CURRENT_MAIN: ${currentMainSha}`,
                  `RUN_ID: ${result.runId ?? 'missing'}`,
                  '',
                  ...result.errors.map((error) => `- ${error}`),
                  '',
                  'Fix the close-ready evidence or remaining linked PR first. Do not immediately close again or rewrite history to make the gate green.',
                ].join('\n'),
              });
              core.setFailed(result.errors.join('; '));
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issueNumber, name: failureLabel,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: freshIssue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            if (freshIssue.state !== 'closed' || freshIssue.closed_at !== issue.closed_at) {
              core.notice('Issue changed after close admission; skip ISSUE_CLOSED_OBSERVED capture');
              return;
            }
            const freshComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            if (!freshComments.some((comment) => {
              if (comment.user?.login !== 'github-actions[bot]' || comment.user?.type !== 'Bot') return false;
              if (!comment.body?.includes(policy.PRODUCT_ISSUE_CLOSE_CAPTURE_MARKER)) return false;
              const handoff = policy.parseRunCaptureHandoff(comment.body);
              return handoff?.event === 'ISSUE_CLOSED_OBSERVED' && handoff.observedAt === issue.closed_at;
            })) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: policy.renderIssueClosedCaptureHandoff({
                  issueNumber,
                  runId: result.runId,
                  observedAt: issue.closed_at,
                }),
              });
            }
