name: agent-schema-bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/local-migrations/historical-integration-baseline/**'
      - 'scripts/agents/schema-bootstrap-candidate.mjs'
      - 'scripts/agents/fresh-install-baseline.mjs'
      - 'scripts/agents/schema-bootstrap-policy.mjs'
      - 'supabase/local-migrations/fresh-install-compatibility-baseline/**'
      - 'scripts/test/seed.mjs'
      - 'scripts/test/tour-seed-profile.mjs'
      - 'scripts/test/verify-assignment-schema.mjs'
      - 'scripts/test/verify-business-type-schema.mjs'
      - 'tests/schema/assignment-schema-proof.test.mjs'
      - 'tests/schema/business-type-schema-proof.test.mjs'
      - 'tests/unit/schema-bootstrap-candidate.test.ts'
      - 'tests/unit/fresh-install-baseline.test.ts'
      - 'tests/unit/schema-bootstrap-policy.test.ts'
      - 'tests/unit/tour-seed-profile.test.ts'
      - 'tests/integration/api/guide-action-inbox.43.test.ts'
      - 'tests/integration/api/public-shop.46.test.ts'
      - '.github/workflows/agent-schema-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/local-migrations/historical-integration-baseline/**'
      - 'scripts/agents/schema-bootstrap-candidate.mjs'
      - 'scripts/agents/fresh-install-baseline.mjs'
      - 'scripts/agents/schema-bootstrap-policy.mjs'
      - 'supabase/local-migrations/fresh-install-compatibility-baseline/**'
      - 'scripts/test/seed.mjs'
      - 'scripts/test/tour-seed-profile.mjs'
      - 'scripts/test/verify-assignment-schema.mjs'
      - 'scripts/test/verify-business-type-schema.mjs'
      - 'tests/schema/assignment-schema-proof.test.mjs'
      - 'tests/schema/business-type-schema-proof.test.mjs'
      - 'tests/unit/schema-bootstrap-candidate.test.ts'
      - 'tests/unit/fresh-install-baseline.test.ts'
      - 'tests/unit/schema-bootstrap-policy.test.ts'
      - 'tests/unit/tour-seed-profile.test.ts'
      - 'tests/integration/api/guide-action-inbox.43.test.ts'
      - 'tests/integration/api/public-shop.46.test.ts'
      - '.github/workflows/agent-schema-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: schema-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-compatibility-candidate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCAL_PROJECT_ID: schema-proof-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_PROFILE: LOCAL_ISOLATED
      TEST_TOUR_SEED_PROFILE: CANONICAL_CORE
      TEST_ENV_ID: local-schema-${{ github.run_id }}
      SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_SECRET: local-bootstrap-auth-secret-0123456789abcdef
      TEST_CRON_SECRET: local-bootstrap-cron-secret
      LINE_API_BASE: http://localhost:4123
      LINE_DATA_API_BASE: http://localhost:4123
      RESEND_BASE_URL: http://localhost:4124
      RESEND_API_KEY: re_test_local_bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Build an isolated, hash-verified fresh-install baseline without the issue-41 overlay
        run: |
          node scripts/agents/fresh-install-baseline.mjs "$RUNNER_TEMP/schema-bootstrap"
          mkdir -p "$RUNNER_TEMP/schema-proof"
          cp "$RUNNER_TEMP/schema-bootstrap/candidate.json" "$RUNNER_TEMP/schema-proof/"
      - name: Replay against a fresh local Supabase, never a linked remote project
        id: replay
        run: |
          cd "$RUNNER_TEMP/schema-bootstrap"
          supabase start --help >/dev/null
          if supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor >"$RUNNER_TEMP/schema-bootstrap-start.log" 2>&1; then
            echo '{"replay":"PASS","canonicalApproved":false,"environmentParity":"NOT_PROVEN"}' >"$RUNNER_TEMP/schema-proof/replay-status.json"
          else
            echo '{"replay":"FAIL","canonicalApproved":false,"environmentParity":"NOT_PROVEN"}' >"$RUNNER_TEMP/schema-proof/replay-status.json"
            grep -E 'ERROR|failed|Applying migration|Stopping containers' "$RUNNER_TEMP/schema-bootstrap-start.log" >"$RUNNER_TEMP/schema-proof/replay-errors.log" || true
            cat "$RUNNER_TEMP/schema-proof/replay-errors.log"
            exit 1
          fi
      - name: Capture the existing seven-surface and ACL evidence contracts
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { PUBLIC_SCHEMA_METADATA_SQL, ACL_METADATA_SQL } from './scripts/agents/schema-truth-evidence.mjs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/schema-metadata.sql`, PUBLIC_SCHEMA_METADATA_SQL);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/schema-acl.sql`, ACL_METADATA_SQL);
          NODE
          docker exec -i "supabase_db_${LOCAL_PROJECT_ID}" psql -U postgres -d postgres -X -At -v ON_ERROR_STOP=1 <"$RUNNER_TEMP/schema-metadata.sql" >"$RUNNER_TEMP/schema-proof/metadata.json"
          docker exec -i "supabase_db_${LOCAL_PROJECT_ID}" psql -U postgres -d postgres -X -At -v ON_ERROR_STOP=1 <"$RUNNER_TEMP/schema-acl.sql" >"$RUNNER_TEMP/schema-proof/acl.json"
      - name: Verify current dependencies and reject future candidate contamination
        run: |
          docker exec -i "supabase_db_${LOCAL_PROJECT_ID}" psql -U postgres -d postgres -X -At -v ON_ERROR_STOP=1 >"$RUNNER_TEMP/schema-proof/assertions.json" <<'SQL'
          SELECT json_build_object(
            'booking_addons_birth_present', to_regclass('public.booking_addons') IS NOT NULL,
            'tour_orders_present', to_regclass('public.tour_orders') IS NOT NULL,
            'staff_assignment_present', to_regclass('public.trip_departure_staff') IS NOT NULL,
            'paid_amount_present', EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='tour_orders' AND column_name='paid_amount'),
            'expiry_rpc_present', to_regprocedure('public.expire_tour_order(uuid,uuid,text)') IS NOT NULL,
            'plan_cap_function_present', to_regprocedure('public.enforce_trip_plan_limit()') IS NOT NULL,
            'plan_cap_function_hardened', EXISTS (
              SELECT 1 FROM pg_proc p
               WHERE p.oid=to_regprocedure('public.enforce_trip_plan_limit()')
                 AND p.prorettype='trigger'::regtype AND p.prosecdef
                 AND p.proconfig @> ARRAY['search_path=public, pg_temp']
                 AND p.prosrc LIKE '%for no key update%'
                 AND NOT EXISTS (
                   SELECT 1 FROM aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
                    WHERE a.grantee=0 AND a.privilege_type='EXECUTE'
                 )
                 AND NOT has_function_privilege('anon', p.oid, 'EXECUTE')
                 AND NOT has_function_privilege('authenticated', p.oid, 'EXECUTE')
                 AND NOT has_function_privilege('service_role', p.oid, 'EXECUTE')
            ),
            'plan_cap_insert_statement_trigger_present', EXISTS (
              SELECT 1 FROM pg_trigger
               WHERE tgrelid='public.trip_plans'::regclass AND tgname='trip_plan_limit_guard'
                 AND tgfoid=to_regprocedure('public.enforce_trip_plan_limit()')
                 AND tgtype=4 AND tgnewtable='new_trip_plans' AND tgoldtable IS NULL AND NOT tgisinternal
            ),
            'plan_cap_update_statement_trigger_present', EXISTS (
              SELECT 1 FROM pg_trigger
               WHERE tgrelid='public.trip_plans'::regclass AND tgname='trip_plan_limit_guard_update'
                 AND tgfoid=to_regprocedure('public.enforce_trip_plan_limit()')
                 AND tgtype=16 AND tgnewtable='new_trip_plans' AND tgoldtable IS NULL AND NOT tgisinternal
            ),
            'future_issue_41_fields_absent', NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='tour_orders' AND column_name IN ('deposit_mode_snapshot','upfront_required_amount','balance_due','balance_due_at','balance_due_hours_snapshot','balance_collection_mode_snapshot','cancellation_policy_snapshot','refunded_amount'))
          );
          SQL
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/schema-proof/assertions.json`, 'utf8'));
          const failed = Object.entries(result).filter(([, value]) => value !== true).map(([key]) => key);
          if (failed.length) throw new Error(`BOOTSTRAP_CANDIDATE_ASSERTION_FAILED: ${failed.join(', ')}`);
          console.log('FRESH_INSTALL_BASELINE_GREEN: local replay, dependency probes, and approved 100-plan guard only; canonical adoption and TEST/Production parity NOT_PROVEN.');
          NODE
      - name: Prove the parent lock serializes two concurrent inserts at the 100-plan boundary
        run: |
          set -euo pipefail
          DB_CONTAINER="supabase_db_${LOCAL_PROJECT_ID}"
          wait_for_true() {
            local sql="$1"
            local deadline=$((SECONDS + 10))
            local observed
            while (( SECONDS <= deadline )); do
              observed="$(docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -At -v ON_ERROR_STOP=1 -c "$sql")"
              if [ "$observed" = "t" ]; then return 0; fi
            done
            echo "::error::Timed out waiting for an observable PostgreSQL lock state."
            return 1
          }
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.tenants (id, shop_code, name)
          VALUES ('29800000-0000-4000-8000-000000000001', 'issue-298-cap-proof', 'Issue 298 cap proof');
          INSERT INTO public.trips (id, tenant_id, slug, title)
          VALUES ('29800000-0000-4000-8000-000000000002', '29800000-0000-4000-8000-000000000001', 'cap-proof-trip', 'Cap proof trip');
          INSERT INTO public.trip_plans (tenant_id, trip_id, slug, name, base_price, price_per_person)
          SELECT '29800000-0000-4000-8000-000000000001', '29800000-0000-4000-8000-000000000002',
                 'seed-' || value, 'Seed ' || value, 0, 0
            FROM generate_series(1, 99) AS value;
          SQL
          coproc CAP_GATE { docker exec -e PGAPPNAME=issue-298-cap-gate -i "$DB_CONTAINER" psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1; }
          CAP_GATE_INPUT=${CAP_GATE[1]}
          CAP_GATE_PROCESS=$CAP_GATE_PID
          printf 'BEGIN; SELECT pg_advisory_xact_lock(298298);\n' >&"$CAP_GATE_INPUT"
          wait_for_true "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='issue-298-cap-gate' AND state='idle in transaction');"
          docker exec -e PGAPPNAME=issue-298-race-a -i "$DB_CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
            -c "BEGIN; INSERT INTO public.trip_plans (tenant_id, trip_id, slug, name, base_price, price_per_person) VALUES ('29800000-0000-4000-8000-000000000001','29800000-0000-4000-8000-000000000002','race-a','Race A',0,0); SELECT pg_advisory_xact_lock(298298); COMMIT;" \
            >"$RUNNER_TEMP/plan-cap-race-a.log" 2>&1 &
          RACE_A_PID=$!
          wait_for_true "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='issue-298-race-a' AND wait_event_type='Lock' AND wait_event='advisory');"
          docker exec -e PGAPPNAME=issue-298-race-b -i "$DB_CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
            -c "BEGIN; INSERT INTO public.trip_plans (tenant_id, trip_id, slug, name, base_price, price_per_person) VALUES ('29800000-0000-4000-8000-000000000001','29800000-0000-4000-8000-000000000002','race-b','Race B',0,0); COMMIT;" \
            >"$RUNNER_TEMP/plan-cap-race-b.log" 2>&1 &
          RACE_B_PID=$!
          wait_for_true "SELECT EXISTS (SELECT 1 FROM pg_stat_activity WHERE application_name='issue-298-race-b' AND wait_event_type='Lock');"
          printf 'COMMIT;\n\\q\n' >&"$CAP_GATE_INPUT"
          wait "$CAP_GATE_PROCESS"
          set +e
          wait "$RACE_A_PID"; RACE_A_STATUS=$?
          wait "$RACE_B_PID"; RACE_B_STATUS=$?
          set -e
          FINAL_COUNT="$(docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.trip_plans WHERE trip_id='29800000-0000-4000-8000-000000000002';")"
          if { [ "$RACE_A_STATUS" -eq 0 ] && [ "$RACE_B_STATUS" -eq 0 ]; } || \
             { [ "$RACE_A_STATUS" -ne 0 ] && [ "$RACE_B_STATUS" -ne 0 ]; } || \
             [ "$FINAL_COUNT" != "100" ] || \
             ! grep -q 'TRIP_PLAN_LIMIT' "$RUNNER_TEMP"/plan-cap-race-*.log; then
            cat "$RUNNER_TEMP"/plan-cap-race-*.log
            echo "::error::Concurrent cap proof failed: statuses=$RACE_A_STATUS,$RACE_B_STATUS count=$FINAL_COUNT"
            exit 1
          fi
          printf '{"result":"PASS","raceStatuses":[%s,%s],"finalPlanCount":%s}\n' \
            "$RACE_A_STATUS" "$RACE_B_STATUS" "$FINAL_COUNT" >"$RUNNER_TEMP/schema-proof/plan-cap-concurrency.json"
      - name: Classify whether this exact diff requires full Product acceptance
        id: acceptance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "::error::Cannot resolve a trustworthy base SHA for schema-bootstrap acceptance classification."
            exit 1
          fi
          git diff --name-only "${BASE_SHA}" "${EXPECTED_HEAD}" | sed '/^$/d' >"$RUNNER_TEMP/schema-bootstrap-changed-files.txt"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { classifySchemaBootstrapAcceptance } from './scripts/agents/schema-bootstrap-policy.mjs';
          const file = `${process.env.RUNNER_TEMP}/schema-bootstrap-changed-files.txt`;
          const raw = fs.readFileSync(file, 'utf8');
          const changedFiles = raw.split('\n').map((value) => value.trim()).filter(Boolean);
          const result = classifySchemaBootstrapAcceptance(changedFiles);
          const payload = { ...result, changedFiles };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/schema-proof/product-acceptance-policy.json`, JSON.stringify(payload, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `product_acceptance_required=${result.productAcceptanceRequired ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason=${result.reason}\n`);
          console.log(JSON.stringify(payload));
          NODE
      - name: Record governance-only bootstrap installation boundary
        if: ${{ steps.acceptance.outputs.product_acceptance_required != 'true' }}
        run: |
          echo "PRODUCT_ACCEPTANCE_NOT_RUN: ${{ steps.acceptance.outputs.reason }}. Replay/probes are the acceptance for this governance guard install; no Product pass is claimed."
      - name: Export only the disposable local TEST credentials
        if: ${{ steps.acceptance.outputs.product_acceptance_required == 'true' }}
        run: |
          cd "$RUNNER_TEMP/schema-bootstrap"
          supabase status -o env >"$RUNNER_TEMP/schema-bootstrap-local.env"
          python - <<'PYCODE'
          import os, shlex
          from pathlib import Path
          from urllib.parse import urlparse
          values = {}
          for line in Path(os.environ['RUNNER_TEMP'], 'schema-bootstrap-local.env').read_text().splitlines():
              if '=' in line:
                  key, raw = line.split('=', 1)
                  parts = shlex.split(raw)
                  values[key] = parts[0] if parts else ''
          mapping = {'API_URL': 'TEST_SUPABASE_URL', 'ANON_KEY': 'TEST_SUPABASE_ANON_KEY',
                     'SERVICE_ROLE_KEY': 'TEST_SUPABASE_SERVICE_ROLE_KEY'}
          if any(not values.get(key) for key in mapping):
              raise SystemExit('Missing disposable TEST credentials')
          if urlparse(values['API_URL']).hostname not in ('127.0.0.1', 'localhost'):
              raise SystemExit('Refusing a non-local TEST target')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for source, target in mapping.items():
                  if source != 'API_URL':
                      print('::add-mask::' + values[source])
                  output.write(target + '=' + values[source] + '\n')
          PYCODE
      - name: Install the exact application dependency tree
        if: ${{ steps.acceptance.outputs.product_acceptance_required == 'true' }}
        run: npm ci
      - name: Prove assignment parent-key reconciliation on disposable PostgreSQL
        if: ${{ steps.acceptance.outputs.product_acceptance_required == 'true' }}
        run: |
          node --test tests/schema/assignment-schema-proof.test.mjs
          node scripts/test/seed.mjs
          node scripts/test/verify-assignment-schema.mjs
      - name: Prove business-type reconciliation on disposable PostgreSQL
        if: ${{ steps.acceptance.outputs.product_acceptance_required == 'true' }}
        run: |
          node --test tests/schema/business-type-schema-proof.test.mjs
          node scripts/test/verify-business-type-schema.mjs
      - name: Prove current Product integration on the clean candidate, without issue-41
        if: ${{ steps.acceptance.outputs.product_acceptance_required == 'true' }}
        run: npm run test:integration
      - name: Prove current UI acceptance on the same disposable candidate
        if: ${{ steps.acceptance.outputs.product_acceptance_required == 'true' }}
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Preserve metadata-only evidence even when replay fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schema-bootstrap-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/schema-proof/
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy only this disposable local Supabase stack
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/schema-bootstrap/supabase/config.toml" ]; then
            cd "$RUNNER_TEMP/schema-bootstrap"
            supabase stop --no-backup
          fi
