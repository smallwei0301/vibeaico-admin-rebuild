name: Reconcile reviewed issue 528 metadata once
on:
  push:
    branches: [governance/issue-528-reconciliation-audit]
    paths: [.github/workflows/governance-528-reconcile-reviewed.yml]
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
concurrency:
  group: governance-528-reviewed-metadata-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'smallwei0301/vibeaico-admin-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7cdfb4ce0871df8c3cb6676efdcdccef441bf383
          persist-credentials: false
      - name: Download immutable reviewed capture, not executable candidate source
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs');
            const {owner,repo}=context.repo;
            const {data:meta}=await github.rest.actions.getArtifact({owner,repo,artifact_id:10481436108});
            if(meta.expired || meta.workflow_run?.id!==35183172330)throw new Error('Wrong reviewed capture');
            const {data}=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:10481436108,archive_format:'zip'});
            fs.writeFileSync(process.env.RUNNER_TEMP+'/reviewed-capture.zip',Buffer.from(data));
      - name: Extract only reviewed JSON observations
        run: |
          python - <<'PY'
          import os,zipfile,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'reviewed-capture.zip') as z:
            for name in ['capture.json','items.json','observation.json']:
              if name not in z.namelist(): raise RuntimeError('Missing reviewed input')
              (root/name).write_bytes(z.read(name))
          (root/'reconciliation').mkdir(exist_ok=True)
          PY
      - name: Reconcile only reviewed metadata, never close or merge work
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs');
            const crypto=require('node:crypto');
            const path=require('node:path');
            const {pathToFileURL}=require('node:url');
            const {inspectClassification}=await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,'scripts/agents/workstream-classification-watch.mjs')).href);
            const {readField}=await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,'scripts/agents/agent-wip-policy.mjs')).href);
            const root=process.env.RUNNER_TEMP;
            const output=path.join(root,'reconciliation');
            const capture=JSON.parse(fs.readFileSync(path.join(root,'capture.json'),'utf8'));
            if(capture.policySha!=='4db7496a9b0b2e08f432a720e0342f29b6f47f98'||capture.runId!==35183172330||capture.mainStable!==true)throw new Error('Unexpected reviewed snapshot');
            const captured=JSON.parse(fs.readFileSync(path.join(root,'items.json'),'utf8'));
            const byNumber=new Map(captured.map(item=>[item.number,item]));
            const targets={
              MODEL_GOVERNANCE:[534,478,566,543,544,542,541,537,535,536,529,527,525,523,516,504,486,483,484,480,481,463,465,461,459,458,457,452,453,451,446,444,445,441,437,436,435],
              PRODUCT_MAINLINE:[47,15,8,31,13,1,120,50,7,32,12,19,118,66,40,6,44,221,45,413,242,241,238,27,34,218,246,561,526,524,522,519,517,515,511,508,507,506,505,501,498,495,474,488,494,493,492,491,490,489,471,482,476,469,467,464,456,449,448,443,442,438,440,428]
            };
            const label={MODEL_GOVERNANCE:'workstream:model-governance',PRODUCT_MAINLINE:'workstream:product-mainline'};
            const activeLabels=new Set(['state:active','candidate:active','state:reserve-ready','state:ready-for-promotion']);
            const hash=s=>crypto.createHash('sha256').update(s).digest('hex');
            const fileIdentity=files=>JSON.stringify(files.map(f=>[f.filename,f.previous_filename||null,f.status,f.sha]).sort((a,b)=>a[0].localeCompare(b[0])));
            const identity=x=>JSON.stringify([x.number,x.body,x.state,x.merged??null,x.head?.sha??null,x.base?.sha??null,(x.labels??[]).map(l=>typeof l==='string'?l:l.name).sort()]);
            const {owner,repo}=context.repo;
            const load=async(item)=> (await github.request(`GET /repos/{owner}/{repo}/${item.kind==='PR'?'pulls':'issues'}/${item.number}`,{owner,repo})).data;
            const results=[];
            const save=()=>fs.writeFileSync(path.join(output,'results.json'),JSON.stringify({parent:528,policySha:'7cdfb4ce0871df8c3cb6676efdcdccef441bf383',capturedRun:35183172330,executedAt:new Date().toISOString(),results},null,2));
            function replaceField(body,key,value,changes){
              if(readField(body,key).toUpperCase()===value.toUpperCase())return body;
              const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
              const rx=new RegExp(`^([ \\t]*(?:[-*+]\\s+)?)(?:\\*\\*)?${escaped}(?:\\*\\*)?[ \\t]*:[ \\t]*(.*)$`,'i');
              let fence='',comment=false,replaced=0;
              const lines=body.split('\n').map(line=>{
                const f=line.match(/^ {0,3}(`{3,}|~{3,})/);
                if(f){if(!fence)fence=f[1];else if(f[1][0]===fence[0]&&f[1].length>=fence.length)fence='';return line;}
                if(fence)return line;
                if(comment){if(line.includes('-->'))comment=false;return line;}
                if(line.includes('<!--')){if(!line.includes('-->'))comment=true;return line;}
                const m=line.match(rx);if(!m)return line;
                changes.push({field:key,old:line,new:`${m[1]}${key}: ${value}`});replaced++;
                return `${m[1]}${key}: ${value}`;
              });
              if(replaced>1)throw new Error('Ambiguous field; no write');
              if(!replaced){changes.push({field:key,old:null,new:`${key}: ${value}`});lines.unshift(`${key}: ${value}`);}
              return lines.join('\n');
            }
            function proposal(item,target){
              const changes=[];let body=item.body||'';
              if(item.number===478){
                if(!/^## Workstream\nWORKSTREAM: MODEL_GOVERNANCE\n/.test(body))throw new Error('Changed duplicate-heading case');
                changes.push({field:'heading',old:'## Workstream',new:'## Workstream classification'});
                body=body.replace(/^## Workstream\n/,'## Workstream classification\n');
              }
              body=replaceField(body,'WORKSTREAM',target,changes);
              if(item.kind==='PR'&&target==='MODEL_GOVERNANCE'){
                for(const [key,value] of Object.entries({AGENT_LANE:'GOVERNANCE',ASTRA_RISK:'NONE',FINAL_RISK_POLICY:'NOT_REQUIRED_BY_OWNER_POLICY',DELIVERY_UNIT_TYPE:'GOVERNANCE',COUNT_IN_DELIVERY_OUTCOME:'false'}))body=replaceField(body,key,value,changes);
              }
              if(item.kind==='PR'&&item.state==='closed'){
                if(['ACTIVE','READY_FOR_PROMOTION'].includes(readField(body,'LANE_STATE').toUpperCase()))body=replaceField(body,'LANE_STATE',item.merged?'COMPLETE':'HISTORICAL',changes);
                if(readField(body,'ACTIVE_CANDIDATE').toUpperCase()==='TRUE')body=replaceField(body,'ACTIVE_CANDIDATE','false',changes);
              }
              const labels=(item.labels||[]).map(l=>typeof l==='string'?l:l.name);
              const desired=new Set(labels.filter(l=>!l.startsWith('workstream:')&&!(item.state==='closed'&&activeLabels.has(l))));desired.add(label[target]);
              if(changes.length)body+='\n\n## #528 現況對帳（2026-09-17）\n此段只整理目前分類及施工欄位，不改 GitHub 開關狀態、歷史時間、程式、測試或審查紀錄，不構成產品上線／資料庫執行授權。原欄位保留如下，僅供歷史對照，不能當現行施工指令。\n\n```text\n'+changes.map(c=>(c.old??'(原欄位缺漏)')+' => '+c.new).join('\n')+'\n```\n';
              return {body,labels:[...desired],changes};
            }
            // Fail before any mutation if the complete reviewed plan no longer parses.
            for(const [target,numbers] of Object.entries(targets))for(const number of numbers){
              const old=byNumber.get(number);if(!old||hash(old.body)!==old.bodySha256)throw new Error('Reviewed body digest mismatch');
              const p=proposal(old,target);
              const v=inspectClassification({...old,...p,changed_files:old.kind==='PR'?old.files.length:undefined},old.files);
              if(v.status!=='PASS')throw new Error(`Reviewed proposal #${number} does not satisfy unchanged policy`);
            }
            fs.writeFileSync(path.join(output,'plan-verdict.txt'),'101 explicitly reviewed proposals pass the existing classifier; no policy changed.\n');
            for(const [target,numbers] of Object.entries(targets))for(const number of numbers){
              const old=byNumber.get(number);
              let stage='READ_ONLY';
              try{
                const current=await load(old);
                const files=old.kind==='PR'?await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:number,per_page:100}):null;
                const before=inspectClassification(current,files);
                if(before.status==='PASS'&&before.workstream===target){results.push({number,kind:old.kind,status:'ALREADY_PASS',before});save();continue;}
                if(hash(current.body||'')!==old.bodySha256||current.state!==old.state||(old.kind==='PR'&&(current.merged!==old.merged||current.head.sha!==old.head.sha||current.base.sha!==old.base.sha||fileIdentity(files)!==fileIdentity(old.files)))){
                  results.push({number,kind:old.kind,status:'CHANGED_SINCE_REVIEW_NO_WRITE',before});save();continue;
                }
                const p=proposal({...current,kind:old.kind},target);
                const projected=inspectClassification({...current,body:p.body,labels:p.labels},files);
                if(projected.status!=='PASS')throw new Error('Projected current classification not PASS');
                const fresh=await load(old);if(identity(fresh)!==identity(current)){results.push({number,kind:old.kind,status:'CONCURRENT_CHANGE_NO_WRITE'});save();continue;}
                const log={number,kind:old.kind,target,status:'PREPARED',before,oldBodySha256:hash(current.body||''),newBodySha256:hash(p.body),changes:p.changes,labelsBefore:current.labels.map(l=>l.name),labelsAfter:p.labels,head:current.head?.sha??null,base:current.base?.sha??null,merged:current.merged??null,closedAt:current.closed_at??null,reason:old.kind==='PR'?'Verified actual file inventory and declared scope; closed GitHub state controls occupancy, not product acceptance.':'Reviewed issue scope and existing classification; synchronize the missing or duplicate declaration, do not change product scope or issue state.'};
                results.push(log);save();
                if(p.body!==current.body){stage='BODY_WRITE';await github.request(`PATCH /repos/{owner}/{repo}/${old.kind==='PR'?'pulls':'issues'}/${number}`,{owner,repo,body:p.body});}
                stage='LABEL_SYNC';
                const latest=await load(old);
                if(latest.body!==p.body||latest.state!==current.state)throw new Error('Concurrent body/state change after body write');
                const names=latest.labels.map(l=>l.name);
                const remove=names.filter(l=>(l.startsWith('workstream:')&&l!==label[target])||(latest.state==='closed'&&activeLabels.has(l)));
                for(const name of remove){try{await github.rest.issues.removeLabel({owner,repo,issue_number:number,name});}catch(e){if(e.status!==404)throw e;}}
                if(!names.includes(label[target]))await github.rest.issues.addLabels({owner,repo,issue_number:number,labels:[label[target]]});
                const final=await load(old);
                if(final.body!==p.body||final.state!==current.state||(old.kind==='PR'&&(final.head.sha!==current.head.sha||final.base.sha!==current.base.sha)))throw new Error('Final identity changed');
                const after=inspectClassification(final,files);
                log.status=after.status==='PASS'?'VERIFIED_RECONCILED':'POST_WRITE_DRIFT';log.after=after;log.observedAt=new Date().toISOString();save();
                console.log(`${old.kind} #${number} ${log.status}`);
                await new Promise(resolve=>setTimeout(resolve,1100));
              }catch(e){results.push({number,kind:old.kind,status:stage==='READ_ONLY'?'UNAVAILABLE_NO_WRITE':'PARTIAL_REQUIRES_REVIEW',stage,errorStatus:e.status??null});save();throw new Error(`Stopped at #${number}, stage ${stage}; inspect retained result, do not blindly retry`);}
            }
            save();
            const counts=results.reduce((out,r)=>(out[r.status]=(out[r.status]||0)+1,out),{});
            console.log(JSON.stringify(counts));
            await core.summary.addHeading('Reviewed #528 metadata reconciliation').addCodeBlock(JSON.stringify(counts,null,2),'json').addRaw('No Issue closed/reopened, PR merged, branch moved, source/review/CI evidence altered, database or provider touched.').write();
      - name: Reobserve live classification without making additional changes
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs');const path=require('node:path');const {pathToFileURL}=require('node:url');
            const {observeClassifications}=await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,'scripts/agents/workstream-classification-watch.mjs')).href);
            const report=await observeClassifications({github,...context.repo,policySha:'7cdfb4ce0871df8c3cb6676efdcdccef441bf383'});
            fs.mkdirSync(process.env.RUNNER_TEMP+'/reconciliation',{recursive:true});
            fs.writeFileSync(process.env.RUNNER_TEMP+'/reconciliation/after-observation.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify({status:report.status,counts:report.counts,findings:report.findings,unavailable:report.unavailable},null,2));
            await core.summary.addHeading('Post-reconciliation observation').addCodeBlock(JSON.stringify({status:report.status,counts:report.counts,findings:report.findings.length,unavailable:report.unavailable.length},null,2),'json').write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue528-reviewed-reconciliation
          path: ${{ runner.temp }}/reconciliation/
          if-no-files-found: error
          retention-days: 14
