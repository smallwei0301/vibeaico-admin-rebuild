name: bounded-governance-source-566
on:
  push:
    branches: [fix/classify-sparse-checkout-final-risk-cost-policy]
    paths: [.github/workflows/governance-source-566.yml]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: bounded-governance-source-566
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'smallwei0301/vibeaico-admin-rebuild' && github.ref == 'refs/heads/fix/classify-sparse-checkout-final-risk-cost-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture current PR without exposing credentials to tests
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: 566});
            if (pr.state !== 'open' || pr.head.sha !== context.sha) throw new Error('PR head changed; do not overwrite');
            fs.writeFileSync('/tmp/pr566-body.md', pr.body);
      - name: Bounded canonical entry and Playbook update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
            'docs/AGENT-EXECUTION.md': '28d89be63e301c6a19634d643db1043b1e1c3e9f',
            'docs/AGENT-PLAYBOOK.md': '7b7c9a41c38a7c9aed9a2f46af8857d42188b597',
          }
          for name, sha in expected.items():
            actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip()
            if actual != sha:
              raise SystemExit('Document changed; review before editing: ' + name)
          path = Path('docs/AGENT-EXECUTION.md')
          text = path.read_text()
          marker = '- 路徑與欄位檢查不能證明每個語意都正確；'
          assert text.count(marker) == 1
          text = text.replace(marker, '- #566：分類器新增本地 import 或讀檔相依時，必須同步 trusted workflow 的 sparse-checkout 清單。\n  送出前以該清單複製到乾淨目錄並實際載入分類入口；完整 checkout 的測試成功不能替代它。\n  相依缺檔是檢查器啟動失敗，不是 Product 分類錯誤；修補合併後重查目前事件，不重寫歷史結果。\n' + marker)
          path.write_text(text)
          path = Path('docs/AGENT-PLAYBOOK.md')
          text = path.read_text()
          marker = '### PB-034 — 用 CI 當規則查詢器：靠一次次被退來湊出正確的 PR 中繼資料\n'
          assert text.count(marker) == 1
          note = '\n- 2026-09-17 #566 續例（母單 #528）：#554 的分類器新增 final-risk-cost-policy.mjs import，\n  trusted sparse-checkout 卻漏下載該檔。分類入口在判定前即 ERR_MODULE_NOT_FOUND；\n  PR #562/#563/#564/#565 的分類紅燈與缺標籤因此不能直接歸因各張產品修改。\n  #566 原一行修補又漏填治理欄位，屬另一個已知 metadata 問題，不把兩者混成同一錯誤。\n  修正沿用既有 #566，補齊欄位與 sparse 路徑；不另開重複 PR、不改模型政策或產品原始碼。\n  預防測試從 workflow 真正的 sparse 清單建立乾淨目錄，在新 Node 程序 import 分類入口；\n  刻意移除 cost-policy 或 model-routing.json 時必須失敗，防止完整 checkout 掩蓋缺檔。\n  驗證以 #566 對應版本的 focused mutation、preflight、required source CI 與合併後分類事件為準；\n  SOURCE_ONLY 不宣稱資料庫或產品驗收通過，舊失敗通知不覆寫。\n'
          text = text.replace(marker, marker + note)
          path.write_text(text)
          Path('.github/workflows/governance-source-566.yml').unlink()
          PY
          git diff --check
          git diff --name-only 3d5c8ede28be55c0a54436081ccaad5c5e4900a6 > /tmp/pr566-files.txt
          cat /tmp/pr566-files.txt
      - name: Locked source dependencies
        run: npm ci
      - name: Real sparse imports and mutation detection
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run tests/unit/workstream-sparse-checkout.566.test.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/agent-workstream-classification.yml')
          original = p.read_text()
          Path('/tmp/classification-566.original').write_text(original)
          line = '            scripts/agents/final-risk-cost-policy.mjs\n'
          assert original.count(line) == 1
          p.write_text(original.replace(line, ''))
          PY
          set +e
          npx vitest run tests/unit/workstream-sparse-checkout.566.test.ts > /tmp/mutation-566.log 2>&1
          result=$?
          set -e
          cp /tmp/classification-566.original .github/workflows/agent-workstream-classification.yml
          cat /tmp/mutation-566.log
          test "$result" -ne 0
          echo 'MUTATION_DETECTED: removing sparse dependency causes test failure'
          npx vitest run tests/unit/workstream-sparse-checkout.566.test.ts
          node scripts/agents/agent-wip-preflight.mjs --body /tmp/pr566-body.md --changed-files /tmp/pr566-files.txt --number 566
          npm run guard:repo-integrity
          npm run typecheck
      - name: Commit only verified governance documents and retire helper
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const {execFileSync} = require('node:child_process');
            const branch = 'fix/classify-sparse-checkout-final-risk-cost-policy';
            const helper = '.github/workflows/governance-source-566.yml';
            const documents = ['docs/AGENT-EXECUTION.md', 'docs/AGENT-PLAYBOOK.md'];
            const allowed = new Set([...documents, helper]);
            const changed = execFileSync('git', ['diff', '--name-only', '-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
            if (changed.length !== 3 || changed.some(p => !allowed.has(p))) throw new Error('Unexpected workspace change');
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref:`heads/${branch}`});
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number:566});
            if (ref.object.sha !== context.sha || pr.head.sha !== context.sha || pr.state !== 'open' || pr.body !== fs.readFileSync('/tmp/pr566-body.md','utf8')) throw new Error('Concurrent change; do not overwrite');
            const {data: base} = await github.rest.git.getCommit({...context.repo, commit_sha:context.sha});
            const tree = documents.map(p => ({path:p, mode:'100644', type:'blob', content:fs.readFileSync(p,'utf8')}));
            tree.push({path:helper, mode:'100644', type:'blob', sha:null});
            const {data: built} = await github.rest.git.createTree({...context.repo, base_tree:base.tree.sha, tree});
            const {data: commit} = await github.rest.git.createCommit({...context.repo, message:'test(governance): prove sparse classification imports and record #566 prevention', tree:built.sha, parents:[context.sha]});
            await github.rest.git.updateRef({...context.repo, ref:`heads/${branch}`, sha:commit.sha, force:false});
            core.info(`VERIFIED_SOURCE_HEAD=${commit.sha}`);
            core.info(`VERIFIED_SOURCE_TREE=${built.sha}`);
            await core.summary.addHeading('Bounded #566 source preparation').addRaw(`Focused sparse import tests, detected mutation, preflight, integrity and typecheck executed. Candidate head ${commit.sha}. Normal PR CI and review still required; no merge or database operation performed.`).write();
