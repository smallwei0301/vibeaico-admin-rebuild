name: bounded-edit-555
on:
  push:
    branches: [governance/issue-555-delivery-boundary]
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'chore: apply corrected 555 origin fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct reviewed patch and correct fixture, not policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os
          old = 'e574660ad999dc7e388b7bb8ed5e822f9b21389b'
          helper = '.github/workflows/bounded-edit-555.yml'
          text = subprocess.check_output(['git','show',old+':'+helper],text=True)
          def block(after, before):
              piece = text.split(after,1)[1].split(before,1)[0]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in piece.splitlines())
          patch = block('      - name: Apply literal six-file patch on verified parent\n        shell: bash\n        run: |\n', '\n      - name: Focused real workflow tests, mutation and preflight')
          patch = patch.split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          patch = patch.replace("assert git('rev-parse', 'HEAD^') == base, 'Unexpected edit-carrier parent'", "assert git('rev-parse', 'HEAD^') == '"+old+"', 'Unexpected corrected-carrier parent'")
          wrong = "it.each(['OWNER', 'UNKNOWN'])('retains valid pure governance without Product WIP for %s'"
          right = "it.each(['OWNER', 'AGENT'])('retains valid pure governance without Product WIP for %s'"
          assert patch.count(wrong) == 1
          patch = patch.replace(wrong,right)
          exec(compile(patch,'reviewed-555-patch','exec'))
          p=Path('docs/AGENT-PLAYBOOK.md'); s=p.read_text()
          start=s.index('### PB-034'); end=s.index('### PB-035',start)
          section=s[start:end].replace('2026-09-11／2026-09-11','2026-09-11／2026-09-17',1).replace('發生次數：3（#352 連續 4 次、#361 2 次、#370 1 次）','發生次數：4（#352、#361、#370、#553；次數是事件，不是 CI 執行總數）',1)
          section += '- #555 首次驗證 run 35171817256：23/24 通過；唯一失敗是測試把 UNKNOWN+AGENT_LANE 當合法。保留既有來源規則，僅修正對照組；不得為測試通過放寬身分契約。\n\n'
          p.write_text(s[:start]+section+s[end:])
          validation=block('      - name: Focused real workflow tests, mutation and preflight\n        shell: bash\n        run: |\n','\n      - name: Publish only six immutable source blobs, no ref changes')
          Path(os.environ['RUNNER_TEMP'],'555-validate.sh').write_text(validation)
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Real focused tests, deliberate old-guard mutation, preflight
        shell: bash
        run: bash -e -o pipefail "$RUNNER_TEMP/555-validate.sh"
      - name: Publish only six validated immutable blobs
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {owner, repo} = context.repo;
            const branch = 'governance/issue-555-delivery-boundary';
            if (context.ref !== `refs/heads/${branch}`) throw new Error('Wrong branch');
            const current = await github.rest.git.getRef({owner, repo, ref:`heads/${branch}`});
            if (current.data.object.sha !== context.sha) throw new Error('Concurrent branch update');
            const files = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'555-files.json'),'utf8'));
            const allowed = ['.github/workflows/agent-wip-guard.yml','scripts/agents/governance-workstream-boundary.mjs','scripts/agents/completion-truth.mjs','tests/unit/governance-workstream-boundary.500.test.ts','docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md'];
            if (files.length !== allowed.length || files.some(f=>!allowed.includes(f))) throw new Error('Scope mismatch');
            const blobs=[];
            for(const file of files) {
              const result=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});
              blobs.push({path:file,mode:'100644',type:'blob',sha:result.data.sha});
            }
            core.info(`PATCH_BLOBS=${JSON.stringify(blobs)}`);
            core.info(`VALIDATED_CARRIER_HEAD=${context.sha}`);
            await core.summary.addHeading('Bounded #555 validated blobs').addCodeBlock(JSON.stringify(blobs,null,2),'json').write();
      - name: Preserve source-only audit material
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/555-evidence"
          git archive 9a14feb1da0920958791ba6c8801e002e604acc3 | gzip > "$RUNNER_TEMP/555-evidence/base-source.tar.gz"
          git diff 9a14feb1da0920958791ba6c8801e002e604acc3 > "$RUNNER_TEMP/555-evidence/candidate.patch"
          cp "$RUNNER_TEMP/555-mutation.log" "$RUNNER_TEMP/555-evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-555-source-evidence
          path: ${{ runner.temp }}/555-evidence/
          retention-days: 7
