name: governance-scope-budget

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: governance-scope-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate active Agent governance PR size
        run: node scripts/agents/governance-scope-budget.mjs
