name: agent-completion-truth

on:
  push:
    branches: [main]
  status:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Optional merged PR number to re-verify
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: agent-completion-truth-${{ github.repository }}-${{ github.event.workflow_run.head_sha || github.event.sha || github.event.after || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-main-completion:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.id == github.event.repository.id &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Product delivery truth against live GitHub state
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const truth = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/completion-truth.mjs',
            )).href);

            const { owner, repo } = context.repo;
            const ciWorkflowFile = truth.CANONICAL_CI_PATH.split('/').at(-1);
            const defaultBranch = context.payload.repository?.default_branch ?? 'main';
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: defaultBranch });
            const defaultBranchHead = branch.data.commit.sha;
            const requested = String(context.payload.inputs?.pull_request_number ?? '').trim();
            let pullRequests = [];
            let targetSha = null;

            if (requested) {
              if (!/^\d+$/.test(requested) || Number(requested) < 1) {
                core.setFailed('pull_request_number must be a positive integer');
                return;
              }
              const requestedPr = (await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(requested),
              })).data;
              pullRequests = [requestedPr];
              targetSha = requestedPr.merge_commit_sha ?? null;
            } else if (context.eventName === 'workflow_run') {
              const run = (await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: context.payload.workflow_run.id,
              })).data;
              const workflow = (await github.rest.actions.getWorkflow({
                owner, repo, workflow_id: ciWorkflowFile,
              })).data;
              targetSha = truth.completionRefreshSha(run, context.payload.repository, workflow.id);
              if (!targetSha) {
                core.notice('Ignoring a CI completion outside the canonical repository/event scope.');
                return;
              }
              pullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: targetSha, per_page: 100 },
              );
            } else {
              targetSha = context.eventName === 'status'
                ? context.payload.sha
                : context.payload.after;
              if (targetSha) {
                pullRequests = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: targetSha, per_page: 100 },
                );
              }
            }

            // Association responses are discovery only; re-read current merge/head truth.
            const candidates = [];
            for (const associated of pullRequests) {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: associated.number })).data;
              if (pr.base?.repo?.id !== context.payload.repository.id || pr.base.ref !== defaultBranch
                || !pr.merged_at || pr.state !== 'closed') continue;
              if (!requested && pr.head.sha !== targetSha && pr.merge_commit_sha !== targetSha) continue;
              candidates.push(pr);
            }
            if (candidates.length === 0) {
              await core.summary
                .addHeading('Product Delivery Truth Ladder')
                .addRaw(`No pull request associated with ${targetSha ?? 'this event'}. No completion claim was created.`)
                .write();
              return;
            }

            const marker = '<!-- agent-completion-truth -->';
            const failures = [];
            const evidenceSinkWarnings = [];
            const mainCiWarnings = [];
            const rows = [[
              { data: 'PR', header: true },
              { data: 'Source', header: true },
              { data: 'Main', header: true },
              { data: 'Main CI', header: true },
              { data: 'Vercel', header: true },
              { data: 'Schema', header: true },
              { data: 'Authenticated Production', header: true },
              { data: 'Status', header: true },
            ]];

            for (const pr of candidates) {
              let compareStatus = null;
              if (pr.merge_commit_sha) {
                if (pr.merge_commit_sha === defaultBranchHead) {
                  compareStatus = 'identical';
                } else {
                  try {
                    const comparison = await github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${pr.merge_commit_sha}...${defaultBranchHead}`,
                    });
                    compareStatus = comparison.data.status;
                  } catch (error) {
                    compareStatus = `api_error_${error.status ?? 'unknown'}`;
                  }
                }
              }

              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const sourceWorkflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: ciWorkflowFile,
                head_sha: pr.head.sha, event: 'pull_request', per_page: 100,
              });
              const mainWorkflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: ciWorkflowFile,
                head_sha: pr.merge_commit_sha, event: 'push', per_page: 100,
              });
              const statusResponse = pr.merge_commit_sha
                ? await github.rest.repos.getCombinedStatusForRef({
                    owner,
                    repo,
                    ref: pr.merge_commit_sha,
                    per_page: 100,
                  })
                : { data: { statuses: [] } };

              const result = truth.evaluateProductDeliveryTruth({
                pullRequest: pr,
                defaultBranchHead,
                compareStatus,
                changedFiles,
                sourceWorkflowRuns,
                mainWorkflowRuns,
                commitStatuses: statusResponse.data.statuses,
              });
              const body = truth.formatProductDeliveryTruth(result);
              let evidenceSink = 'commented';

              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: pr.number,
                  per_page: 100,
                });
                const previous = comments.find((comment) => comment.body?.includes(marker));
                if (previous) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                }
              } catch (error) {
                const sinkError = truth.classifyEvidenceSinkError(error);
                evidenceSink = `warning:${sinkError.code}`;
                evidenceSinkWarnings.push(
                  `#${pr.number}: truth was evaluated, but PR comment storage failed (${sinkError.code}: ${sinkError.message})`,
                );
                core.warning(evidenceSinkWarnings.at(-1));
              }

              rows.push([
                `#${pr.number}`,
                result.source.state,
                result.merge.verified ? 'VERIFIED' : 'UNVERIFIED',
                result.mainCi.state,
                result.vercel.state,
                result.schema.state,
                result.acceptance.state,
                result.productionAccepted
                  ? 'PRODUCTION_ACCEPTED'
                  : result.deliveryEligible
                    ? 'PRODUCTION_PENDING'
                    : `NON_PRODUCT (${evidenceSink})`,
              ]);
              for (const warning of result.warnings) {
                if (!warning.startsWith('canonical ci on the merge commit')) continue;
                mainCiWarnings.push(`#${pr.number}: ${warning}`);
                core.warning(mainCiWarnings.at(-1));
              }
              if (result.errors.length) failures.push(`#${pr.number}: ${result.errors.join('; ')}`);
            }

            await core.summary.addHeading('Product Delivery Truth Ladder').addTable(rows).write();
            if (mainCiWarnings.length) {
              await core.summary
                .addHeading('Main CI warnings')
                .addList(mainCiWarnings)
                .write();
            }
            if (evidenceSinkWarnings.length) {
              await core.summary
                .addHeading('Evidence sink warnings')
                .addList(evidenceSinkWarnings)
                .write();
            }
            if (failures.length) core.setFailed(failures.join('\n'));
