name: agent-run-scorecard

on:
  pull_request:
    paths:
      - '.github/workflows/agent-run-scorecard.yml'
      - 'docs/metrics/agent-runs/**'
      - 'docs/AGENT-BPLUS-DELIVERY-LOOP.md'
      - '.agents/schemas/agent-run*.schema.json'
      - '.agents/skills/vibeaico-agent-retrospective/**'
      - 'scripts/agents/run-ledger*.mjs'
      - 'scripts/agents/score-run*.mjs'
      - 'scripts/agents/scorecard-readiness.mjs'
      - 'scripts/agents/review-runs*.mjs'
      - 'tests/unit/agent-run-score.test.ts'
      - 'tests/unit/run-ledger-reconcile.test.ts'
      - 'tests/unit/observed-scorecard*.test.ts'
      - 'tests/unit/scorecard-readiness*.test.ts'
      - 'tests/unit/scorecard-live-workflow*.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-run-scorecard.yml'
      - 'docs/metrics/agent-runs/**'
      - 'scripts/agents/run-ledger*.mjs'
      - 'scripts/agents/score-run*.mjs'
      - 'scripts/agents/scorecard-readiness.mjs'
      - 'scripts/agents/review-runs*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-scorecards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: |
          node --check scripts/agents/run-ledger.mjs
          node --check scripts/agents/run-ledger-v2.mjs
          node --check scripts/agents/run-ledger-reconcile.mjs
          node --check scripts/agents/score-run.mjs
          node --check scripts/agents/score-run-v2.mjs
          node --check scripts/agents/score-run-current.mjs
          node --check scripts/agents/scorecard-readiness.mjs
          node --check scripts/agents/review-runs.mjs
          node --check scripts/agents/review-runs-v2.mjs
      - name: Validate and reproduce every committed report
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ledgers=(docs/metrics/agent-runs/*.json)
          if [ ${#ledgers[@]} -eq 0 ]; then
            echo 'No agent run ledger exists.' >&2
            exit 1
          fi
          for ledger in "${ledgers[@]}"; do
            report="${ledger%.json}.md"
            test -f "$report" || { echo "Missing report: $report" >&2; exit 1; }
            schema_version="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).schemaVersion)' "$ledger")"
            if [ "$schema_version" = "2" ]; then
              node scripts/agents/run-ledger-v2.mjs validate "$ledger"
              generated="$(mktemp)"
              node scripts/agents/score-run-current.mjs "$ledger" > "$generated"
              diff -u "$report" "$generated"
            elif [ "$schema_version" = "1" ]; then
              node scripts/agents/run-ledger.mjs validate "$ledger"
              node scripts/agents/score-run.mjs "$ledger" --check "$report"
            else
              echo "Unsupported schemaVersion in $ledger: $schema_version" >&2
              exit 1
            fi
          done
      - name: Strict live readiness for changed active v2 ledgers
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo 'No stable comparison base; no changed-ledger strict-live check can be proven.' >&2
            exit 1
          fi

          # Process substitution hides git's exit status from set -e.
          # Prove the complete NUL-delimited diff before accepting an empty list.
          changed_ledger_list="$(mktemp)"
          trap 'rm -f "$changed_ledger_list"' EXIT
          if ! git diff --name-only -z "$base_sha" "$GITHUB_SHA" -- 'docs/metrics/agent-runs/*.json' > "$changed_ledger_list"; then
            echo 'Unable to prove changed ledgers; strict-live fails closed.' >&2
            exit 1
          fi
          mapfile -d '' -t changed_ledgers < "$changed_ledger_list"
          if [ ${#changed_ledgers[@]} -eq 0 ]; then
            echo 'No changed run ledger in this transition; strict-live check not applicable.'
            exit 0
          fi

          for ledger in "${changed_ledgers[@]}"; do
            test -f "$ledger" || { echo "Changed ledger is missing: $ledger" >&2; exit 1; }
            ledger_state="$(node -e 'const fs=require("fs"); const run=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(`${run.schemaVersion ?? ""} ${run.status ?? ""}`)' "$ledger")"
            read -r schema_version status <<< "$ledger_state"
            if [ "$schema_version" = "2" ] && [ "$status" = "IN_PROGRESS" ]; then
              echo "Strict live readiness: $ledger"
              node scripts/agents/scorecard-readiness.mjs "$ledger" --strict-live
            else
              echo "Skip strict-live for non-active/non-v2 ledger: $ledger (schema=$schema_version status=$status)"
            fi
          done
