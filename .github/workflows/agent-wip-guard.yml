name: agent-wip-guard

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-wip-guard-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # This is a privileged workflow. Load policy only from the trusted default branch and never
      # checkout or execute PR-head code.
      - name: Checkout trusted B+ policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate B+ lane metadata and WIP limits
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const basePolicy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/agent-wip-policy.mjs',
            )).href);
            let policy = basePolicy;
            try {
              policy = await import(pathToFileURL(path.join(
                process.env.GITHUB_WORKSPACE,
                'scripts/agents/dual-terra-wip-policy.mjs',
              )).href);
            } catch (error) {
              if (error?.code !== 'ERR_MODULE_NOT_FOUND') throw error;
              // Before the focused policy is merged, the trusted base policy remains fail-closed
              // at one Terra. Once merged, the dual-pilot module becomes the source of truth.
            }

            const { owner, repo } = context.repo;
            const current = context.payload.pull_request;
            const marker = '<!-- agent-wip-guard -->';
            const metadata = policy.parseLaneMetadata(current);
            const isAgent = metadata.origin === 'AGENT';
            const metadataErrors = policy.validateLaneMetadata(metadata, {
              action: context.payload.action ?? '',
            });

            if (
              isAgent &&
              metadata.state === 'ACTIVE' &&
              metadata.bplusMode === 'TRUE' &&
              metadata.scorecardPath &&
              metadataErrors.length === 0
            ) {
              let scorecardFound = false;
              for (const ref of [current.head.sha, context.payload.repository.default_branch]) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: metadata.scorecardPath,
                    ref,
                  });
                  if (!Array.isArray(response.data) && response.data.type === 'file') {
                    scorecardFound = true;
                    break;
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              if (!scorecardFound) {
                metadataErrors.push(`SCORECARD_PATH does not exist on the PR head or main: ${metadata.scorecardPath}`);
              }
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const summary = policy.summarizeActiveLanes(openPulls);
            const capacity = typeof policy.pilotCapacity === 'function'
              ? policy.pilotCapacity(summary)
              : { terraMax: 1, reserveMax: 1, qualified: false };
            const wipErrors = isAgent && metadata.state === 'ACTIVE'
              ? policy.validateGlobalWip(summary)
              : [];
            const terraLimit = capacity.terraMax;
            const reserveLimit = capacity.reserveMax;

            const labels = {
              'origin:agent': ['1D76DB', 'PR or Issue explicitly marked as Agent-origin.'],
              'origin:owner-or-unknown': ['BFDADC', 'No explicit Agent-origin marker.'],
              'lane:terra-build': ['0E8A16', 'One of up to two qualified free local-isolated Terra delivery lanes.'],
              'lane:terra-reserve': ['A2EEEF', 'Single-Terra fallback source-only Reserve; disabled during dual pilot.'],
              'lane:luna-closure': ['5319E7', 'The sole Luna Closure / Janitor lane.'],
              'lane:test-validation': ['FBCA04', 'The sole remote canonical TEST validation lane.'],
              'lane:governance': ['D4C5F9', 'Repository governance work.'],
              'state:active': ['0E8A16', 'Current active B+ lane.'],
              'state:reserve-ready': ['A2EEEF', 'Reserve source slice is ready for promotion.'],
              'state:parked': ['BFD4F2', 'Parked; no Agent, push, rerun or polling.'],
              'state:complete': ['006B75', 'Lane work complete.'],
              'state:owner-blocked': ['D93F0B', 'Only Owner or external action remains.'],
              'state:historical': ['EDEDED', 'Historical or superseded evidence only.'],
              'candidate:active': ['B60205', 'Counts toward the maximum of two active Product delivery candidates.'],
              'governance:lane-metadata-incomplete': ['D93F0B', 'B+ lane metadata is missing or invalid.'],
              'governance:wip-violation': ['B60205', 'B+ Terra, Reserve, Closure, TEST or candidate limit is exceeded.'],
            };

            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const rawExisting = (current.labels ?? [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean);
            const managed = new Set(Object.keys(labels));
            const nextLabels = rawExisting.filter((name) => !managed.has(name));
            nextLabels.push(isAgent ? 'origin:agent' : 'origin:owner-or-unknown');

            const laneLabels = {
              TERRA_BUILD: 'lane:terra-build',
              TERRA_RESERVE: 'lane:terra-reserve',
              LUNA_CLOSURE: 'lane:luna-closure',
              TEST_VALIDATION: 'lane:test-validation',
              GOVERNANCE: 'lane:governance',
            };
            const stateLabels = {
              ACTIVE: 'state:active',
              READY_FOR_PROMOTION: 'state:reserve-ready',
              PARKED: 'state:parked',
              COMPLETE: 'state:complete',
              OWNER_BLOCKED: 'state:owner-blocked',
              HISTORICAL: 'state:historical',
            };

            if (isAgent && laneLabels[metadata.lane]) nextLabels.push(laneLabels[metadata.lane]);
            if (isAgent && stateLabels[metadata.state]) nextLabels.push(stateLabels[metadata.state]);
            if (isAgent && metadata.activeCandidate === 'TRUE' && metadata.lane !== 'LUNA_CLOSURE') nextLabels.push('candidate:active');
            if (metadataErrors.length) nextLabels.push('governance:lane-metadata-incomplete');
            if (wipErrors.length) nextLabels.push('governance:wip-violation');

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: current.number,
              labels: [...new Set(nextLabels)],
            });

            const shouldDispatchTest =
              context.payload.action === 'edited' &&
              isAgent &&
              metadata.lane === 'TEST_VALIDATION' &&
              metadata.state === 'ACTIVE' &&
              metadata.testLaneRequired === 'TRUE' &&
              !rawExisting.includes('lane:test-validation') &&
              metadataErrors.length === 0 &&
              wipErrors.length === 0 &&
              summary.activeTest.length === 1 &&
              summary.activeTest[0].number === current.number &&
              current.head.repo.full_name === `${owner}/${repo}`;

            let dispatched = false;
            if (shouldDispatchTest) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci.yml',
                ref: current.head.ref,
                inputs: {
                  dispatch_reason: 'lane_transition',
                  test_lane_pr: String(current.number),
                  expected_head: current.head.sha,
                },
              });
              dispatched = true;
            }

            const metrics = [
              ['Current PR', `#${current.number}`],
              ['Run', metadata.runId || 'missing'],
              ['Free dual-Terra pilot qualified', String(capacity.qualified)],
              ['Origin / lane / state', `${metadata.origin || 'missing'} / ${metadata.lane || 'missing'} / ${metadata.state || 'missing'}`],
              ['Terra', `${summary.activeTerra.length}/${terraLimit}`],
              ['Reserve Terra', `${summary.activeReserve.length}/${reserveLimit}`],
              ['Luna Closure', `${summary.activeClosure.length}/1`],
              ['Remote TEST validation', `${summary.activeTest.length}/1`],
              ['Product candidates', `${summary.activeCandidates.length}/2`],
              ['TEST dispatched', String(dispatched)],
              ['Metadata errors', metadataErrors.join('; ') || 'none'],
              ['WIP errors', wipErrors.join('; ') || 'none'],
            ];

            await core.summary
              .addHeading('Agent WIP Guard — B+ free dual-Terra pilot')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ...metrics,
              ])
              .write();

            if (isAgent) {
              const errors = [...metadataErrors, ...wipErrors];
              const body = errors.length
                ? `${marker}\n## Agent WIP Guard: blocked\n\n${errors.map((error) => `- ${error}`).join('\n')}\n\nPark or reclassify the extra lane before continuing. Do not add commits or rerun CI to work around this guard.`
                : `${marker}\n## Agent WIP Guard: passed — free dual-Terra B+\n\n- Terra: ${summary.activeTerra.length}/${terraLimit}\n- Reserve Terra: ${summary.activeReserve.length}/${reserveLimit}\n- Luna Closure: ${summary.activeClosure.length}/1\n- Remote TEST validation: ${summary.activeTest.length}/1\n- Product candidates: ${summary.activeCandidates.length}/2\n- TEST dispatched on this transition: ${dispatched}\n\nThis Hook validates observable GitHub metadata. It cannot prove which delegated model actually ran.`;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: current.number,
                per_page: 100,
              });
              const previous = comments.find((comment) => comment.body?.includes(marker));
              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: current.number, body });
              }

              if (errors.length) core.setFailed(errors.join('; '));
            }
