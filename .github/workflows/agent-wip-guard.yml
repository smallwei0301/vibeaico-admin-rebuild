name: agent-wip-guard

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is privileged. Always load policy code from the trusted default branch,
      # never from the PR head, and never execute contributor code.
      - name: Checkout trusted policy code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate agent lane metadata and global WIP limits
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policyPath = path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/agent-wip-policy.mjs',
            );
            const policy = await import(pathToFileURL(policyPath).href);

            const { owner, repo } = context.repo;
            const current = context.payload.pull_request;
            const marker = '<!-- agent-wip-guard -->';
            const metadata = policy.parseLaneMetadata(current);
            const isAgent = metadata.origin === 'AGENT';
            const metadataErrors = policy.validateLaneMetadata(metadata, {
              action: context.payload.action ?? '',
            });

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const laneSummary = policy.summarizeActiveLanes(openPulls);
            const wipErrors = isAgent && metadata.state === 'ACTIVE'
              ? policy.validateGlobalWip(laneSummary)
              : [];

            const labels = {
              'origin:agent': ['1D76DB', 'PR or Issue explicitly marked as agent-origin.'],
              'origin:owner-or-unknown': ['BFDADC', 'No explicit agent-origin marker.'],
              'lane:terra-build': ['5319E7', 'Active or parked Terra implementation lane.'],
              'lane:luna-closure': ['C2E0C6', 'Luna closure sweep lane.'],
              'lane:test-validation': ['FBCA04', 'Shared TEST validation lane.'],
              'lane:governance': ['D4C5F9', 'Repository governance work.'],
              'state:active': ['0E8A16', 'Current active lane.'],
              'state:parked': ['BFD4F2', 'Parked; no agent, push, rerun or polling.'],
              'state:complete': ['006B75', 'Lane work complete.'],
              'state:owner-blocked': ['D93F0B', 'Only Owner or external action remains.'],
              'state:historical': ['EDEDED', 'Historical or superseded evidence only.'],
              'candidate:active': ['B60205', 'Counts toward the maximum of two active candidates.'],
              'governance:lane-metadata-incomplete': ['D93F0B', 'Agent PR lane metadata is missing or invalid.'],
              'governance:wip-violation': ['B60205', 'Global active lane or candidate limit is exceeded.'],
            };

            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const managed = new Set(Object.keys(labels));
            const existingLabels = (current.labels ?? [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .filter((name) => !managed.has(name));

            const nextLabels = [
              ...existingLabels,
              isAgent ? 'origin:agent' : 'origin:owner-or-unknown',
            ];
            const laneLabels = {
              TERRA_BUILD: 'lane:terra-build',
              LUNA_CLOSURE: 'lane:luna-closure',
              TEST_VALIDATION: 'lane:test-validation',
              GOVERNANCE: 'lane:governance',
            };
            const stateLabels = {
              ACTIVE: 'state:active',
              PARKED: 'state:parked',
              COMPLETE: 'state:complete',
              OWNER_BLOCKED: 'state:owner-blocked',
              HISTORICAL: 'state:historical',
            };

            if (isAgent && laneLabels[metadata.lane]) nextLabels.push(laneLabels[metadata.lane]);
            if (isAgent && stateLabels[metadata.state]) nextLabels.push(stateLabels[metadata.state]);
            if (isAgent && metadata.activeCandidate === 'TRUE') nextLabels.push('candidate:active');
            if (metadataErrors.length) nextLabels.push('governance:lane-metadata-incomplete');
            if (wipErrors.length) nextLabels.push('governance:wip-violation');

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: current.number,
              labels: [...new Set(nextLabels)],
            });

            await core.summary
              .addHeading('Agent WIP Guard')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Current PR', `#${current.number}`],
                ['Origin / lane / state', `${metadata.origin || 'missing'} / ${metadata.lane || 'missing'} / ${metadata.state || 'missing'}`],
                ['Active Terra', String(laneSummary.activeTerra.length)],
                ['Active Luna Closure', String(laneSummary.activeClosure.length)],
                ['Active TEST validation', String(laneSummary.activeTest.length)],
                ['Active candidates', String(laneSummary.activeCandidates.length)],
                ['Metadata errors', metadataErrors.length ? metadataErrors.join('; ') : 'none'],
                ['WIP errors', wipErrors.length ? wipErrors.join('; ') : 'none'],
              ])
              .write();

            if (isAgent) {
              const allErrors = [...metadataErrors, ...wipErrors];
              const commentBody = allErrors.length
                ? `${marker}\n## Agent WIP Guard: blocked\n\n${allErrors.map((error) => `- ${error}`).join('\n')}\n\nPark the newer lane before continuing. Do not add commits or rerun CI to work around this guard.`
                : `${marker}\n## Agent WIP Guard: passed\n\n- active Terra: ${laneSummary.activeTerra.length}/1\n- active Luna Closure: ${laneSummary.activeClosure.length}/1\n- active TEST validation: ${laneSummary.activeTest.length}/1\n- active candidates: ${laneSummary.activeCandidates.length}/2\n\nThe Hook validates observable PR metadata only; it does not prove the actual delegated model.`;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: current.number,
                per_page: 100,
              });
              const previous = comments.find((comment) => comment.body?.includes(marker));
              if (previous) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: previous.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: current.number,
                  body: commentBody,
                });
              }

              if (allErrors.length) core.setFailed(allErrors.join('; '));
            }
