name: agent-wip-guard

on:
  schedule:
    - cron: '37 * * * *'

  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]

  workflow_run:
    workflows: [agent-review-wakeup]
    types: [completed]

  issue_comment:
    types: [created, edited, deleted]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review_wakeup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'issue_comment' && (github.event.action == 'edited' || github.event.action == 'deleted'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.resolve.outputs.pr_numbers }}
      association_incomplete: ${{ steps.resolve.outputs.association_incomplete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: resolve
        uses: actions/github-script@v9
        with:
          script: >-
            const { pathToFileURL } = require('node:url'); const path = require('node:path'); const astra = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/agents/astra-review-policy.mjs')).href); const { owner, repo } = context.repo; const packet = context.eventName === 'schedule' ? await astra.resolveReviewRecovery({ github, owner, repo }) : context.eventName === 'workflow_run' ? { numbers: [await astra.resolveReviewWakeup({ github, owner, repo, runId: context.payload.workflow_run.id })], associationIncomplete: false } : await astra.resolveRoleReceiptWakeup({ github, owner, repo, repository: context.payload.repository.full_name, issueNumber: context.payload.issue.number, commentId: context.payload.comment.id, nativePr: Boolean(context.payload.issue.pull_request) }); core.setOutput('pr_numbers', JSON.stringify(packet.numbers)); core.setOutput('association_incomplete', String(packet.associationIncomplete)); if (packet.associationIncomplete) core.warning('Receipt association reads incomplete: known heads are invalidated pending; unknown associations require recovery');

  # Untrusted issue comments must be filtered before entering the terminal concurrency queue.
  command_authorization:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request && github.event.issue.state == 'closed' && (github.event.comment.body == '/astra-review-check' || startsWith(github.event.comment.body, '/astra-review-check'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: authorize
        uses: actions/github-script@v9
        with:
          script: |-
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const astra = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,
              'scripts/agents/astra-review-policy.mjs')).href);
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const number = issue?.number;
            const firstLine = String(comment?.body ?? '').split(/\r?\n/, 1)[0].trim();
            if (!Number.isSafeInteger(number) || number < 1 || !issue?.pull_request ||
                issue?.state !== 'closed' || firstLine !== '/astra-review-check') return;
            if (astra.isTrustedFinalRiskAgentUser(comment?.user ?? {})) {
              core.setOutput('authorized', 'true');
              return;
            }
            const username = comment?.user?.login;
            if (!username || username !== context.actor) return;
            const actor = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
            if (['admin', 'maintain', 'write'].includes(actor.data.permission)) core.setOutput('authorized', 'true');

  # Sole terminal writer: shared guard cancellation must never interrupt a terminal mutation.
  # The guard retains its original group: late vetoes still cancel stale open evaluations.
  terminal_cleanup:
    needs: [command_authorization]
    if: always() && ((github.event_name == 'pull_request_target' && (github.event.action == 'closed' || (github.event.action == 'edited' && github.event.pull_request.state == 'closed'))) || (github.event_name == 'issue_comment' && github.event.action == 'created' && needs.command_authorization.result == 'success' && needs.command_authorization.outputs.authorized == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    concurrency:
      group: agent-wip-terminal-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |-
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const boundary = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,
              'scripts/agents/governance-workstream-boundary.mjs')).href);
            const { owner, repo } = context.repo;
            const isComment = context.eventName === 'issue_comment';
            const number = isComment ? context.payload.issue?.number : context.payload.pull_request?.number;
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid canonical PR number');
            if (isComment) {
              const firstLine = String(context.payload.comment?.body ?? '').split(/\r?\n/, 1)[0].trim();
              if (firstLine !== '/astra-review-check' || !context.payload.issue?.pull_request ||
                  context.payload.issue?.state !== 'closed') throw new Error('Invalid closed PR refresh command');
            }
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            // Actions may replace a pending new-close job with a late old edited event.
            // Every allowed terminal wakeup reconciles only the current live closed generation.
            if (current.state !== 'closed') return;
            await boundary.reconcileTerminalPr({ github, owner, repo, current, warning: message => core.warning(message) });
            await core.summary.addHeading('Independent closed-event lane reconciliation')
              .addRaw('Terminal labels and generation-bound STATE_SYNC_PENDING comment only; PR body sync remains pending. Review status, TEST and Product acceptance were not changed.').write();

  guard:
    needs: [review_wakeup]
    if: always() && (github.event_name == 'pull_request_target' || ((github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'issue_comment' && (github.event.action == 'edited' || github.event.action == 'deleted'))) && needs.review_wakeup.result == 'success' && needs.review_wakeup.outputs.pr_numbers != '[]') || (github.event.issue.pull_request && (github.event.comment.body == '/astra-review-check' || startsWith(github.event.comment.body, '/astra-review-check'))))
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.review_wakeup.outputs.pr_numbers || format('[{0}]', github.event.pull_request.number || github.event.issue.number)) }}
    concurrency:
      group: agent-wip-guard-${{ github.repository }}-${{ matrix.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted B+ policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate B+ lane metadata and WIP limits
        env:
          REVIEW_WAKEUP_PR: ${{ matrix.pr_number }}
          RECEIPT_ASSOCIATION_INCOMPLETE: ${{ needs.review_wakeup.outputs.association_incomplete }}
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/dual-terra-wip-policy.mjs',
            )).href);
            const alert = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/wip-alert-fingerprint.mjs',
            )).href);

            const astra = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/agents/astra-review-policy.mjs',
            )).href);

            const boundary = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/agents/governance-workstream-boundary.mjs',
            )).href);

            const capture = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/agents/scorecard-required-gate.mjs',
            )).href);

            const schemaStage = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/agents/schema-staged-release-policy.mjs',
            )).href);

            const { owner, repo } = context.repo;
            const reviewWakeup = context.eventName === 'schedule' || context.eventName === 'workflow_run' || (context.eventName === 'issue_comment' && ['edited', 'deleted'].includes(context.payload.action));
            const payloadCurrent = reviewWakeup ? { number: Number(process.env.REVIEW_WAKEUP_PR) }
              : context.payload.pull_request ?? { number: context.payload.issue.number };
            if (!Number.isSafeInteger(payloadCurrent.number) || payloadCurrent.number < 1) throw new Error('Invalid canonical PR number');
            const { data: current } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: payloadCurrent.number,
            });
            if (context.eventName === 'issue_comment' && !reviewWakeup) {
              const firstLine = String(context.payload.comment?.body ?? '').split(/\r?\n/, 1)[0].trim();
              if (firstLine !== '/astra-review-check') throw new Error('Invalid Final Risk refresh command');
              const commentUser = context.payload.comment?.user ?? {};
              const trustedAgent = astra.isTrustedFinalRiskAgentUser(commentUser);
              if (!trustedAgent) {
                const actor = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: context.actor });
                if (!['admin', 'maintain', 'write'].includes(actor.data.permission)) throw new Error('Review refresh requires write permission or a trusted Final Risk Agent identity');
              }
            }
            // REVIEW_WAKEUP_INVALIDATION_BEGIN
            if (reviewWakeup) {
              if (current.state !== 'open') return;
              await github.rest.repos.createCommitStatus({ owner, repo, sha: current.head.sha, state: 'pending', context: 'Agent WIP Policy', description: 'Refreshing current review evidence; not an approval' });
              if (process.env.RECEIPT_ASSOCIATION_INCOMPLETE === 'true') throw new Error('Receipt association inventory is incomplete; current-head pending requires recovery');
              const metadata = policy.parseLaneMetadata(current);
              if (astra.shouldEnforceFinalRisk({ pullRequestState: current.state, draft: current.draft === true, laneState: metadata.state })) {
                const review = await astra.evaluateGithubAstra({ github, owner, repo, current });
                if (review.errors.length) {
                  const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: current.number });
                  if (fresh.head.sha !== current.head.sha || fresh.body !== current.body || fresh.draft !== current.draft || fresh.state !== current.state) throw new Error('PR changed during review refresh');
                  await github.rest.repos.createCommitStatus({ owner, repo, sha: current.head.sha, state: 'failure', context: 'Agent WIP Policy', description: 'Latest trusted review/role evidence rejected; see review findings' });
                  await core.summary.addHeading('Review lifecycle invalidated policy').addRaw(review.errors.join('; ')).write();
                  return;
                }
              }
            }
            // REVIEW_WAKEUP_INVALIDATION_END
            // Cancellable guard is read-only for terminal PRs. Only terminal_cleanup writes labels/body.
            if (current.state === 'closed') return;
            const marker = '<!-- agent-wip-guard -->';
            if (current.state === 'open') {
              await github.rest.repos.createCommitStatus({ owner, repo, sha: current.head.sha,
                state: 'pending', context: 'Agent WIP Policy', description: 'Revalidating current policy and review evidence',
              });
            }
            const metadata = policy.parseLaneMetadata(current);
            const finalRiskRequired = astra.shouldEnforceFinalRisk({
              pullRequestState: current.state,
              draft: current.draft === true,
              laneState: metadata.state,
            });
            const astraResult = current.state === 'open' && finalRiskRequired
              ? await astra.evaluateGithubAstra({ github, owner, repo, current })
              : { status: current.state === 'open' ? 'DEFERRED_NON_ACTIVE' : 'NOT_REQUIRED', errors: [] };
            // Pending final review must not prevent collecting TEST evidence.
            // It does prevent the stable required policy status from passing.
            const isAgent = metadata.origin === 'AGENT';
            const metadataErrors = policy.validateLaneMetadata(metadata, {
              action: context.payload.action ?? '',
            });
            const ownFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: current.number, per_page: 100,
            });
            const completeInventory = ownFiles.length > 0 && ownFiles.length === current.changed_files;
            const ownPaths = boundary.boundaryPaths(ownFiles);
            const classification = astra.classifyWorkstream({
              body: current.body ?? '', changedFiles: ownPaths, createdAt: current.created_at,
            });
            if (!completeInventory) metadataErrors.push('Incomplete current PR changed-file inventory');
            metadataErrors.push(...classification.errors,
              ...boundary.validateBookkeepingWorkstream({ body: current.body ?? '', changedFiles: ownPaths }));
            if (boundary.shouldValidateDeliveryUnitBoundary(current.body ?? '', classification)) {
              metadataErrors.push(...boundary.validateDeliveryUnitBoundary(current.body ?? '', metadata));
            }
            const captureErrors = await capture.validateGithubRunLedgerChanges({
              github, owner, repo, current, changedFiles: ownFiles,
            });
            const schemaStageErrors = await schemaStage.validateGithubSchemaStagedRelease({
              github, owner, repo, current, changedFiles: ownFiles,
            });
            const productWipApplies = boundary.shouldApplyProductGlobalWip({
              metadata, classification, ownErrors: metadataErrors, completeInventory,
            });

            if (
              isAgent &&
              metadata.state === 'ACTIVE' &&
              metadata.bplusMode === 'TRUE' &&
              metadata.scorecardPath &&
              !/^none$/i.test(metadata.scorecardPath) &&
              metadataErrors.length === 0
            ) {
              let scorecardFound = false;
              for (const ref of [current.head.sha, context.payload.repository.default_branch]) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: metadata.scorecardPath,
                    ref,
                  });
                  if (!Array.isArray(response.data) && response.data.type === 'file') {
                    scorecardFound = true;
                    break;
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              if (!scorecardFound) {
                metadataErrors.push(`SCORECARD_PATH does not exist on the PR head or main: ${metadata.scorecardPath}`);
              }
            }

            const openPulls = productWipApplies ? await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            }) : [];
            const summary = policy.summarizeActiveLanes(openPulls);
            const actualFilesByPullRequest = {};
            const actualFileLoadErrors = [];

            for (const terra of [...summary.activeTerra, ...summary.verifyingTerra]) {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: terra.number,
                  per_page: 100,
                });
                actualFilesByPullRequest[String(terra.number)] = [
                  ...new Set(
                    files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean)),
                  ),
                ];
              } catch (error) {
                actualFileLoadErrors.push(
                  `Dual Terra PR #${terra.number} actual changed-file list could not be loaded: ${error.status ?? 'unknown'}`,
                );
              }
            }

            policy.attachActualChangedFiles(summary, actualFilesByPullRequest);
            const capacity = policy.pilotCapacity(summary);
            const wipErrors = productWipApplies
              ? [...policy.validateGlobalWip(summary), ...actualFileLoadErrors]
              : [];

            const labels = {
              'origin:agent': ['1D76DB', 'PR or Issue explicitly marked as Agent-origin.'],
              'origin:owner-or-unknown': ['BFDADC', 'No explicit Agent-origin marker.'],
              'lane:terra-build': ['0E8A16', 'One of up to two qualified free local-isolated Terra delivery lanes.'],
              'lane:terra-reserve': ['A2EEEF', 'Single-Terra fallback source-only Reserve; disabled during dual pilot.'],
              'lane:luna-closure': ['5319E7', 'The sole Luna Closure / Janitor lane.'],
              'lane:test-validation': ['FBCA04', 'The sole remote canonical TEST validation lane.'],
              'lane:governance': ['D4C5F9', 'Repository governance work.'],
              'state:active': ['0E8A16', 'Current active B+ lane.'],
              'state:reserve-ready': ['A2EEEF', 'Reserve source slice is ready for promotion.'],
              'state:parked': ['BFD4F2', 'Parked; no Agent, push, rerun or polling.'],
              'state:complete': ['006B75', 'Lane work complete.'],
              'state:owner-blocked': ['D93F0B', 'Only Owner or external action remains.'],
              'state:historical': ['EDEDED', 'Historical or superseded evidence only.'],
              'candidate:active': ['B60205', `Counts toward the maximum of ${policy.MAX_ACTIVE_CANDIDATES} active Product delivery candidates.`],
              'governance:lane-metadata-incomplete': ['D93F0B', 'B+ lane metadata is missing or invalid.'],
              'governance:wip-violation': ['B60205', 'B+ Terra, Reserve, Closure, TEST or candidate limit is exceeded.'],
            };

            for (const [name, [color, description]] of Object.entries(reviewWakeup ? {} : labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const liveExisting = (current.labels ?? [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean);
            const managed = new Set(Object.keys(labels));
            const nextLabels = liveExisting.filter((name) => !managed.has(name));
            nextLabels.push(isAgent ? 'origin:agent' : 'origin:owner-or-unknown');

            const laneLabels = {
              TERRA_BUILD: 'lane:terra-build',
              TERRA_RESERVE: 'lane:terra-reserve',
              LUNA_CLOSURE: 'lane:luna-closure',
              TEST_VALIDATION: 'lane:test-validation',
              GOVERNANCE: 'lane:governance',
            };
            const stateLabels = {
              ACTIVE: 'state:active',
              READY_FOR_PROMOTION: 'state:reserve-ready',
              PARKED: 'state:parked',
              COMPLETE: 'state:complete',
              OWNER_BLOCKED: 'state:owner-blocked',
              HISTORICAL: 'state:historical',
            };

            if (isAgent && laneLabels[metadata.lane]) nextLabels.push(laneLabels[metadata.lane]);
            if (isAgent && stateLabels[metadata.state]) nextLabels.push(stateLabels[metadata.state]);
            if (isAgent && metadata.activeCandidate === 'TRUE' && metadata.lane !== 'LUNA_CLOSURE') nextLabels.push('candidate:active');
            if (metadataErrors.length) nextLabels.push('governance:lane-metadata-incomplete');
            if (wipErrors.length) nextLabels.push('governance:wip-violation');

            // Update only this guard's labels, so concurrent classification cannot lose its labels.
            for (const name of (reviewWakeup ? [] : liveExisting.filter(name => managed.has(name) && !nextLabels.includes(name)))) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: current.number, name }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            const additions = [...new Set(nextLabels)].filter(name => managed.has(name) && !liveExisting.includes(name));
            if (!reviewWakeup && additions.length) await github.rest.issues.addLabels({
              owner, repo, issue_number: current.number, labels: additions,
            });

            const shouldDispatchTest =
              !reviewWakeup && context.eventName !== 'workflow_run' &&
              context.payload.action === 'edited' &&
              isAgent &&
              metadata.lane === 'TEST_VALIDATION' &&
              metadata.state === 'ACTIVE' &&
              metadata.testLaneRequired === 'TRUE' &&
              !liveExisting.includes('lane:test-validation') &&
              metadataErrors.length === 0 &&
              captureErrors.length === 0 &&
              schemaStageErrors.length === 0 &&
              wipErrors.length === 0 &&
              summary.activeTest.length === 1 &&
              summary.activeTest[0].number === current.number &&
              current.head.repo.full_name === `${owner}/${repo}`;

            let dispatched = false;
            if (shouldDispatchTest) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci.yml',
                ref: current.head.ref,
                inputs: {
                  dispatch_reason: 'lane_transition',
                  test_lane_pr: String(current.number),
                  expected_head: current.head.sha,
                  base_revision: current.base.sha,
                },
              });
              dispatched = true;
            }

            const errors = current.state === 'open'
              ? [...new Set([...metadataErrors, ...captureErrors, ...schemaStageErrors, ...wipErrors, ...astraResult.errors])]
              : [];
            const policyStatus = astra.finalRiskGateStatus({
              hasErrors: errors.length > 0,
              finalRiskRequired,
            });
            const fingerprint = errors.length
              ? alert.buildWipErrorFingerprint({
                  prNumber: current.number,
                  headSha: current.head.sha,
                  errors,
                })
              : null;
            const comments = isAgent
              ? await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: current.number,
                  per_page: 100,
                })
              : [];
            const previous = comments.find((comment) => comment.body?.includes(marker));
            const duplicateFailure = Boolean(
              errors.length &&
              previous &&
              alert.isDuplicateWipFailure({
                previousBody: previous.body,
                fingerprint,
                headSha: current.head.sha,
              })
            );

            if (current.state === 'open') {
              const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: current.number });
              if (
                fresh.head.sha !== current.head.sha ||
                fresh.base.sha !== current.base.sha ||
                fresh.body !== current.body ||
                fresh.draft !== current.draft ||
                fresh.state !== current.state
              ) {
                throw new Error('PR changed during policy evaluation; wait for its current event');
              }
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: current.head.sha,
                state: policyStatus,
                context: 'Agent WIP Policy',
                description: policyStatus === 'failure'
                  ? `${errors.length} WIP policy error(s); see PR comment`
                  : policyStatus === 'success'
                    ? 'B+ lane metadata and WIP policy passed'
                    : 'Final Risk deferred; Agent WIP Policy intentionally remains pending and is not an approval',
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
            }

            const actualFileSubjects = [...summary.activeTerra, ...summary.verifyingTerra];
            const actualFileCoverage = actualFileSubjects.length
              ? actualFileSubjects
                  .map((terra) => `#${terra.number}:${terra.actualChangedFiles?.length ?? 'not-loaded'}`)
                  .join(', ')
              : 'none';
            const metrics = [
              ['Final Risk gate', finalRiskRequired ? 'ENFORCED' : 'DEFERRED_NON_ACTIVE'],
              ['Astra final risk review', astraResult.status],
              ['Astra change digest', astraResult.changeDigest || 'not-computed'],
              ['Current PR', `#${current.number}`],
              ['Run', metadata.runId || 'missing'],
              ['Product global WIP applied', String(productWipApplies)],
              ['Free dual-Terra pilot qualified', String(capacity.qualified)],
              ['Origin / lane / state', `${metadata.origin || 'missing'} / ${metadata.lane || 'missing'} / ${metadata.state || 'missing'}`],
              ['Terra', `${summary.activeTerra.length}/${capacity.terraMax}`],
              ['Terra actual files loaded', actualFileCoverage],
              ['Reserve Terra', `${summary.activeReserve.length}/${capacity.reserveMax}`],
              ['Luna Closure', `${summary.activeClosure.length}/1`],
              ['Remote TEST validation', `${summary.activeTest.length}/1`],
              ['Product candidates', `${summary.activeCandidates.length}/${policy.MAX_ACTIVE_CANDIDATES}`],
              ['TEST dispatched', String(dispatched)],
              ['Metadata errors', metadataErrors.join('; ') || 'none'],
              ['Raw capture errors', captureErrors.join('; ') || 'none'],
              ['Schema staged-release errors', schemaStageErrors.join('; ') || 'none'],
              ['WIP errors', wipErrors.join('; ') || 'none'],
              ['Error fingerprint', fingerprint ?? 'none'],
              ['Duplicate failure notification suppressed', String(duplicateFailure)],
            ];

            await core.summary
              .addHeading('Agent WIP Guard — B+ free dual-Terra pilot')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ...metrics,
              ])
              .write();

            if (isAgent && !reviewWakeup) {
              const body = errors.length
