name: bounded-edit-556
on:
  push:
    branches: [governance/issue-556-product-run-binding]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply bounded 556 Run binding patch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, os
          base='35af1f5a9f9b75b73da13e1f9cc2f71ffb5dbe97'
          helper='.github/workflows/bounded-edit-556.yml'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='43139639d8ccf2dece8061eeda4b70cc676d72dc'
          assert sorted(git('diff','--name-only',base,'HEAD').splitlines())==sorted([helper,'tests/unit/product-run-binding.556.test.ts'])
          def change(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old);p.write_text(s.replace(old,new))
          change('scripts/agents/scorecard-required-gate.mjs',"import { analyzeScorecardReadiness } from './scorecard-readiness.mjs';", "import { analyzeScorecardReadiness } from './scorecard-readiness.mjs';\nimport { readField, readLifecycleIssue } from './agent-wip-policy.mjs';")
          p=Path('scripts/agents/scorecard-required-gate.mjs');s=p.read_text()
          needle='// Both entrypoints feed bytes to the same existing validators; no candidate code is executed.'
          added=r'''// Product work must be bound even when its PR does not edit a ledger. Origin is not an exemption.
          const bindingFailure = (reason) => [`PRODUCT_RUN_BINDING_REJECTED: ${reason}`];
          export function productRunBinding(body = '') {
            if (readField(body, 'WORKSTREAM').toUpperCase() !== 'PRODUCT_MAINLINE') return null;
            const runId = readField(body, 'RUN_ID');
            const scorecard = readField(body, 'SCORECARD_PATH');
            const issue = readLifecycleIssue(body);
            const errors = [];
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$/.test(runId)
              || /^(none|unknown|null|undefined)$/i.test(runId)) errors.push(...bindingFailure('concrete RUN_ID required'));
            const ledgerPath = `docs/metrics/agent-runs/${runId}.json`;
            // The existing Markdown scorecard points to the same authoritative JSON, never arbitrary files.
            if (![ledgerPath, ledgerPath.replace(/\.json$/, '.md')].includes(scorecard)) {
              errors.push(...bindingFailure('SCORECARD_PATH must identify the RUN_ID JSON or its generated Markdown'));
            }
            if (!issue) errors.push(...bindingFailure('pr-lifecycle issue identity required'));
            return { runId, ledgerPath, issue, errors };
          }

          /** Validate the same bytes on both paths. This verifies recorded facts, not runtime model identity. */
          export function validateProductRunContent(body, content) {
            const binding = productRunBinding(body);
            if (!binding) return [];
            if (binding.errors.length) return binding.errors;
            const errors = validateRunLedgerContent(binding.ledgerPath, content);
            if (errors.length) return errors;
            const run = JSON.parse(content);
            if (run.schemaVersion !== 2 || run.deliveryTruthVersion !== 4
              || !['IN_PROGRESS', 'CLOSURE_RECOVERY'].includes(run.status)
              || run.closeout?.state !== 'OPEN'
              || !['PRODUCT_MAIN_SESSION', 'OWNER'].includes(run.closeout?.ownerRole)) {
              return bindingFailure('an active Product-owned v4 Run is required; historical/closed Runs cannot be borrowed');
            }
            if (run.runId !== binding.runId) errors.push(...bindingFailure('ledger runId differs from RUN_ID'));
            if (!run.sources.some(source => source.ref === `issue/${binding.issue}`)) {
              errors.push(...bindingFailure(`Run sources must include exact issue/${binding.issue}`));
            }
            if (run.delivery.issuesStarted < 1 || !run.modelUsage.tasks.some(task => task.count > 0)) {
              errors.push(...bindingFailure('Product PR needs observed task activity; an empty Run is not capture evidence'));
            }
            return errors;
          }

          function readLocalLedger(repositoryRoot, name) {
            const target = path.resolve(realpathSync(repositoryRoot), name);
            if (realpathSync(target) !== target) throw new Error('symlink is not a ledger file');
            return new TextDecoder('utf-8', { fatal: true }).decode(readFileSync(target));
          }

          function decodeExactBlob(data, expectedSha) {
            if (data?.encoding !== 'base64' || typeof data.content !== 'string'
              || !/^[a-f0-9]{40}$/.test(expectedSha ?? '')) throw new Error('missing bytes');
            const bytes = Buffer.from(data.content, 'base64');
            const digest = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if (digest !== expectedSha || data.sha !== expectedSha || data.size !== bytes.length) throw new Error('incomplete bytes');
            return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
          }

          export function validateLocalProductRunBinding({ body = '', repositoryRoot = process.cwd() } = {}) {
            const binding = productRunBinding(body);
            if (!binding) return [];
            if (binding.errors.length) return binding.errors;
            try { return validateProductRunContent(body, readLocalLedger(repositoryRoot, binding.ledgerPath)); }
            catch { return bindingFailure('bound regular JSON ledger unavailable'); }
          }

          /** @param {{github?: any, owner?: string, repo?: string, current?: any}} [input] */
          export async function validateGithubProductRunBinding({ github, owner, repo, current } = {}) {
            if (current?.state === 'closed') return [];
            const binding = productRunBinding(current?.body ?? '');
            if (!binding) return [];
            if (binding.errors.length) return binding.errors;
            if (!/^[a-f0-9]{40}$/.test(current?.head?.sha ?? '')) return bindingFailure('exact PR head required');
            try {
              // Tree modes do not follow symlinks, unlike the Contents endpoint.
              const { data: tree } = await github.rest.git.getTree({ owner, repo,
                tree_sha: current.head.sha, recursive: '1' });
              if (tree.truncated !== false || !Array.isArray(tree.tree)) throw new Error('incomplete tree');
              const entries = tree.tree.filter(entry => entry.path === binding.ledgerPath);
              if (entries.length !== 1 || entries[0].type !== 'blob'
                || !['100644', '100755'].includes(entries[0].mode)
                || !/^[a-f0-9]{40}$/.test(entries[0].sha ?? '')) throw new Error('not a regular ledger');
              const { data } = await github.rest.git.getBlob({ owner, repo, file_sha: entries[0].sha });
              return validateProductRunContent(current.body, decodeExactBlob(data, entries[0].sha));
            } catch { return bindingFailure('exact-head bound JSON ledger unavailable; no mutable-ref or historical fallback'); }
          }

          '''
          assert s.count(needle)==1;s=s.replace(needle,added+needle)
          s=s.replace('/** @param {{changedFiles?: string[] | null, repositoryRoot?: string}} [input] */', '/** @param {{changedFiles?: string[] | null, repositoryRoot?: string, body?: string}} [input] */')
          s=s.replace('export function validateLocalRunLedgerChanges({ changedFiles, repositoryRoot = process.cwd() } = {})', "export function validateLocalRunLedgerChanges({ changedFiles, repositoryRoot = process.cwd(), body = '' } = {})")
          old="      const target = path.resolve(realpathSync(repositoryRoot), name);\n      if (realpathSync(target) !== target) throw new Error('symlink is not a ledger file');\n      errors.push(...validateRunLedgerContent(name, new TextDecoder('utf-8', { fatal: true }).decode(readFileSync(target))));"
          assert old in s;s=s.replace(old,'      errors.push(...validateRunLedgerContent(name, readLocalLedger(repositoryRoot, name)));')
          s=s.replace('  return errors;\n}\n\n/** @param {{github?: any, owner?: string, repo?: string, current?: any, changedFiles?: any[] | null}}', '  errors.push(...validateLocalProductRunBinding({ body, repositoryRoot }));\n  return [...new Set(errors)];\n}\n\n/** @param {{github?: any, owner?: string, repo?: string, current?: any, changedFiles?: any[] | null}}')
          old="      if (data?.encoding !== 'base64' || typeof data.content !== 'string') throw new Error('missing bytes');\n      const bytes = Buffer.from(data.content, 'base64');\n      const digest = createHash('sha1').update(`blob ${bytes.length}\\0`).update(bytes).digest('hex');\n      if (digest !== file.sha || data.sha !== file.sha || data.size !== bytes.length) throw new Error('incomplete bytes');\n      errors.push(...validateRunLedgerContent(file.filename, new TextDecoder('utf-8', { fatal: true }).decode(bytes)));"
          assert old in s;s=s.replace(old,'      errors.push(...validateRunLedgerContent(file.filename, decodeExactBlob(data, file.sha)));')
          assert s.endswith('  return errors;\n}\n');s=s[:-len('  return errors;\n}\n')]+"  errors.push(...await validateGithubProductRunBinding({ github, owner, repo, current }));\n  return [...new Set(errors)];\n}\n"
          s=s.replace('// Historical files not changed by this PR never reach this function.','// Bound active Product Runs are rechecked; unrelated historical files are not loaded.')
          p.write_text(s)
          change('scripts/agents/agent-wip-preflight.mjs','validateLocalRunLedgerChanges({ changedFiles, repositoryRoot })','validateLocalRunLedgerChanges({ changedFiles, repositoryRoot, body: text })')
          change('docs/AGENT-EXECUTION.md','### 10.2 Live Scorecard Contract（不要等複盤才發現沒資料）\n','''### 10.2 Live Scorecard Contract（不要等複盤才發現沒資料）

          - #556：完整 preflight 與 required WIP gate 都檢查每張 Product PR 的 Run 綁定，即使沒有修改 ledger，
            也不因 OWNER／UNKNOWN 來源或 BPLUS_MODE=false 略過。純治理不借用 Product Run。
          - RUN_ID 必須對上 `docs/metrics/agent-runs/<RUN_ID>.json`；SCORECARD_PATH 可指此 JSON 或同名產生的 Markdown，
            判定始終讀 JSON。遠端只讀 PR exact head 的檔案並驗證 blob bytes，不退回可變 main 或另一份歷史帳本。
          - 綁定 Run 必須 v4、尚未關帳且由 Product/Owner 持有；sources 以 `issue/<number>` 精確引用本次議題，
            有真實 task 與 issuesStarted，並通過既有 strict-live 一致性規則。空白 Run 不能替實際施工背書。
          - 同一 Run 可跨日接續，不要求每天新建檔案；不得把治理帳本、已關帳 Run、事後重建觀測冒充即時 Product capture。
            缺原始事件時保留 NEEDS_CAPTURE 與原因，交原 Product 工作線接續或如實交接，不補造零、不替它強行關帳。
          ''')
          change('docs/AGENT-PLAYBOOK.md','### PB-035 —','''#### 2026-09-17 綁定入口缺口：只驗 changed ledger 不代表所有 Product 已記帳（#556）

          - #551 有 Product CI、隔離測試與審查，但當時正文無 RUN_ID/SCORECARD_PATH；#538 只遍歷變更 ledger，
            沒改帳本的 PR 沒有被要求提出有效綁定。這是檢查適用範圍缺口，不是再缺一套評分演算法。
          - 沿用既有 JSON/schema/strict-live 判定，從同一 required helper 核對 Product Run ID、exact-head bytes，
            Product closeout owner、issue source 與 task；本機 full preflight 傳入同一正文。OWNER 不是記帳豁免。
          - 正例包含跨日 Run、JSON/Markdown 路徑與純治理不借 Run；反例含缺 ID、錯 Run、空 Run、closed/governance owner，
            壞 JSON、symlink、blob/size 不符和來源缺失。直接執行 WIP workflow，確認未改 ledger 仍會失敗。
          - 未來不要用「今天沒有新檔名」推斷漏記；查同一 Run 的事件覆蓋。歷史 lost events 保持 unavailable，
            current observation 只能證明重查時的事實，不能當成事件發生時的採集或效率分數。

          ### PB-035 —''')
          change('tests/unit/governance-workstream-boundary.500.test.ts',"  it('executes classification workflow: pure bookkeeping incorrectly marked Product is rejected', async () => {",'''  it.each(['OWNER', 'AGENT', 'UNKNOWN'])('requires Product Run binding for %s even without a changed ledger', async (origin) => {
              const body = product.replace('WORK_ORIGIN: AGENT', `WORK_ORIGIN: ${origin}`)
                .replace('RUN_ID: 2026-09-15-product-delivery-r01', 'RUN_ID: none');
              const result = await runWorkflow('.github/workflows/agent-wip-guard.yml', subject(body), ['src/app/page.tsx']);
              expect(result.failures.join('\\n')).toContain('PRODUCT_RUN_BINDING_REJECTED');
              expect(result.statuses.at(-1).state).toBe('failure');
              expect(result.calls).not.toContain('dispatch');
            });
            it('executes classification workflow: pure bookkeeping incorrectly marked Product is rejected', async () => {''')
          Path(helper).unlink()
          files=git('diff','--name-only',base).splitlines()
          allowed=['scripts/agents/scorecard-required-gate.mjs','scripts/agents/agent-wip-preflight.mjs','tests/unit/product-run-binding.556.test.ts','tests/unit/governance-workstream-boundary.500.test.ts','docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md']
          assert sorted(files)==sorted(allowed),files
          subprocess.run(['git','diff','--check',base],check=True)
          stat=git('diff','--numstat',base)
          assert sum(sum(int(x) for x in line.split('\t')[:2]) for line in stat.splitlines())<=800
          Path(os.environ['RUNNER_TEMP'],'556-files.json').write_text(json.dumps(files))
          print(stat)
          PY
      - name: Source-only tests and mutation
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/unit/product-run-binding.556.test.ts tests/unit/governance-workstream-boundary.500.test.ts tests/unit/scorecard-required-gate.538.test.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/agents/scorecard-required-gate.mjs');s=p.read_text()
          Path('/tmp/556-original.mjs').write_text(s)
          target='  errors.push(...await validateGithubProductRunBinding({ github, owner, repo, current }));'
          assert s.count(target)==1;p.write_text(s.replace(target,''))
          PY
          set +e
          npx vitest run tests/unit/product-run-binding.556.test.ts tests/unit/governance-workstream-boundary.500.test.ts > "$RUNNER_TEMP/556-mutation.log" 2>&1
          code=$?
          set -e
          cp /tmp/556-original.mjs scripts/agents/scorecard-required-gate.mjs
          if [ "$code" -eq 0 ]; then echo 'Mutation survived'; exit 1; fi
          grep -E '(FAIL|Tests|Test Files)' "$RUNNER_TEMP/556-mutation.log" || true
          npx vitest run tests/unit/product-run-binding.556.test.ts tests/unit/governance-workstream-boundary.500.test.ts tests/unit/scorecard-required-gate.538.test.ts
          npm test
      - name: Publish validated source blobs only
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs'); const path=require('node:path');
            const {owner,repo}=context.repo;
            const branch='governance/issue-556-product-run-binding';
            if(context.ref!==`refs/heads/${branch}`) throw new Error('Wrong branch');
            const current=await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
            if(current.data.object.sha!==context.sha) throw new Error('Concurrent branch edit');
            const files=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'556-files.json'),'utf8'));
            const allowed=['scripts/agents/scorecard-required-gate.mjs','scripts/agents/agent-wip-preflight.mjs','tests/unit/product-run-binding.556.test.ts','tests/unit/governance-workstream-boundary.500.test.ts','docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md'];
            if(files.length!==6||files.some(f=>!allowed.includes(f))) throw new Error('Scope mismatch');
            const blobs=[];
            for(const file of files){const b=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});blobs.push({path:file,mode:'100644',type:'blob',sha:b.data.sha});}
            core.info(`PATCH_BLOBS=${JSON.stringify(blobs)}`);
            await core.summary.addHeading('Validated bounded #556 source').addCodeBlock(JSON.stringify(blobs,null,2),'json').write();
      - name: Preserve patch and focused evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/556-evidence"
          git diff 35af1f5a9f9b75b73da13e1f9cc2f71ffb5dbe97 > "$RUNNER_TEMP/556-evidence/candidate.patch"
          cp "$RUNNER_TEMP/556-mutation.log" "$RUNNER_TEMP/556-evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-556-source-evidence
          path: ${{ runner.temp }}/556-evidence/
          retention-days: 7
