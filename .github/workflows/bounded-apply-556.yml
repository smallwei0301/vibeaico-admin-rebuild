name: bounded-apply-556
on:
  push:
    branches: [governance/issue-556-product-run-binding]
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'chore: validate 556 fixture type declaration'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply literal seven-file patch with explicit synthetic fixture type
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          prev='196484df6a7c9857762c2873562b09452dd32b23'
          text=subprocess.check_output(['git','show',prev+':.github/workflows/bounded-apply-556.yml'],text=True)
          a='      - name: Apply reviewed source patch and complete the existing synthetic fixture\n        shell: bash\n        run: |\n'
          b='\n      - name: Actual tests, deliberate missing-call mutation, full unit suite'
          piece=text.split(a,1)[1].split(b,1)[0]
          piece='\n'.join(line[10:] if line.startswith('          ') else line for line in piece.splitlines())
          script=piece.split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          script=script.replace("=='f154186039baea06ad082761070c1b4cff62c10f'", "=='"+prev+"'")
          assert script.count('after="      const run =')==1
          script=script.replace('after="      const run =', 'after="      const run: any =')
          exec(compile(script,'reviewed-seven-file-patch','exec'))
          p=Path('docs/AGENT-PLAYBOOK.md');s=p.read_text();mark='### PB-035 —';assert s.count(mark)==1
          p.write_text(s.replace(mark,'- #556 run 35173586198 型別檢查指出 JS factory 的推導型別未包含展開欄位；僅對 synthetic fixture 明示型別，保留正式驗證器與全部斷言。\n\n'+mark))
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Actual typecheck, focused mutation tests and full unit suite
        shell: bash
        run: bash -e -o pipefail "$RUNNER_TEMP/556-validate.sh"
      - name: Publish seven source blobs without changing any branch
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs'); const path=require('node:path');
            const {owner,repo}=context.repo;
            const branch='governance/issue-556-product-run-binding';
            if(context.ref!==`refs/heads/${branch}`) throw new Error('Wrong branch');
            const current=await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
            if(current.data.object.sha!==context.sha) throw new Error('Concurrent branch edit');
            const files=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'556-files.json'),'utf8'));
            const allowed=['scripts/agents/scorecard-required-gate.mjs','scripts/agents/agent-wip-preflight.mjs','tests/unit/product-run-binding.556.test.ts','tests/unit/governance-workstream-boundary.500.test.ts','tests/unit/wip-evidence.497.test.ts','docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md'];
            if(files.length!==7||files.some(f=>!allowed.includes(f))) throw new Error('Scope mismatch');
            const blobs=[];
            for(const file of files){const b=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});blobs.push({path:file,mode:'100644',type:'blob',sha:b.data.sha});}
            core.info(`PATCH_BLOBS=${JSON.stringify(blobs)}`);
            await core.summary.addHeading('Validated #556 candidate source').addCodeBlock(JSON.stringify(blobs,null,2),'json').write();
      - name: Preserve source-only evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/556-evidence"
          git diff 35af1f5a9f9b75b73da13e1f9cc2f71ffb5dbe97 > "$RUNNER_TEMP/556-evidence/candidate.patch"
          cp "$RUNNER_TEMP/556-mutation.log" "$RUNNER_TEMP/556-evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-556-source-evidence
          path: ${{ runner.temp }}/556-evidence/
          retention-days: 7
