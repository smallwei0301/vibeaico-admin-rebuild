name: bounded-apply-556
on:
  push:
    branches: [governance/issue-556-product-run-binding]
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'chore: validate 556 with complete preflight fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed source patch and complete the existing synthetic fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json
          old='02dfdf710bb7947ae81728c15586c485c7e48d8f'
          text=subprocess.check_output(['git','show',old+':.github/workflows/bounded-edit-556.yml'],text=True)
          def block(a,b):
              s=text.split(a,1)[1].split(b,1)[0]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in s.splitlines())
          patch=block('      - name: Apply bounded source patch\n        shell: bash\n        run: |\n','\n      - name: Source-only tests and mutation')
          patch=patch.split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          patch=patch.replace("=='43139639d8ccf2dece8061eeda4b70cc676d72dc'", "=='f154186039baea06ad082761070c1b4cff62c10f'")
          patch=patch.replace("sorted([helper,'tests/unit/product-run-binding.556.test.ts'])", "sorted([helper,'tests/unit/product-run-binding.556.test.ts','.github/workflows/bounded-apply-556.yml'])")
          patch=patch.replace('Path(helper).unlink()', "Path(helper).unlink(); Path('.github/workflows/bounded-apply-556.yml').unlink()")
          exec(compile(patch,'literal-reviewed-556-patch','exec'))
          p=Path('tests/unit/wip-evidence.497.test.ts');s=p.read_text()
          before="      fs.writeFileSync(path.join(cwd, 'docs/metrics/agent-runs/2026-09-16-fixture.json'), JSON.stringify(\n        createRunLedgerV2('2026-09-16-fixture', new Date().toISOString(), { closeoutOwner: 'PRODUCT_MAIN_SESSION' })));"
          after="      const run = createRunLedgerV2('2026-09-16-fixture', new Date().toISOString(), { closeoutOwner: 'PRODUCT_MAIN_SESSION' });\n      run.sources = [{ type: 'ISSUE', ref: 'issue/43', note: 'Synthetic preflight fixture, not Product history' }];\n      run.delivery.issuesStarted = 1;\n      run.modelUsage.tasks = [{ id: 'synthetic-497', requestedModel: 'unknown', actualModel: 'unknown',\n        role: 'Synthetic preflight fixture', count: 1, contextClass: 'compact', accepted: false,\n        inputTokens: null, outputTokens: null, cachedTokens: null }];\n      fs.writeFileSync(path.join(cwd, 'docs/metrics/agent-runs/2026-09-16-fixture.json'), JSON.stringify(run));"
          assert s.count(before)==1;p.write_text(s.replace(before,after))
          p=Path('docs/AGENT-PLAYBOOK.md');s=p.read_text();mark='### PB-035 —';assert s.count(mark)==1
          s=s.replace(mark,'- #556 初次 branch-only runner 因 YAML 未引用 scalar 的冒號未啟動；修正為 block scalar，載體不保留於 main。\n- #556 run 35173223274：局部48/48、缺接線反例8項轉紅、還原48/48；完整測試2993/2994。\n  唯一失敗為 #497 正例只建空白 Run。補精確 issue/43 與 synthetic task 後仍保留原 freeze/dirty-worktree 斷言，未豁免新規則。\n\n'+mark)
          p.write_text(s)
          test=block('      - name: Source-only tests and mutation\n        shell: bash\n        run: |\n','\n      - name: Publish validated source blobs only')
          test=test.replace('tests/unit/scorecard-required-gate.538.test.ts','tests/unit/scorecard-required-gate.538.test.ts tests/unit/wip-evidence.497.test.ts')
          Path(os.environ['RUNNER_TEMP'],'556-validate.sh').write_text(test)
          files=json.loads(Path(os.environ['RUNNER_TEMP'],'556-files.json').read_text());files.append('tests/unit/wip-evidence.497.test.ts')
          Path(os.environ['RUNNER_TEMP'],'556-files.json').write_text(json.dumps(files))
          subprocess.run(['git','diff','--check'],check=True)
          actual=subprocess.check_output(['git','diff','--name-only','35af1f5a9f9b75b73da13e1f9cc2f71ffb5dbe97'],text=True).splitlines()
          assert sorted(actual)==sorted(files)
          stat=subprocess.check_output(['git','diff','--numstat','35af1f5a9f9b75b73da13e1f9cc2f71ffb5dbe97'],text=True)
          assert sum(sum(int(x) for x in line.split('\t')[:2]) for line in stat.splitlines())<=800
          print(stat)
          PY
      - name: Actual tests, deliberate missing-call mutation, full unit suite
        shell: bash
        run: bash -e -o pipefail "$RUNNER_TEMP/556-validate.sh"
      - name: Publish only validated immutable source blobs
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('node:fs'); const path=require('node:path');
            const {owner,repo}=context.repo;
            const branch='governance/issue-556-product-run-binding';
            if(context.ref!==`refs/heads/${branch}`) throw new Error('Wrong branch');
            const current=await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
            if(current.data.object.sha!==context.sha) throw new Error('Concurrent branch edit');
            const files=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'556-files.json'),'utf8'));
            const allowed=['scripts/agents/scorecard-required-gate.mjs','scripts/agents/agent-wip-preflight.mjs','tests/unit/product-run-binding.556.test.ts','tests/unit/governance-workstream-boundary.500.test.ts','tests/unit/wip-evidence.497.test.ts','docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md'];
            if(files.length!==7||files.some(f=>!allowed.includes(f))) throw new Error('Scope mismatch');
            const blobs=[];
            for(const file of files){const b=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});blobs.push({path:file,mode:'100644',type:'blob',sha:b.data.sha});}
            core.info(`PATCH_BLOBS=${JSON.stringify(blobs)}`);
            await core.summary.addHeading('Validated bounded #556 source').addCodeBlock(JSON.stringify(blobs,null,2),'json').write();
      - name: Preserve source-only evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/556-evidence"
          git diff 35af1f5a9f9b75b73da13e1f9cc2f71ffb5dbe97 > "$RUNNER_TEMP/556-evidence/candidate.patch"
          cp "$RUNNER_TEMP/556-mutation.log" "$RUNNER_TEMP/556-evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-556-source-evidence
          path: ${{ runner.temp }}/556-evidence/
          retention-days: 7
