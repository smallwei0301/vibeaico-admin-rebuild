name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dispatch_reason:
        description: Why a full shared TEST run is requested
        required: true
        type: choice
        options: [lane_transition, main_manual]
      test_lane_pr:
        description: Open PR number owning TEST_VALIDATION; empty only for main_manual
        required: false
        type: string
      expected_head:
        description: Exact commit SHA that must equal the dispatched ref head
        required: true
        type: string
      base_revision:
        description: Exact base SHA used for the dispatched diff and repository-integrity comparison
        required: true
        type: string
      production_db_release_id:
        description: Optional Production DB releaseId; requires main_manual on main together with planned_at
        required: false
        type: string
      production_db_planned_at:
        description: Optional ISO UTC plan timestamp for Production DB G3 validation; requires release_id
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      reason: ${{ steps.classify.outputs.reason }}
      detail: ${{ steps.classify.outputs.detail }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
      runtime_path: ${{ steps.classify.outputs.runtime_path }}
      base_revision: ${{ steps.classify.outputs.base_revision }}
      head_revision: ${{ steps.classify.outputs.head_revision }}
      run_test_validation: ${{ steps.test_policy.outputs.run_test_validation }}
      test_policy_reason: ${{ steps.test_policy.outputs.test_policy_reason }}
      test_lane_holders: ${{ steps.test_policy.outputs.test_lane_holders }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: classify
        run: node scripts/ci/classify-changes.mjs
      - id: test_policy
        name: Authenticate shared TEST owner
        uses: actions/github-script@v9
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/agent-wip-policy.mjs',
            )).href);

            const docsOnly = process.env.DOCS_ONLY === 'true';
            const inputs = context.payload.inputs ?? {};
            let openPullRequests = [];
            let currentPullRequest = context.payload.pull_request ?? null;

            if (
              (context.eventName === 'pull_request' && !docsOnly) ||
              context.eventName === 'workflow_dispatch'
            ) {
              openPullRequests = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
            }

            if (
              context.eventName === 'workflow_dispatch' &&
              context.ref !== 'refs/heads/main' &&
              /^\d+$/.test(String(inputs.test_lane_pr ?? ''))
            ) {
              try {
                currentPullRequest = (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: Number(inputs.test_lane_pr),
                })).data;
              } catch {
                currentPullRequest = null;
              }
            }

            let currentCommit = null;
            if (context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main') {
              try {
                currentCommit = (await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: context.sha,
                })).data;
              } catch {
                currentCommit = null;
              }
            }

            const decision = policy.decideTestValidation({
              eventName: context.eventName,
              ref: context.ref,
              sha: context.sha,
              docsOnly,
              currentPullRequest,
              openPullRequests,
              inputs,
              currentCommit,
              repoFullName: context.payload.repository?.full_name ?? '',
            });

            core.setOutput('run_test_validation', String(decision.runTestValidation));
            core.setOutput('test_policy_reason', decision.reason);
            core.setOutput('test_lane_holders', decision.holders.join(','));
            const rejectedDispatch = context.eventName === 'workflow_dispatch' &&
              !decision.runTestValidation &&
              decision.reason !== 'docs_only';
            await core.summary
              .addHeading('Shared TEST policy — B+')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Result', header: true }],
                ['Run heavy TEST', String(decision.runTestValidation)],
                ['Reason', decision.reason],
                ['TEST holders', decision.holders.join(', ') || 'none'],
                ['Policy error', decision.error || 'none'],
              ])
              .write();
            if (decision.error || rejectedDispatch) {
              core.setFailed(decision.error || `Rejected workflow dispatch: ${decision.reason}`);
            }

  check:
    needs: classify-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Reject incomplete or corrupted repository trees
        env:
          BASE_REVISION: ${{ needs.classify-changes.outputs.base_revision }}
          HEAD_REVISION: ${{ needs.classify-changes.outputs.head_revision }}
        run: npm run guard:repo-integrity
      - name: Verify production ledger alias map (#396)
        run: npm run guard:ledger-alias-map
      - name: Validate .claude skill symlinks
        run: |
          if [ -d .claude/skills ] && find .claude/skills -type l ! -exec test -e {} \; -print -quit | grep -q .; then
            echo 'A .claude/skills symlink target is missing.' >&2
            exit 1
          fi
      - name: Lightweight documentation check
        if: ${{ needs.classify-changes.outputs.docs_only == 'true' }}
        run: |
          node --check scripts/ci/classify-changes.mjs
          git diff --check "${{ needs.classify-changes.outputs.base_revision }}" "${{ needs.classify-changes.outputs.head_revision }}"
      - name: Independent documentation allowlist revalidation
        if: ${{ needs.classify-changes.outputs.docs_only == 'true' }}
        env:
          BASE_REVISION: ${{ needs.classify-changes.outputs.base_revision }}
          HEAD_REVISION: ${{ needs.classify-changes.outputs.head_revision }}
        run: |
          node scripts/ci/verify-docs-only.mjs
          echo '- docs-only: npm, typecheck, unit, build and shared TEST intentionally skipped' >> "$GITHUB_STEP_SUMMARY"
      - name: Install the exact locked dependency tree
        run: npm ci
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
      - run: npm run typecheck
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
      - run: npm test
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
      - run: npm run build
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        env: { NEXT_PUBLIC_USE_MOCK: 'true' }

  integration:
    name: integration
    needs: [classify-changes, check]
    if: ${{ needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.classify-changes.outputs.docs_only == 'true' && format('docs-integration-{0}', github.run_id) || needs.classify-changes.outputs.run_test_validation == 'true' && 'shared-test-supabase-integration' || format('source-only-integration-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate optional Production DB G3 dispatch contract
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.production_db_release_id }}
          PLANNED_AT: ${{ inputs.production_db_planned_at }}
          DISPATCH_REASON: ${{ inputs.dispatch_reason }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_ID" ] || [ -n "$PLANNED_AT" ]; then
            test -n "$RELEASE_ID"
            test -n "$PLANNED_AT"
            test "$GITHUB_REF" = 'refs/heads/main'
            test "$DISPATCH_REASON" = 'main_manual'
            test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          fi
      - name: Documentation policy skip evidence
        if: ${{ needs.classify-changes.outputs.docs_only == 'true' }}
        run: |
          echo 'POLICY_SKIP: shared TEST integration and Playwright E2E are skipped for docs-only work.'
          echo '- docs-only shared TEST policy skip' >> "$GITHUB_STEP_SUMMARY"
      - name: Source-only policy skip evidence
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' && needs.classify-changes.outputs.run_test_validation != 'true' }}
        env:
          TEST_POLICY_REASON: ${{ needs.classify-changes.outputs.test_policy_reason }}
          TEST_LANE_HOLDERS: ${{ needs.classify-changes.outputs.test_lane_holders }}
        run: |
          echo "POLICY_SKIP: this PR is not the sole active TEST_VALIDATION holder (${TEST_POLICY_REASON})."
          echo "- source-only; TEST holders: ${TEST_LANE_HOLDERS:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' }}
        run: npm ci
      - name: Validate exact Production DB release plan on canonical TEST
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' && inputs.production_db_release_id != '' && inputs.production_db_planned_at != '' }}
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.production_db_release_id }}
          PLANNED_AT: ${{ inputs.production_db_planned_at }}
          MAIN_SHA: ${{ github.sha }}
          TEST_PROJECT_REF: nmwhwngojosmagjuvxol
          TEST_DB_RELEASE_TOKEN: ${{ secrets.TEST_DB_RELEASE_TOKEN }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/config/supabase-production-root-bundle.crt
        run: |
          set -euo pipefail
          test -n "$TEST_DB_RELEASE_TOKEN"
          test -s "$NODE_EXTRA_CA_CERTS"
          node scripts/db/validate-production-db-release-on-test.mjs plan \
            "$RELEASE_ID" "$MAIN_SHA" "$PLANNED_AT" \
            "$RUNNER_TEMP/production-db-release-plan.json"
          node scripts/db/validate-production-db-release-on-test.mjs apply \
            "$RUNNER_TEMP/production-db-release-plan.json" \
            "$RUNNER_TEMP/production-db-test-release-evidence.json"
      - name: Run integration tests
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' }}
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.production_db_release_id }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.TEST_SETTINGS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          TEST_CRON_SECRET: ci-cron-secret-0711
          LINE_API_BASE: http://localhost:4123
          LINE_DATA_API_BASE: http://localhost:4123
          RESEND_BASE_URL: http://localhost:4124
          RESEND_API_KEY: re_test_ci_local_mock
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_ID:-}" ]; then
            npx vitest run tests/integration \
              --config vitest.integration.config.mts \
              --no-file-parallelism \
              --reporter=default --reporter=json \
              --outputFile.json="$RUNNER_TEMP/production-db-g3-integration.json"
          else
            npm run test:integration
          fi
      - name: Run E2E tests
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' }}
        run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.TEST_SETTINGS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          TEST_CRON_SECRET: ci-cron-secret-0711
          LINE_API_BASE: http://localhost:4123
          LINE_DATA_API_BASE: http://localhost:4123
          RESEND_BASE_URL: http://localhost:4124
          RESEND_API_KEY: re_test_ci_local_mock
      - name: Emit trusted-main shared TEST raw evidence
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' }}
        shell: bash
        env:
          MAIN_SHA: ${{ github.sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          BASE_REVISION: ${{ inputs.base_revision }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TEST_POLICY_REASON: ${{ needs.classify-changes.outputs.test_policy_reason }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          set -euo pipefail
          test "$MAIN_SHA" = "$EXPECTED_HEAD"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.TEST_SUPABASE_URL);
          if (url.hostname !== 'nmwhwngojosmagjuvxol.supabase.co') {
            throw new Error(`wrong canonical TEST project host: ${url.hostname}`);
          }
          NODE
          node --input-type=module > "$RUNNER_TEMP/shared-test-run-evidence.json" <<'NODE'
          const evidence = {
            schemaVersion: 1,
            status: 'SHARED_TEST_RUN_VERIFIED',
            policySkip: false,
            repository: 'smallwei0301/vibeaico-admin-rebuild',
            workflowPath: '.github/workflows/ci.yml',
            event: 'workflow_dispatch',
            dispatchReason: 'main_manual',
            mainSha: process.env.MAIN_SHA,
            expectedHead: process.env.EXPECTED_HEAD,
            baseRevision: process.env.BASE_REVISION,
            testProjectRef: 'nmwhwngojosmagjuvxol',
            sourceRunId: process.env.RUN_ID,
            sourceRunAttempt: Number(process.env.RUN_ATTEMPT),
            policyReason: process.env.TEST_POLICY_REASON,
            integrationStep: 'PASSED',
            e2eStep: 'PASSED',
            cleanupClaim: 'NOT_INFERRED_FROM_WORKFLOW_SUCCESS',
            authzCoverageClaim: 'NOT_INFERRED_FROM_WORKFLOW_SUCCESS',
            databaseMutationAuthorized: false,
            productionMutationPerformed: false,
            emittedAt: new Date().toISOString(),
          };
          console.log(JSON.stringify(evidence, null, 2));
          NODE
      - name: Build Production DB G3 coverage evidence
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' && inputs.production_db_release_id != '' && inputs.production_db_planned_at != '' }}
        run: |
          node scripts/agents/production-db-g3-test-artifacts.mjs coverage \
            "$RUNNER_TEMP/production-db-release-plan.json" \
            "$RUNNER_TEMP/production-db-g3-integration.json" \
            "$RUNNER_TEMP/production-db-test-coverage-evidence.json"
      - name: Verify Production DB G3 migration-scoped cleanup
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' && inputs.production_db_release_id != '' && inputs.production_db_planned_at != '' }}
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/agents/production-db-g3-test-artifacts.mjs cleanup \
            "$RUNNER_TEMP/production-db-release-plan.json" \
            "$RUNNER_TEMP/production-db-test-cleanup-evidence.json"
      - name: Capture Production DB G3 post-TEST schema evidence
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' && inputs.production_db_release_id != '' && inputs.production_db_planned_at != '' }}
        shell: bash
        env:
          SCHEMA_OBSERVER_TOKEN: ${{ secrets.SCHEMA_OBSERVER_TOKEN }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/config/supabase-production-root-bundle.crt
        run: |
          set -euo pipefail
          test -n "$SCHEMA_OBSERVER_TOKEN"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -s "$NODE_EXTRA_CA_CERTS"
          node scripts/agents/production-db-g3-post-test-schema.mjs capture \
            "$RUNNER_TEMP/production-db-release-plan.json" \
            "$RUNNER_TEMP/production-db-test-post-schema-snapshot.json" \
            "$RUNNER_TEMP/production-db-test-post-schema-evidence.json"
      - name: Assemble final Production DB G3 TEST_VERIFIED evidence
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' && inputs.production_db_release_id != '' && inputs.production_db_planned_at != '' }}
        run: |
          node scripts/agents/assemble-production-db-test-evidence.mjs \
            "$RUNNER_TEMP/production-db-release-plan.json" \
            "$RUNNER_TEMP/shared-test-run-evidence.json" \
            "$RUNNER_TEMP/production-db-test-release-evidence.json" \
            "$RUNNER_TEMP/production-db-test-cleanup-evidence.json" \
            "$RUNNER_TEMP/production-db-test-coverage-evidence.json" \
            "$RUNNER_TEMP/production-db-test-post-schema-evidence.json" \
            "$RUNNER_TEMP/production-db-test-verified.json"
      - name: Upload Production DB G3 trusted evidence bundle
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' && inputs.production_db_release_id != '' && inputs.production_db_planned_at != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-db-g3-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-db-release-plan.json
            ${{ runner.temp }}/production-db-test-release-evidence.json
            ${{ runner.temp }}/shared-test-run-evidence.json
            ${{ runner.temp }}/production-db-g3-integration.json
            ${{ runner.temp }}/production-db-test-coverage-evidence.json
            ${{ runner.temp }}/production-db-test-cleanup-evidence.json
            ${{ runner.temp }}/production-db-test-post-schema-snapshot.json
            ${{ runner.temp }}/production-db-test-post-schema-evidence.json
            ${{ runner.temp }}/production-db-test-verified.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload trusted-main shared TEST raw evidence
        if: ${{ needs.classify-changes.outputs.run_test_validation == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dispatch_reason == 'main_manual' }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-run-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-test-run-evidence.json
          if-no-files-found: error
          retention-days: 14
