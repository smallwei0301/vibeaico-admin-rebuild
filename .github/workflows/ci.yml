name: ci
# ⚠️ 2026-08-25：原本只有 `push: [main]`，而所有開發都在
# `claude/deploy-vercel-project-nnno59` 上、且沒有開 PR——結果該分支連續 66 個
# commit **完全沒有跑過 CI**（最後一次是 08-24 的 run #26，來自一個 pull_request
# 事件）。這期間新增了 sharp 與 qrcode 兩個相依，issue #16 的驗收項「CI 的
# install 步驟通過」因此無從佐證。
#
# 本機 `npm run build` 通過 ≠ CI 的 `npm ci` 通過：前者用既有的 node_modules，
# 後者從 lockfile 全新安裝。兩者會分岔的典型情況正是原生相依（sharp）與
# lockfile 沒同步。把開發分支加進 push 觸發，讓這件事有人看著。
#
# `integration` job 仍只在 pull_request 或 main 上跑（見該 job 的 if），
# 所以開發分支的每次 push 只跑不需秘密的 check job。
on:
  push: { branches: [main, claude/deploy-vercel-project-nnno59] }
  pull_request: {}
  workflow_dispatch: {}
jobs:
  check:                       # 無秘密即可跑：擋最常見的壞 commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build      # env 全空 + mock 模式（鐵則 10 的 CI 版）
        env: { NEXT_PUBLIC_USE_MOCK: 'true' }
  integration:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.TEST_SETTINGS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          # cron Bearer 驗證（07 分冊）：測試環境的固定值即可，非機密——它只
          # 保護 CI 內自起的 next dev，不觸及正式部署的 CRON_SECRET。
          TEST_CRON_SECRET: ci-cron-secret-0711
          # Phase 6 整合測試打本地假 LINE（tests/helpers/line-mock.ts 綁 4123），
          # 非機密；src/server/line.ts 的 lineApiBase() 延遲讀取。
          LINE_API_BASE: http://localhost:4123
          LINE_DATA_API_BASE: http://localhost:4123
          # issue #27 ③ 整合測試打本地假 Resend（tests/helpers/resend-mock.ts 綁 4124）。
          # 兩者都非機密：RESEND_API_KEY 是假值，只為繞過 send.ts「未設定就不寄信」
          # 的短路；RESEND_BASE_URL 讓 resend 套件改打 localhost，永遠不會真的寄信。
          RESEND_API_KEY: re_itest_fake_key_0000000000
          RESEND_BASE_URL: http://localhost:4124
      # e2e 與 integration 共用同一組 TEST secrets（12 分冊 §7）。
      # 註：原文此處寫 `env: { }`，但 GitHub Actions 的 env 不會跨 step 繼承，
      #     留空會讓 e2e 完全拿不到 TEST_SUPABASE_*，Phase 2 起必然失敗，故展開列出。
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.TEST_SETTINGS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
