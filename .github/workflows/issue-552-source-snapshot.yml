name: Issue 552 source snapshot
on:
  push:
    branches: [governance/issue-552-review-cost-core]
    paths: [.github/workflows/issue-552-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17054c43087c5e067cfc0a870cacaa8eb6205f3e
          persist-credentials: false
      - name: Archive tracked trusted-main source only
        run: git archive --format=tar.gz --output=source-17054c4.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-552-trusted-source
          path: source-17054c4.tar.gz
          retention-days: 1
          if-no-files-found: error
