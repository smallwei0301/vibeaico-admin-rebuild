name: Issue 552 bounded patch application
on:
  push:
    branches: [governance/issue-552-review-cost-core]
    paths: [.github/workflows/issue-552-source-snapshot.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'smallwei0301/vibeaico-admin-rebuild' && github.ref == 'refs/heads/governance/issue-552-review-cost-core'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact locally reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 17054c43087c5e067cfc0a870cacaa8eb6205f3e HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          root = pathlib.Path('scripts/agents/issue-552-transfer')
          encoded = ''.join((root / f'part-{i}.txt').read_text().strip() for i in range(5))
          # Correct the identified two-character transcription duplication, then require the original checksum.
          encoded = encoded.replace('EqHG6J6Jzj1nfr', 'EqHG6Jzj1nfr')
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ec6873b299ed725a2ce65bedb2e7ac2f536a388a3065d237ddb8d66149669d63', 'Patch transport checksum mismatch'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue-552.patch'
          patch.write_bytes(gzip.decompress(compressed))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          expected = '''.agents/skills/vibeaico-agent-orchestration/SKILL.md
          .agents/skills/vibeaico-astra-review/SKILL.md
          .github/pull_request_template.md
          AGENTS.md
          CLAUDE.md
          docs/AGENT-EXECUTION.md
          docs/AGENT-PLAYBOOK.md
          docs/MODEL-ROUTING.md
          docs/OWNER-DECISIONS.md
          docs/PR-LIFECYCLE.md
          docs/PRODUCTION-DB-RELEASE-WORKFLOW.md
          docs/decisions/2026-09-08-owner-final-risk-allowlist.md
          docs/decisions/2026-09-08-owner-final-risk-model-fable-and-0088.md
          docs/decisions/2026-09-10-owner-final-risk-roi-routing.md
          docs/decisions/2026-09-16-owner-final-risk-cost-control.md
          docs/decisions/2026-09-17-owner-final-risk-cost-downgrade.md
          scripts/agents/astra-review-policy.mjs
          scripts/agents/final-risk-cost-policy.mjs
          scripts/agents/final-risk-workflow.mjs
          scripts/agents/model-routing.json
          scripts/agents/production-db-release-preflight.mjs
          tests/unit/agent-wip-guard-live-state.test.ts
          tests/unit/final-risk-cost-policy.552.test.ts
          tests/unit/final-risk-workflow-trust.533.test.ts
          tests/unit/final-risk-workflow.533.test.ts'''.splitlines()
          expected = [p.strip() for p in expected]
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          assert set(changed + untracked) == set(expected), 'Unexpected source paths'
          subprocess.run(['git', 'add', '--', *expected], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print(subprocess.check_output(['git', 'diff', '--cached', '--stat'], text=True))
          PY
      - name: Repeat focused policy tests without fetching packages
        shell: bash
        run: |
          set -euo pipefail
          for source in scripts/agents/{astra-review-policy,final-risk-cost-policy,final-risk-workflow,production-db-release-preflight}.mjs; do node --check "$source"; done
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tests/unit/final-risk-cost-policy.552.test.ts').read_text()
          assert source.count("from 'vitest'") == 1
          Path('tests/unit/.issue-552-local.mjs').write_text(source.replace("from 'vitest'", "from 'node:test'"))
          PY
          trap 'rm -f tests/unit/.issue-552-local.mjs' EXIT
          node --test tests/unit/.issue-552-local.mjs
      - name: Commit only policy source to this non-protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --cached --name-only | wc -l)" -eq 25
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#552): bound premium review cost and admit evidence-backed downgrade'
          git push origin HEAD:refs/heads/governance/issue-552-review-cost-core
          git rev-parse HEAD
      - name: Preserve transport for diagnosis if validation failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-552-transport-diagnostic
          path: scripts/agents/issue-552-transfer/part-*.txt
          retention-days: 1
          if-no-files-found: error
