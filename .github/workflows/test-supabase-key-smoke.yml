name: issue-447-shared-test-validation
on:
  push:
    branches: [test/issue-447-exact-head-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: shared-test-validation
    concurrency:
      group: shared-test-supabase-integration
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Verify canonical TEST identity and admin key
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          const { TEST_SUPABASE_URL: url, TEST_SUPABASE_SERVICE_ROLE_KEY: secret, TEST_SUPABASE_ANON_KEY: anon } = process.env;
          if (!url || !secret || !anon) throw new Error('TEST_API_KEYS_NOT_CONFIGURED');
          if (new URL(url).hostname !== 'nmwhwngojosmagjuvxol.supabase.co') throw new Error('WRONG_TEST_PROJECT_URL');
          const admin = createClient(url, secret, { auth: { autoRefreshToken: false, persistSession: false } });
          const { error } = await admin.auth.admin.listUsers({ page: 1, perPage: 1 });
          if (error) throw new Error(`TEST_SERVICE_KEY_REJECTED:${error.message}`);
          console.log('CANONICAL_TEST_IDENTITY_VERIFIED');
          NODE
      - name: Run integration tests
        run: timeout 900s npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.TEST_SETTINGS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          TEST_CRON_SECRET: ci-cron-secret-0711
          LINE_API_BASE: http://localhost:4123
          LINE_DATA_API_BASE: http://localhost:4123
          RESEND_BASE_URL: http://localhost:4124
          RESEND_API_KEY: re_test_ci_local_mock
      - name: Clean integration test servers
        if: ${{ always() }}
        shell: bash
        run: |
          pkill -f 'next dev' || true
          pkill -f 'next-server' || true
          pkill -f 'mock-line' || true
          pkill -f 'mock-resend' || true
          sleep 2
      - name: Run E2E tests
        run: timeout 900s bash -lc 'npx playwright install --with-deps chromium && npm run test:e2e'
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.TEST_SETTINGS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          TEST_CRON_SECRET: ci-cron-secret-0711
          LINE_API_BASE: http://localhost:4123
          LINE_DATA_API_BASE: http://localhost:4123
          RESEND_BASE_URL: http://localhost:4124
          RESEND_API_KEY: re_test_ci_local_mock
      - name: Clean E2E test servers
        if: ${{ always() }}
        shell: bash
        run: |
          pkill -f 'next dev' || true
          pkill -f 'next-server' || true
          pkill -f 'mock-line' || true
          pkill -f 'mock-resend' || true
          sleep 2
