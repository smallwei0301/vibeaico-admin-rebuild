name: issue-provenance

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-provenance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
      startsWith(github.event.label.name, 'workstream:') ||
      startsWith(github.event.label.name, 'origin:') ||
      github.event.label.name == 'governance:workstream-incomplete' ||
      github.event.label.name == 'governance:provenance-incomplete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted Issue provenance policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/agents/issue-provenance-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Classify Issue origin and workstream
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/agents/issue-provenance-policy.mjs',
            )).href);

            const { owner, repo } = context.repo;
            // Event bodies can be stale; only the current server snapshot is authoritative.
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: context.payload.issue.number,
            });
            if (issue.pull_request || issue.state !== 'open') return;
            const result = policy.validateIssueProvenance(issue.body ?? '', { requireWorkstream: true });
            const isAgent = result.isAgent;
            const validWorkstreams = new Set(['MODEL_GOVERNANCE', 'PRODUCT_MAINLINE']);
            const workstreamValid = validWorkstreams.has(result.workstream);
            // Missing / invalid classification must never accidentally enter the faster governance path.
            // It is visibly marked incomplete and fails safe to PRODUCT_MAINLINE until the body is corrected.
            const effectiveWorkstream = workstreamValid ? result.workstream : 'PRODUCT_MAINLINE';

            const managedLabels = {
              'origin:agent': {
                color: '1D76DB',
                description: 'Issue explicitly marked as agent-discovered.',
              },
              'origin:owner-or-unknown': {
                color: 'BFDADC',
                description: 'Issue has no agent provenance marker; owner-created or unknown.',
              },
              'workstream:model-governance': {
                color: '6F42C1',
                description: 'Pure model/Agent/work/engineering governance; executor model is not an admission gate.',
              },
              'workstream:product-mainline': {
                color: '0366D6',
                description: 'Product UI/API/runtime/schema/payment/LINE/provider/deployment mainline work.',
              },
              'governance:workstream-incomplete': {
                color: 'D93F0B',
                description: 'Issue is missing or has an invalid WORKSTREAM classification; fails safe to Product mainline.',
              },
              'governance:provenance-incomplete': {
                color: 'D93F0B',
                description: 'Agent-discovered Issue is missing required provenance fields.',
              },
            };

            for (const [name, metadata] of Object.entries(managedLabels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: metadata.color,
                  description: metadata.description,
                });
              }
            }

            const managedNames = new Set(Object.keys(managedLabels));
            const existing = (issue.labels ?? [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .filter((name) => !managedNames.has(name));

            const nextLabels = [
              ...existing,
              isAgent ? 'origin:agent' : 'origin:owner-or-unknown',
              effectiveWorkstream === 'MODEL_GOVERNANCE'
                ? 'workstream:model-governance'
                : 'workstream:product-mainline',
            ];
            if (!workstreamValid) nextLabels.push('governance:workstream-incomplete');
            if (isAgent && result.errors.some((error) => !error.startsWith('Issue WORKSTREAM'))) {
              nextLabels.push('governance:provenance-incomplete');
            }

            const { data: fresh } = await github.rest.issues.get({ owner, repo, issue_number: issue.number });
            if (fresh.body !== issue.body || fresh.state !== issue.state) {
              core.setFailed('Issue changed during classification; use the newest event');
              return;
            }
            // Touch only our labels, never erase a concurrent Product/TEST/lifecycle label.
            const before = (fresh.labels ?? []).map(label => typeof label === 'string' ? label : label.name);
            for (const name of before.filter(name => managedNames.has(name) && !nextLabels.includes(name))) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            const additions = [...new Set(nextLabels)].filter(name => managedNames.has(name) && !before.includes(name));
            if (additions.length) await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: additions,
            });

            await core.summary
              .addHeading('Issue provenance and workstream')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Result', header: true }],
                ['Issue', `#${issue.number}`],
                ['Origin', result.origin],
                ['Declared workstream', result.workstream],
                ['Effective workstream', effectiveWorkstream],
                ['Fail-safe fallback', workstreamValid ? 'none' : 'PRODUCT_MAINLINE until corrected'],
                ['Missing headings', result.missingHeadings.length ? result.missingHeadings.join(', ') : 'none'],
                ['Empty or placeholder headings', result.emptyHeadings.length ? result.emptyHeadings.join(', ') : 'none'],
                ['Validation errors', result.errors.length ? result.errors.join('; ') : 'none'],
              ])
              .write();
            if (!workstreamValid) core.setFailed('Issue WORKSTREAM is missing, invalid or duplicated; correct the body');
