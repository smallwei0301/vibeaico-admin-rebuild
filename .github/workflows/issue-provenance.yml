name: issue-provenance

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify Issue origin and validate agent provenance
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const body = issue.body ?? '';
            const { classifyIssueProvenance } = require('./scripts/ci/issue-provenance.cjs');
            const { isAgent, missing } = classifyIssueProvenance(body);

            const managedLabels = {
              'origin:agent': {
                color: '1D76DB',
                description: 'Issue explicitly marked as agent-discovered.',
              },
              'origin:owner-or-unknown': {
                color: 'BFDADC',
                description: 'Issue has no agent provenance marker; owner-created or unknown.',
              },
              'governance:provenance-incomplete': {
                color: 'D93F0B',
                description: 'Agent-discovered Issue is missing required provenance fields.',
              },
            };

            for (const [name, metadata] of Object.entries(managedLabels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: metadata.color,
                  description: metadata.description,
                });
              }
            }

            const managedNames = new Set(Object.keys(managedLabels));
            const existing = (issue.labels ?? [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .filter((name) => !managedNames.has(name));

            const nextLabels = [
              ...existing,
              isAgent ? 'origin:agent' : 'origin:owner-or-unknown',
            ];
            if (missing.length > 0) {
              nextLabels.push('governance:provenance-incomplete');
            }

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: [...new Set(nextLabels)],
            });

            await core.summary
              .addHeading('Issue provenance')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Result', header: true }],
                ['Issue', `#${issue.number}`],
                ['Origin', isAgent ? 'agent' : 'owner-or-unknown'],
                ['Missing agent fields', missing.length ? missing.join(', ') : 'none'],
              ])
              .write();
