name: remote-preview-branch-plan

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR whose DB/Auth/Storage changes need a remote preview branch
        required: true
        type: string
      expected_head:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      slot:
        description: Requested remote branch slot
        required: true
        type: choice
        options:
          - '1'
          - '2'
      lease_minutes:
        description: Planned branch lease; partial hours are billed as full hours
        required: true
        default: '60'
        type: choice
        options:
          - '30'
          - '60'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: remote-preview-branch-plan-${{ github.event.inputs.slot }}
  cancel-in-progress: false

jobs:
  plan-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-read the live PR and changed paths
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.inputs.pull_request_number }}
          EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('pull_request_number must be a positive integer');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const expectedHead = String(process.env.EXPECTED_HEAD ?? '').trim().toLowerCase();
            const sameRepository = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open`);
              return;
            }
            if (!sameRepository) {
              core.setFailed('remote preview branch planning is limited to same-repository PRs');
              return;
            }
            if (pr.head.sha !== expectedHead) {
              core.setFailed(`expected_head ${expectedHead} does not equal live PR head ${pr.head.sha}`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            fs.writeFileSync(
              'remote-preview-branch-input.json',
              JSON.stringify({
                prNumber,
                exactHead: pr.head.sha,
                prBody: pr.body ?? '',
                changedPaths: files.map((file) => file.filename),
                gitBranch: pr.head.ref,
              }, null, 2),
              'utf8',
            );

      - id: policy
        name: Build a fail-closed, no-cost lease plan
        env:
          SLOT: ${{ github.event.inputs.slot }}
          LEASE_MINUTES: ${{ github.event.inputs.lease_minutes }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import {
            REMOTE_BRANCH_POLICY,
            buildRemoteBranchLeasePlan,
          } from './scripts/ci/remote-preview-branch-policy.mjs';

          const input = JSON.parse(readFileSync('remote-preview-branch-input.json', 'utf8'));
          const plan = buildRemoteBranchLeasePlan({
            ...input,
            slot: Number(process.env.SLOT),
            leaseMinutes: Number(process.env.LEASE_MINUTES),
            existingBranches: [],
            executePaidBranch: false,
          });
          plan.gitBranch = input.gitBranch;
          plan.costConfirmationRequired = REMOTE_BRANCH_POLICY.confirmationText;
          plan.provisioningStatus = 'PAID_BRANCH_NOT_CREATED';
          plan.note = 'This workflow only creates an auditable plan. Paid creation requires live branch inventory, exact Owner cost confirmation, Supabase confirmation ID, and a separate executor/canary.';

          writeFileSync('remote-preview-branch-plan.json', JSON.stringify(plan, null, 2) + '\n', 'utf8');
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `profile=${plan.testProfile}`,
            `branch_name=${plan.branchName}`,
            `estimated_cost_usd=${plan.estimatedCostUsd}`,
          ].join('\n') + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Remote Preview Branch plan only',
            '',
            `- PR: #${plan.prNumber}`,
            `- exact head: ${plan.exactHead}`,
            `- profile: ${plan.testProfile}`,
            `- reasons: ${plan.reasons.join(', ')}`,
            `- slot: ${plan.slot}`,
            `- planned branch name: ${plan.branchName}`,
            `- with production data: ${plan.withData}`,
            `- persistent: ${plan.persistent}`,
            `- lease: ${plan.leaseMinutes} minutes`,
            `- hourly cost quote: US$${plan.hourlyCostUsd}`,
            `- estimated billed cost: US$${plan.estimatedCostUsd}`,
            `- required confirmation: ${REMOTE_BRANCH_POLICY.confirmationText}`,
            '- result: PAID_BRANCH_NOT_CREATED',
            '- forbidden: merge branch, push to parent, clone production data',
            '',
          ].join('\n'), 'utf8');
          NODE

      - name: Upload the auditable lease plan
        uses: actions/upload-artifact@v4
        with:
          name: remote-preview-branch-plan-pr-${{ github.event.inputs.pull_request_number }}-${{ github.event.inputs.expected_head }}
          path: remote-preview-branch-plan.json
          if-no-files-found: error
          retention-days: 14
