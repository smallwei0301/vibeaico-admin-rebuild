name: patch-shared-test-environment-once
on:
  push:
    branches: [product/issue-447-release-workflow-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/issue-447-release-workflow-v1
          fetch-depth: 0
      - name: Bind integration job to validated shared TEST environment and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          head, sep, tail=s.partition('  integration:\n')
          if not sep: raise SystemExit('integration job not found')
          marker='    runs-on: ubuntu-latest\n'
          if '    environment: shared-test-validation\n' not in tail:
              if marker not in tail: raise SystemExit('integration runs-on anchor not found')
              tail=tail.replace(marker, marker+'    environment: shared-test-validation\n', 1)
          p.write_text(head+sep+tail)
          PY
          rm .github/workflows/patch-shared-test-environment-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/patch-shared-test-environment-once.yml
          git commit -m 'fix(#447): bind shared TEST integration to environment secrets'
          git push origin HEAD:product/issue-447-release-workflow-v1
