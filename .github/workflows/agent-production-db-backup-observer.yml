name: agent-production-db-backup-observer

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA the evidence must bind to
        required: true
        type: string
  workflow_call:
    inputs:
      expected_main_sha:
        required: true
        type: string
    secrets:
      SUPABASE_BACKUP_OBSERVER_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: production-db-backup-observer
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_main_sha }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.expected_main_sha }}"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture risk-adaptive read-only Production backup evidence
        env:
          SUPABASE_BACKUP_OBSERVER_TOKEN: ${{ secrets.SUPABASE_BACKUP_OBSERVER_TOKEN }}
          SUPABASE_BACKUP_OBSERVER_CREDENTIAL_KIND: OAUTH2_DATABASE_READ
          PRODUCTION_PROJECT_REF: egehnijjpgijmccagxac
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Classic/scoped PAT fallback is intentionally not wired. If no OAuth2
          # database:read credential is configured, emit an honest exact-main marker.
          # AUTHZ/ADDITIVE/SCHEMA_REPAIR may consume that marker together with the
          # trusted local restore rehearsal; BACKFILL will fail closed later.
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          node scripts/agents/production-db-backup-evidence.mjs > "$RUNNER_TEMP/production-db-backup-evidence.json"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!["BACKUP_EVIDENCE_CAPTURED", "BACKUP_METADATA_NOT_CAPTURED"].includes(p.status)) {
              throw new Error("backup observer evidence has unsupported status");
            }
            if (p.projectRef !== "egehnijjpgijmccagxac") throw new Error("wrong Production project");
            if (p.mainSha !== process.env.EXPECTED_MAIN_SHA) throw new Error("backup evidence is not bound to exact main");
            if (p.databaseMutationPerformed !== false) throw new Error("observer must remain read-only");
            if (p.storageObjectsCovered !== false) throw new Error("DB backup must not overclaim Storage object coverage");
          ' "$RUNNER_TEMP/production-db-backup-evidence.json"

      - name: Upload sanitized backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-db-backup-evidence-${{ inputs.expected_main_sha }}
          path: ${{ runner.temp }}/production-db-backup-evidence.json
          if-no-files-found: error
          retention-days: 7
