name: Prepare bounded issue 569 source
on:
  push:
    branches: [governance/issue-569-scorecard-window]
    paths: [.github/workflows/governance-569-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'smallwei0301/vibeaico-admin-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/issue-569-scorecard-window
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded patch and correct the verified CLI test contract
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'governance/issue-569-scorecard-window'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check .governance-569.patch
          git apply .governance-569.patch
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const source=fs.readFileSync('scripts/agents/scorecard-readiness.mjs','utf8');
          if(!source.includes("if (argv.includes('--strict-live') && !result.readyForContinuedCapture) process.exitCode = 2;")) throw new Error('Existing CLI rejection contract changed');
          const testPath='tests/unit/scorecard-readiness-window.569.test.ts';
          const test=fs.readFileSync(testPath,'utf8');
          const needle='expect(rejected.status).toBe(1);';
          if(test.split(needle).length!==2)throw new Error('Expected one incorrect CLI assertion');
          fs.writeFileSync(testPath,test.replace(needle,"expect(rejected.error).toBeUndefined();\n      expect(rejected.stderr).toBe('');\n      expect(rejected.status).toBe(2);"));
          const playbook='docs/AGENT-PLAYBOOK.md';
          const text=fs.readFileSync(playbook,'utf8');
          const anchor='  拿掉邊界判定必須重現假綠；恢復後拒絕。通過時間檢查仍不等於已驗證證據來源。';
          if(text.split(anchor).length!==2)throw new Error('Playbook anchor not unique');
          fs.writeFileSync(playbook,text.replace(anchor,anchor+'\n- 首次準備 run35184377429 的 CLI 測試誤把拒絕碼寫成1；既有 strict-live 契約是2，執行例外才是1。\n  修正測試並同時驗證無執行例外、NEEDS_CAPTURE 與合法輸入回0；不修改正式 CLI 或放寬失敗判準。'));
          JS
          git diff --check
          mkdir -p "$RUNNER_TEMP/issue569-evidence"
          git diff -- scripts/agents/scorecard-readiness.mjs docs/AGENT-EXECUTION.md docs/AGENT-PLAYBOOK.md > "$RUNNER_TEMP/issue569-evidence/reviewed-source.diff"
      - name: Install locked dependencies
        run: npm ci
      - name: Real focused positive and counterexample tests
        run: |
          set -euo pipefail
          npx vitest run tests/unit/scorecard-readiness-window.569.test.ts tests/unit/scorecard-readiness.462.test.ts 2>&1 | tee "$RUNNER_TEMP/issue569-evidence/focused-tests.log"
          cp scripts/agents/scorecard-readiness.mjs "$RUNNER_TEMP/issue569-readiness-original.mjs"
          trap 'cp "$RUNNER_TEMP/issue569-readiness-original.mjs" scripts/agents/scorecard-readiness.mjs' EXIT
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path='scripts/agents/scorecard-readiness.mjs';
          const source=fs.readFileSync(path,'utf8');
          const needle="if (scoreProfileTarget === 'OBSERVED_V1') {";
          if(source.split(needle).length!==2)throw new Error('Mutation target not unique');
          fs.writeFileSync(path,source.replace(needle,'if (false) {'));
          JS
          set +e
          npx vitest run tests/unit/scorecard-readiness-window.569.test.ts > "$RUNNER_TEMP/issue569-evidence/mutation-tests.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          cat "$RUNNER_TEMP/issue569-evidence/mutation-tests.log"
          echo "REMOVED_TIME_BOUNDARY_DETECTED exit=$result" | tee "$RUNNER_TEMP/issue569-evidence/mutation-verdict.txt"
          cp "$RUNNER_TEMP/issue569-readiness-original.mjs" scripts/agents/scorecard-readiness.mjs
          trap - EXIT
          npx vitest run tests/unit/scorecard-readiness-window.569.test.ts 2>&1 | tee "$RUNNER_TEMP/issue569-evidence/restored-tests.log"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/issue569-evidence/typecheck.log"
      - name: Validate the intended governance PR body with the existing shared preflight
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {validateWipPreflight} from './scripts/agents/agent-wip-preflight.mjs';
          const body=`<!-- pr-lifecycle
          issue: 569
          state: ACTIVE
          supersedes:
          -->
          WORKSTREAM: MODEL_GOVERNANCE
          WORK_ORIGIN: AGENT
          AGENT_LANE: GOVERNANCE
          LANE_STATE: ACTIVE
          BPLUS_MODE: false
          RUN_ID: none
          SCORECARD_PATH: none
          ACTIVE_CANDIDATE: false
          CLOSEABILITY_SCORE: 5
          SELECTION_REASON: GOVERNANCE
          REMAINING_AUTONOMOUS_STEPS: exact-head source CI, current-executor counterexample review, protected merge and main reread
          OWNER_OR_EXTERNAL_BLOCKER: none
          CLOSURE_SWEEP_TARGET: #569
          TEST_LANE_REQUIRED: false
          TEST_PROFILE: SOURCE_ONLY
          FINAL_CANONICAL_REQUIRED: false
          GOVERNANCE_SCOPE_EXCEPTION: none
          REQUESTED_MODEL / ACTUAL_MODEL: requested=not_requested; actual=unknown
          ASTRA_RISK: NONE
          ASTRA_RATIONALE: Pure governance Run time consistency; no Product runtime, schema, database, deployment or model policy changes
          FINAL_RISK_POLICY: NOT_REQUIRED_BY_OWNER_POLICY
          ASTRA_TEST_BASELINE: none
          ASTRA_SCHEMA_BASELINE: none
          DELIVERY_UNIT_TYPE: GOVERNANCE
          PARENT_EPIC: none
          COUNT_IN_DELIVERY_OUTCOME: false
          RETROACTIVE_TRACKING_MIGRATION: false
          USER_VISIBLE_OUTCOME: none
          COMPLETION_CLAIM: IN_PROGRESS
          MERGE_STATUS: NOT_REQUESTED
          
          ## Scope
          Refs #569, #528. OBSERVED_V1 WIP events must be inside the Run startedAt/endedAt bounds, inclusive. Existing readiness and all its consumers share this check. Legacy replay and historical raw ledgers remain unchanged. Passing time consistency is not proof of event provenance.
          
          ## Verification
          The preparation workflow executes 12 focused window tests plus 17 existing readiness tests, deliberately disables the new boundary to prove detection, restores it and reruns, then typechecks. Exact-head PR source CI and final governance review remain required. Initial run35184377429 correctly exposed a test-harness mistake: strict-live rejects with exit2, not exit1. The regression now verifies both the specific rejection and a successful input; the production CLI was not altered.
          
          ## Safety and closeout
          Four governance source/test/documentation files only. No Product Run bytes, counters, dispatch timestamps or model identities are rewritten. No TEST/Production mutation, remote DB tests, deployment, customer notifications or branch-protection bypass. The temporary transport is removed before this PR. AGENT-EXECUTION stays the only daily entry; the lesson is added to the existing Playbook.
          `;
          const changedFiles=['docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md','scripts/agents/scorecard-readiness.mjs','tests/unit/scorecard-readiness-window.569.test.ts'];
          const result=validateWipPreflight({body,changedFiles,requireAstraClassification:true,repositoryRoot:process.cwd()});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'issue569-evidence','pr-body.md'),body);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'issue569-evidence','preflight.json'),JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(!result.valid)throw new Error('Governance PR preflight rejected');
          JS
      - name: Commit only four source files, retire this transport, never touch main
        run: |
          set -euo pipefail
          git rm .governance-569.patch .github/workflows/governance-569-prepare.yml
          git add scripts/agents/scorecard-readiness.mjs tests/unit/scorecard-readiness-window.569.test.ts docs/AGENT-EXECUTION.md docs/AGENT-PLAYBOOK.md
          git diff --cached --check
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const expected=['docs/AGENT-EXECUTION.md','docs/AGENT-PLAYBOOK.md','scripts/agents/scorecard-readiness.mjs','tests/unit/scorecard-readiness-window.569.test.ts'].sort();
          const actual=execFileSync('git',['diff','--name-only','4db7496a9b0b2e08f432a720e0342f29b6f47f98'],{encoding:'utf8'}).trim().split('\n').sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error('Unexpected source scope');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(governance): reject WIP events outside their Run window (#569)'
          git push origin HEAD:refs/heads/governance/issue-569-scorecard-window
          git rev-parse HEAD > "$RUNNER_TEMP/issue569-evidence/exact-head.txt"
          git diff --stat 4db7496a9b0b2e08f432a720e0342f29b6f47f98 > "$RUNNER_TEMP/issue569-evidence/scope.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue569-source-validation
          path: ${{ runner.temp }}/issue569-evidence/
          if-no-files-found: error
          retention-days: 14
