name: governance-558-workspace
on:
  push:
    branches: [governance/issue-558-closed-watch]
    paths: [.github/workflows/governance-558-workspace.yml]
permissions:
  contents: write
concurrency:
  group: governance-558-workspace
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_USE_MOCK: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare and test only bounded governance source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import subprocess
          base = 'e17512320dcbca7baa16275e2f410d5c7aff4589'
          helper = '.github/workflows/governance-558-workspace.yml'
          assert subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() == [helper], 'workspace moved before patch'
          def replace(name, old, new):
              p = Path(name); text = p.read_text()
              assert text.count(old) == 1, f'anchor mismatch: {name}: {old[:70]}'
              p.write_text(text.replace(old, new))
          name = 'scripts/agents/workstream-classification-watch.mjs'
          replace(name, "import { validateIssueProvenance } from './issue-provenance-policy.mjs';", "import { validateIssueProvenance } from './issue-provenance-policy.mjs';\nimport { readField } from './agent-wip-policy.mjs';")
          replace(name, '/** @param {any} item */\nconst snapshot', '''/** Closed history remains observable; labels do not grant any execution permission. */
          const ACTIVE_LABELS = new Set(['state:active', 'candidate:active', 'state:reserve-ready', 'state:ready-for-promotion']);
          /** @param {any} item */
          const lifecycleLabels = item => (item.labels ?? [])
            .map(label => typeof label === 'string' ? label : label.name)
            .filter(name => /^(state|candidate):/.test(String(name))).sort();
          /** @param {any} item */
          function lifecycleErrors(item) {
            if (item.state !== 'closed') return [];
            const errors = lifecycleLabels(item).filter(name => ACTIVE_LABELS.has(name))
              .map(name => `CLOSED_ITEM_ACTIVE_LABEL:${name}`);
            for (const [field, active] of Object.entries({ LANE_STATE: ['ACTIVE', 'READY_FOR_PROMOTION'], ACTIVE_CANDIDATE: ['TRUE'] })) {
              const value = readField(item.body ?? '', field).toUpperCase();
              if (value.includes('|')) errors.push(`CLOSED_ITEM_AMBIGUOUS_FIELD:${field}`);
              else if (active.includes(value)) errors.push(`CLOSED_ITEM_ACTIVE_FIELD:${field}`);
            }
            return errors;
          }
          /** @param {any} item */
          const snapshot''')
          replace(name, 'workstreamLabels(item),\n]);', 'workstreamLabels(item), lifecycleLabels(item),\n]);')
          replace(name, 'const errors = [...result.errors];', 'const errors = [...result.errors, ...lifecycleErrors(item)];')
          replace(name, "status: legacy ? 'LEGACY_GRANDFATHERED' : errors.length ? 'FAIL' : 'PASS',", "status: errors.length ? 'FAIL' : legacy ? 'LEGACY_GRANDFATHERED' : 'PASS',")
          replace(name, '/** @type {{status: string, observedAt: string, policySha: string, recentClosedHours: number,', '/** @type {{status: string, observedAt: string, policySha: string, recentClosedHours: number, inventoryVersion: number, issueScope: string,')
          replace(name, "status: 'EVIDENCE_UNAVAILABLE', observedAt: now.toISOString(), policySha, recentClosedHours: 72,", "status: 'EVIDENCE_UNAVAILABLE', observedAt: now.toISOString(), policySha, recentClosedHours: 72,\n    inventoryVersion: 2, issueScope: 'OPEN_AND_UPDATED_CLOSED_72H',")
          replace(name, '// Issues endpoint includes open PRs. Closed PRs are independently paginated, not search-index snapshots.', '// Both Issues inventories include PRs; exclude them and independently paginate closed PRs once.')
          replace(name, "const issueRows = open?.filter(row => !row.pull_request) ?? [];", "const closedIssues = await inventory('issues', { state: 'closed', sort: 'updated', direction: 'desc', since: new Date(cutoff).toISOString() }, true);\n  const issueRows = [...(open ?? []), ...(closedIssues ?? [])].filter(row => !row.pull_request);")
          replace(name, 'report.counts.issues = open === null ? null : issueRows.length;', 'report.counts.issues = open === null || closedIssues === null ? null : issueRows.length;')
          name = 'tests/unit/workstream-classification-prevention.520.test.ts'
          replace(name, 'const request = vi.fn(async (route: string) => {', 'const request = vi.fn(async (route: string, params: { state?: string } = {}) => {')
          replace(name, "if (resource === 'issues') {\n      if (options.unavailable)", "if (resource === 'issues') {\n      if (params.state === 'closed') return { data: [] };\n      if (options.unavailable)")
          name = 'docs/AGENT-EXECUTION.md'
          replace(name, '  唯讀盤點全部 open Issue／PR 與最近 72 小時更新的 closed PR，重用現行分類器，', '  唯讀盤點全部 open Issue／PR 與最近 72 小時更新的 closed Issue／PR，重用現行分類器，')
          replace(name, '- 路徑與欄位檢查不能證明每個語意都正確；最終 exact-diff／反例審查及原有安全關卡仍必要。', '''- #558：已結案 Issue 不因關閉就退出近期巡查；closed 項目殘留 active/candidate/待升級標籤或
            正式 LANE_STATE=ACTIVE、ACTIVE_CANDIDATE=true 也列為 finding。範例／引用不是正式宣告。
            讀取前後生命周期標籤不同時保留 unavailable，不能把變動中的狀態當穩定證據。
            報告以 inventoryVersion=2 標明擴大範圍；不能直接拿舊總數減新總數當修復率。
          - 路徑與欄位檢查不能證明每個語意都正確；最終 exact-diff／反例審查及原有安全關卡仍必要。''')
          name = 'docs/AGENT-PLAYBOOK.md'
          replace(name, '### PB-035 — 從欄位定義推斷', '''#### 2026-09-17 結案項目退出巡查的盲點（#558）

          - #530 曾 closed 卻保留 active；舊巡查只讀 open Issues 和近期 closed PR，關閉 Issue 後反而失去觀測。
          - 在既有唯讀巡查加入近期更新的 closed Issues，排除其中的 PR；用原欄位 parser 忽略範例、查殘留施工宣告。
          - snapshot 同時核對生命周期標籤；讀取失敗、缺頁與讀取中標籤變化仍 unavailable，不自動清除任何工作位置。
          - 正反例直接執行 collector，包括 closed+active、正常 closed、open active、PR 去重、72h、失敗分頁與標籤競態；
            移除 closed-Issue inventory 或 snapshot lifecycle labels 必須使對應測試失敗。
          - 本輪擴大觀測母體，新舊 findings 總數不可直接當改善率；修補巡查不等於已清空既有分類存量。

          ### PB-035 — 從欄位定義推斷''')
          Path(helper).unlink()
          PY_SOURCE
          cat > tests/unit/closed-issue-watch.558.test.ts <<'TS_TEST'
          import { describe, expect, it, vi } from 'vitest';
          import { inspectClassification, observeClassifications } from '../../scripts/agents/workstream-classification-watch.mjs';

          const now = new Date('2026-09-17T02:00:00Z');
          const policySha = 'a'.repeat(40);
          const label = 'workstream:model-governance';
          const issue = (extra: Record<string, unknown> = {}): any => ({
            number: 558, state: 'closed', body: 'WORKSTREAM: MODEL_GOVERNANCE', labels: [label],
            created_at: '2026-09-15T00:00:00Z', updated_at: now.toISOString(), ...extra,
          });
          const pr = (extra: Record<string, unknown> = {}): any => issue({
            number: 559, head: { sha: 'b'.repeat(40) }, base: { sha: policySha }, changed_files: 1,
            body: 'WORKSTREAM: MODEL_GOVERNANCE\nAGENT_LANE: GOVERNANCE\nASTRA_RISK: NONE\nFINAL_RISK_POLICY: NOT_REQUIRED_BY_OWNER_POLICY',
            ...extra,
          });
          const files = [{ filename: 'docs/metrics/example.md', status: 'modified' }];
          function provider(options: { race?: boolean; unavailable?: boolean; truncated?: boolean; badDate?: boolean; old?: boolean; duplicate?: boolean } = {}) {
            let reads = 0;
            const request = vi.fn(async (route: string, params: any = {}) => {
              expect(route.startsWith('GET ')).toBe(true);
              const resource = route.split('/{repo}/')[1];
              if (resource === 'issues') {
                if (params.state === 'open') return { data: options.duplicate ? [issue({ state: 'open' })] : [] };
                expect(params.state).toBe('closed');
                expect(params.since).toBe('2026-09-14T02:00:00.000Z');
                if (options.unavailable) throw new Error('PRIVATE PROVIDER ERROR');
                if (options.truncated) return { data: Array.from({ length: 100 }, (_, i) => issue({ number: 600 + i })) };
                return { data: [issue({
                  ...(options.badDate ? { updated_at: null } : {}),
                  ...(options.old ? { updated_at: '2026-09-14T01:59:59Z' } : {}),
                }), { ...pr(), pull_request: {} }] };
              }
              if (resource === 'pulls') return { data: [pr()] };
              if (resource === 'issues/558') {
                reads++;
                return { data: issue({ labels: [label, ...(options.race && reads === 2 ? [] : ['state:active'])] }) };
              }
              if (resource === 'pulls/559') return { data: pr() };
              if (resource === 'pulls/559/files') return { data: files };
              throw new Error(`Unexpected route ${route}`);
            });
            return { request };
          }
          const observe = (github: any, maxPages = 20) => observeClassifications({ github, owner: 'test', repo: 'repo', now, policySha, maxPages });

          describe('#558 closed Issue lifecycle observation', () => {
            it.each(['state:active', 'candidate:active', 'state:reserve-ready', 'state:ready-for-promotion'])('detects stale closed label %s without rewriting labels', name => {
              const item = issue({ labels: [label, name] }); const saved = JSON.stringify(item);
              expect(inspectClassification(item).errors).toContain(`CLOSED_ITEM_ACTIVE_LABEL:${name}`);
              expect(inspectClassification(pr({ labels: [label, name] }), files).status).toBe('FAIL');
              expect(JSON.stringify(item)).toBe(saved);
              expect(inspectClassification(issue({ state: 'open', labels: [label, name] })).status).toBe('PASS');
            });
            it.each(['LANE_STATE: ACTIVE', 'LANE_STATE: READY_FOR_PROMOTION', 'ACTIVE_CANDIDATE: true'])('finds real stale declaration %s', line => {
              expect(inspectClassification(issue({ body: `WORKSTREAM: MODEL_GOVERNANCE\n${line}` })).errors.join(' ')).toMatch(/CLOSED_ITEM_ACTIVE_FIELD/);
            });
            it('does not turn quoted, fenced, indented or commented examples into current declarations', () => {
              const body = 'WORKSTREAM: MODEL_GOVERNANCE\nLANE_STATE: COMPLETE\nACTIVE_CANDIDATE: false\n'
                + '> LANE_STATE: ACTIVE\n```text\nACTIVE_CANDIDATE: true\n```\n'
                + '    LANE_STATE: ACTIVE\n<!-- ACTIVE_CANDIDATE: true -->\n';
              expect(inspectClassification(issue({ body })).status).toBe('PASS');
              expect(inspectClassification(issue({ labels: [label, 'state:complete', 'lane:governance'] })).status).toBe('PASS');
            });
            it('does not silently accept duplicate or malformed current lifecycle fields', () => {
              for (const tail of ['LANE_STATE: COMPLETE\nLANE_STATE: ACTIVE', 'ACTIVE_CANDIDATE: false\nACTIVE_CANDIDATE: true']) {
                expect(inspectClassification(issue({ body: `WORKSTREAM: MODEL_GOVERNANCE\n${tail}` })).errors.join(' ')).toContain('CLOSED_ITEM_AMBIGUOUS_FIELD');
              }
            });
            it('legacy classification does not hide a closed active lane', () => {
              const item = pr({ body: 'Historical work', created_at: '2026-08-01T00:00:00Z', labels: ['state:active'] });
              const result = inspectClassification(item, [{ filename: 'src/legacy.ts', status: 'modified' }]);
              expect(result.workstream).toBe('LEGACY_UNCLASSIFIED');
              expect(result.status).toBe('FAIL');
              expect(result.errors).toContain('CLOSED_ITEM_ACTIVE_LABEL:state:active');
            });
            it('actually inventories recent closed Issues, excludes duplicated PR rows, and preserves read-only behavior', async () => {
              const github = provider(); const report = await observe(github);
              expect(report.inventoryVersion).toBe(2);
              expect(report.issueScope).toBe('OPEN_AND_UPDATED_CLOSED_72H');
              expect(report.status).toBe('DRIFT_DETECTED');
              expect(report.counts).toEqual({ issues: 1, pullRequests: 1, checked: 2, legacy: 0 });
              expect(report.findings).toHaveLength(1);
              expect(report.findings[0]).toMatchObject({ number: 558, kind: 'ISSUE' });
              expect(report.findings[0].errors).toContain('CLOSED_ITEM_ACTIVE_LABEL:state:active');
              expect(github.request.mock.calls.filter(([r]) => r.endsWith('/pulls/559'))).toHaveLength(2);
            });
            it('a lifecycle-only label race is unavailable, not a stale successful snapshot', async () => {
              const report = await observe(provider({ race: true }));
              expect(report.status).toBe('EVIDENCE_UNAVAILABLE');
              expect(report.counts.checked).toBe(1);
              expect(report.unavailable).toContainEqual({ number: 558, kind: 'ISSUE', reason: 'EVIDENCE_UNAVAILABLE_INCOMPLETE_OR_CHANGED' });
              expect(report.findings).toHaveLength(0);
            });
            it.each([{ unavailable: true }, { truncated: true }, { badDate: true }])('failed closed inventory is unknown, not zero: %j', async options => {
              const report = await observe(provider(options), 1);
              expect(report.status).toBe('EVIDENCE_UNAVAILABLE');
              expect(report.counts.issues).toBeNull();
              expect(report.counts.pullRequests).toBe(1);
              expect(JSON.stringify(report)).not.toContain('PRIVATE PROVIDER ERROR');
            });
            it('only includes closed Issues updated inside the 72-hour window', async () => {
              const report = await observe(provider({ old: true }));
              expect(report.status).toBe('PASS');
              expect(report.counts).toEqual({ issues: 0, pullRequests: 1, checked: 1, legacy: 0 });
            });
            it('duplicate/moving inventory cannot be reported as a complete clean scan', async () => {
              const report = await observe(provider({ duplicate: true }));
              expect(report.status).toBe('EVIDENCE_UNAVAILABLE');
              expect(report.unavailable).toContainEqual({ reason: 'INVALID_OR_CHANGING_INVENTORY' });
            });
          });
          TS_TEST
          npm run guard:repo-integrity
          npm ci
          npm run typecheck
          npx vitest run tests/unit/closed-issue-watch.558.test.ts tests/unit/workstream-classification-prevention.520.test.ts
          python3 - <<'PY_MUTATION'
          from pathlib import Path
          import subprocess
          p=Path('scripts/agents/workstream-classification-watch.mjs'); original=p.read_text()
          mutations=[
          ("const closedIssues = await inventory('issues', { state: 'closed', sort: 'updated', direction: 'desc', since: new Date(cutoff).toISOString() }, true);", 'const closedIssues = [];'),
          ('workstreamLabels(item), lifecycleLabels(item)', 'workstreamLabels(item), []'),
          ]
          try:
            for i,(old,new) in enumerate(mutations,1):
              assert original.count(old)==1
              p.write_text(original.replace(old,new))
              result=subprocess.run(['npx','vitest','run','tests/unit/closed-issue-watch.558.test.ts'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(f'MUTATION_{i}_EXIT={result.returncode}')
              print(result.stdout[-18000:])
              assert result.returncode!=0, f'mutation {i} escaped'
          finally:
            p.write_text(original)
          PY_MUTATION
          npx vitest run tests/unit/closed-issue-watch.558.test.ts tests/unit/workstream-classification-prevention.520.test.ts
          npm test
          npm run build
          git diff --stat e17512320dcbca7baa16275e2f410d5c7aff4589
          git diff --check
          CURRENT_REMOTE=$(git ls-remote origin refs/heads/governance/issue-558-closed-watch | cut -f1)
          test "$CURRENT_REMOTE" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/agents/workstream-classification-watch.mjs tests/unit/closed-issue-watch.558.test.ts tests/unit/workstream-classification-prevention.520.test.ts docs/AGENT-EXECUTION.md docs/AGENT-PLAYBOOK.md
          git add -u .github/workflows/governance-558-workspace.yml
          git commit -m 'governance(#558): observe recently closed Issues and stale lifecycle evidence'
          git diff --name-only e17512320dcbca7baa16275e2f410d5c7aff4589 HEAD
          git rev-parse HEAD HEAD^{tree}
          git push origin HEAD:refs/heads/governance/issue-558-closed-watch
