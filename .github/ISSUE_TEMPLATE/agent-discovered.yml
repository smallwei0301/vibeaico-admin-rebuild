name: Agent-discovered issue
description: Required when an agent decides a newly discovered blocking gap must become a separate Issue. Classify the workstream before creation.
title: "[Agent-discovered] "
body:
  - type: input
    id: origin
    attributes:
      label: Issue origin
      description: Keep this fixed marker so the provenance hook can classify the Issue.
      value: AGENT_DISCOVERED
    validations:
      required: true

  - type: dropdown
    id: workstream
    attributes:
      label: WORKSTREAM
      description: Choose MODEL_GOVERNANCE only for pure model/agent/governance work. Any Product runtime, schema/migration, payment/refund, LINE/provider, tenant data or Product deployment work uses PRODUCT_MAINLINE. Mixed inseparable scope also uses PRODUCT_MAINLINE.
      options:
        - MODEL_GOVERNANCE
        - PRODUCT_MAINLINE
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent Issue / PR
      description: Link the Issue or PR where this gap was discovered.
      placeholder: "#123 / PR #456"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Discovered stage
      options:
        - SCOUT
        - TRIAGE
        - BUILD
        - DIAGNOSE
        - AUDIT
        - CLOSEOUT
    validations:
      required: true

  - type: dropdown
    id: firewall
    attributes:
      label: Scope Firewall reason
      description: Only these reasons may create a blocking Issue.
      options:
        - Claimed feature has no real side effect or persistence
        - Security, cross-tenant, data-loss, payment, refund, permission or real-notification risk
        - Acceptance item already required by the parent Issue or canonical spec
    validations:
      required: true

  - type: textarea
    id: why-separate
    attributes:
      label: Why this cannot remain in the parent Issue
      description: Explain why a separate Issue is necessary instead of finishing it in the parent scope.
    validations:
      required: true

  - type: dropdown
    id: blocks-goal
    attributes:
      label: Blocks current goal
      options:
        - "YES"
        - "NO, backlog only"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide the exact file, test, API response, CI step, screenshot or reproducible behavior.
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Requested model / actual model
      description: MODEL_GOVERNANCE uses requested=gpt-5.6-sol; actual=gpt-5.6-sol. Product work records the actual provider/model truth.
      placeholder: "requested=gpt-5.6-sol; actual=gpt-5.6-sol"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Duplicate and scope checks
      options:
        - label: I classified this Issue before creation. Pure governance is MODEL_GOVERNANCE; Product or inseparable mixed scope is PRODUCT_MAINLINE.
          required: true
        - label: I searched existing open Issues and PRs and did not find an equivalent active item.
          required: true
        - label: This is not a cosmetic idea, optional refactor, or non-blocking future enhancement.
          required: true
        - label: Creating this Issue will not stop the parent /goal; other safe work continues.
          required: true
